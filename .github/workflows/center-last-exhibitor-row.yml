name: Center final Exhibitor atlas row

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/center-last-exhibitor-row.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balance last row
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('desktop-exhibitor-profile.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="center-final-exhibitor-row">
          /* 11 items: center the final pair across a six-track grid */
          .exhibitor-grid{grid-template-columns:repeat(6,minmax(0,1fr))!important}
          .exhibitor-grid>.exhibitor-card{grid-column:span 2}
          .exhibitor-grid>.exhibitor-card:nth-last-child(2){grid-column:2 / span 2}
          .exhibitor-grid>.exhibitor-card:last-child{grid-column:4 / span 2}
          @media(max-width:1180px){
            .exhibitor-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
            .exhibitor-grid>.exhibitor-card,.exhibitor-grid>.exhibitor-card:nth-last-child(2),.exhibitor-grid>.exhibitor-card:last-child{grid-column:auto!important}
            .exhibitor-grid>.exhibitor-card:last-child{grid-column:1 / -1!important;width:50%!important;justify-self:center!important}
          }
          </style>'''
          if 'id="center-final-exhibitor-row"' in s:s=re.sub(r'<style id="center-final-exhibitor-row">.*?</style>',css,s,flags=re.S)
          else:s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-exhibitor-profile.html
          git diff --cached --quiet || git commit -m "Center final two Exhibitor cards with equal spacing"
          git push
