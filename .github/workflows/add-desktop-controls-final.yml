name: Install editor precision upgrade

on:
  push:
    paths:
      - '.github/workflows/add-desktop-controls-final.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/install_layout_editor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop*.html context.md
          git commit -m "Install movable editor and precision grids"
          git push
