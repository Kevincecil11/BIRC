name: Outline desktop pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/outline-desktop.yml'

permissions:
  contents: write

jobs:
  outline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          python3 - <<'PY'
          import re, os
          out=[]
          for f in ['desktop-rice-masterchef.html','desktop-plan-visit.html','desktop-contact.html','desktop-artists.html','desktop-creators.html','desktop-partnership.html']:
              raw=open(f,encoding='utf-8').read()
              ms=re.search(r'<a class="mobile-switch" href="([^"]*)"',raw)
              out.append('%s | refine=%s | brittle=%s | mobileSwitch=%s | bytes=%d' % (
                f,
                'YES' if 'id="desk-refine"' in raw else 'no',
                'YES' if 'body > main:nth-child' in raw else 'clean',
                ms.group(1) if ms else 'n/a',
                len(raw)))
          os.makedirs('audit',exist_ok=True)
          open('audit/verify.txt','w').write('\n'.join(out))
          print('\n'.join(out))
          PY
      - name: Commit
        run: |
          git config user.name 'birc-bot'
          git config user.email 'birc-bot@users.noreply.github.com'
          git add audit/verify.txt
          git commit -m 'Verify refine markers' || echo 'no changes'
          git push
