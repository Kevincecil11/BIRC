name: Force Media Uncached
on:
  push:
    paths:
      - '.github/workflows/force-media-uncached.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap to never-before-used stylesheet URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-media-coverage.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="assets/media-coverage-cabinet-final.css?v=20260820-2313">'
          new='<link rel="stylesheet" href="assets/media-coverage-final-2318.css">'
          assert old in s, 'old final stylesheet not found'
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/force-media-uncached.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-media-coverage.html .github/workflows/force-media-uncached.yml
          git commit -m 'Force uncached Media Coverage final design'
          git push
