<!doctype html><html><head><meta charset="utf-8"><script>if(!matchMedia('(min-width:900px)').matches)location.replace('conference.html')</script><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="assets/knowledge-sessions.css"></head><body><script>KS={num:'05',day:'Day 2',track:'Quality & Certification',title:'Why Buyers Reject Rice Shipments: Quality, Certification and Compliance',tag:'Rejection is often the final symptom of an earlier process failure.',image:'https://birc.in/images/knowledge-sessions/s05-quality.webp',intro:['A rice shipment may be rejected because the product does not match the agreed specification, a test result exceeds the destination limit, the documentation is incomplete or the evidence does not support the claim being made.','This session will trace rejection risk from procurement and milling through sampling, testing, certification, loading and destination clearance, showing where prevention must begin.'],why:'Quality failure affects more than one cargo. It can create claims, reprocessing, delayed payment, lost listings and long-term damage to buyer confidence. A reliable quality system gives exporters and buyers a shared basis for specifications, evidence and corrective action.',scope:['Common rejection causes: Variety mismatch, moisture, broken percentage, foreign matter, infestation, odour, contamination, age and packaging failure.','Chemical and regulatory risk: Pesticide residues, heavy metals, mycotoxins and destination-specific limits or testing expectations.','Contract specifications: Converting buyer expectations into measurable parameters, tolerances, sampling methods and agreed inspection points.','Sampling and laboratory testing: Representative samples, chain of custody, accredited laboratories, retesting and conflicting results.','Certification strategy: Quality, food-safety, organic, sustainability, origin and market-access certifications, including what each does and does not prove.','Traceability: Linking supplier, lot, process, storage, test result, packaging and shipment documents into a defensible record.','Pre-shipment control: Mill release, inspection, container hygiene, fumigation, seal management, certificate review and loading evidence.','Complaints and corrective action: Containing the issue, investigating root cause, preserving commercial relationships and preventing recurrence.'],take:['A clearer map of where shipment-rejection risk enters the supply chain.','A specification and pre-shipment review checklist.','Better understanding of sampling, testing and evidence quality.','A framework for selecting certifications based on market and buyer need.','A root-cause approach to complaints instead of one-time correction.'],attends:['Rice exporters, importers and procurement teams','Mill owners, plant heads and quality-control teams','Laboratories, inspection companies and certification bodies','Food-safety, traceability and compliance professionals','Retail, food-service and private-label buyers'],panel:['Rice quality or food-safety specialist','Accredited laboratory or inspection professional','Certification and destination-compliance expert','International buyer or quality-assurance leader'],faq:[['Will the session cover destination-specific standards?','It should compare major types of destination requirements and explain how businesses can build a verification process. Final limits must always be checked against current official rules.'],['Is certification enough to prevent rejection?','No. Certification supports a quality system, but product conformity, sampling, testing, traceability, documentation and shipment handling still determine the outcome.'],['Will the session be relevant to buyers as well as exporters?','Yes. Buyers benefit from stronger specifications, supplier qualification, inspection design and evidence-based complaint handling.']],close:['Build quality into the shipment before the final test.','Join the BIRC 2026 discussion on the systems that protect compliance, payment and buyer confidence.']}</script><script src="assets/knowledge-render.js"></script></body></html>
