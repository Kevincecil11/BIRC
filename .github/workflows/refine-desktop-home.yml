name: Refine desktop homepage navigation and hero

on:
  push:
    paths:
      - '.github/workflows/refine-desktop-home.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/center_dates_align_experience.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html context.md
          git commit -m "Center dates and align Experience title to stage"
          git push
