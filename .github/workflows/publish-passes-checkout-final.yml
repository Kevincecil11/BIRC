name: Publish Passes Checkout Final
on:
  push:
    paths:
      - '.github/workflows/publish-passes-checkout-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach navbar and alignment layers
        run: |
          python - <<'PY'
          from pathlib import Path
          cssnav='<link rel="stylesheet" href="assets/desktop-nav-option15-global.css?v=20260820-2353">'
          css='<link rel="stylesheet" href="assets/passes-checkout-final.css?v=20260820-2353">'
          nav='<script src="assets/desktop-nav-option15-global.js?v=20260820-2353"></script>'
          for name in ('passes.html','checkout.html'):
              p=Path(name);s=p.read_text()
              if 'passes-checkout-final.css' not in s:s=s.replace('</head>',cssnav+css+'</head>',1)
              if name=='checkout.html' and 'checkout-page-marker.js' not in s:s=s.replace('</body>','<script src="assets/checkout-page-marker.js"></script>'+nav+'</body>',1)
              elif name=='passes.html' and 'desktop-nav-option15-global.js?v=20260820-2353' not in s:s=s.replace('</body>',nav+'</body>',1)
              p.write_text(s)
          Path('.github/workflows/publish-passes-checkout-final.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add passes.html checkout.html .github/workflows/publish-passes-checkout-final.yml
          git commit -m 'Publish navbar and final alignment for Passes checkout'
          git push
