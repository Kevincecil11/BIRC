name: Universal mobile drawer
on:
  push:
    branches: [main]
    paths:
      - 'assets/mobile-drawer-universal.css'
      - '.github/workflows/mobile-drawer-universal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply universal drawer to every mobile page
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html','creators.html','rice-masterchef.html','artists.html','partnership.html','plan-visit.html','contact.html']
          tag='<link rel="stylesheet" href="assets/mobile-drawer-universal.css?v=20260826-1">'
          for name in pages:
              p=Path(name); s=p.read_text()
              if tag not in s: s=s.replace('</head>',tag+'</head>')
              p.write_text(s)
          p=Path('context.md'); s=p.read_text()
          old='The sandwich menu uses 20px primary links and 14px indented submenu links with consistent 54px/46px rows, even when Mobile view is forced in a wide desktop browser.'
          new='The sandwich menu is a fixed, centered, full-height 520px drawer with internal scrolling, 20px primary links and 14px indented submenu links in consistent 54px/46px rows on every mobile page. It never participates in page flow or overlaps the About hero.'
          s=s.replace(old,new); p.write_text(s)
          Path('publish-refresh.html').write_text('<!doctype html><meta charset="utf-8"><title>BIRC publish marker</title><!-- universal mobile drawer 2026-08-26 -->\n')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html conference.html exhibition.html experience.html creators.html rice-masterchef.html artists.html partnership.html plan-visit.html contact.html context.md publish-refresh.html
          git commit -m "Apply universal mobile drawer and fix About overlap"
          git push
