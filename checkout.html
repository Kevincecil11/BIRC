<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIRC 2026 Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--j:#0d0d0b;--l:#faf0e6;--paper:#fffaf2;--g:#ebb341;--g2:#c98e25;--lm:#6d6862;--ll:#d8cec3}*{box-sizing:border-box}body{margin:0;background:var(--l);color:var(--j);font:400 15px/1.55 Inter,sans-serif}.top{height:74px;border-bottom:1px solid var(--ll)}.top div{width:min(1120px,calc(100% - 44px));height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.top img{width:145px;height:48px;object-fit:contain;filter:invert(1)}.secure{font:600 9px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase}.main{width:min(1120px,calc(100% - 44px));margin:auto;padding:54px 0 90px}.intro{text-align:center}.intro h1{margin:0;font:600 clamp(38px,4vw,60px)/.95 Poppins,sans-serif;letter-spacing:-.06em}.intro p{color:var(--lm)}.steps{margin-top:32px;padding:20px 28px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--ll)}.step{text-align:center;color:var(--lm);font:600 10px Poppins,sans-serif}.step.active{color:var(--j)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;margin-top:18px;align-items:start}.panel,.summary{background:var(--paper);border:1px solid var(--ll)}.panel h2,.summary h2{margin:0;padding:20px 22px;border-bottom:1px solid var(--ll);font:600 16px Poppins,sans-serif}.form{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font:600 10px Poppins,sans-serif}.field input,.field select{height:48px;padding:0 12px;border:1px solid var(--ll);background:transparent}.summary{padding-bottom:20px}.sum-body{padding:22px}.item,.line,.total{display:flex;justify-content:space-between;gap:18px}.item{padding-bottom:18px;border-bottom:1px solid var(--ll)}.line{margin-top:14px}.total{margin-top:20px;padding-top:18px;border-top:1px solid var(--ll);font:600 22px Poppins,sans-serif}.pay{width:calc(100% - 44px);height:52px;margin:22px;border:0;background:var(--g);font:600 11px Poppins,sans-serif;cursor:pointer}.notice{margin:0 22px 8px;color:var(--lm);font-size:11px}@media(max-width:800px){.layout{grid-template-columns:1fr}.summary{order:-1}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:520px){.main{width:100%;padding:42px 16px 70px}.steps{padding-inline:8px}.form{padding:18px}.top div{width:calc(100% - 28px)}}</style><link rel="stylesheet" href="assets/desktop-nav-option15-global.css?v=20260820-2353"><link rel="stylesheet" href="assets/passes-checkout-final.css?v=20260820-2353"></head><body><header class="top"><div><a href="passes.html"><img src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"></a><span class="secure">Secure checkout prototype</span></div></header><main class="main"><header class="intro"><h1>Complete your checkout.</h1><p>Billing first. Payment gateway connection comes later.</p></header><div class="steps"><span class="step active">01 Order details</span><span class="step">02 Payment</span><span class="step">03 Complete</span></div><div class="layout"><section class="panel"><h2>Billing information</h2><form class="form"><div class="field"><label>Full name *</label><input placeholder="Enter your full name"></div><div class="field"><label>Email address *</label><input id="email" placeholder="you@company.com"></div><div class="field"><label>Phone number *</label><input placeholder="Enter phone number"></div><div class="field"><label>Country *</label><select><option>India</option><option>United Arab Emirates</option><option>United Kingdom</option><option>United States</option></select></div><div class="field full"><label>Company name *</label><input placeholder="Company or organisation"></div><div class="field full"><label>Address *</label><input placeholder="Billing address"></div><div class="field"><label>City *</label><input placeholder="City"></div><div class="field"><label>State *</label><input placeholder="State"></div><div class="field"><label>ZIP code *</label><input placeholder="ZIP code"></div><div class="field full"><label>GST / VAT / Tax ID (optional)</label><input placeholder="Tax ID"></div></form></section><aside class="summary"><h2>Payment summary</h2><div class="sum-body"><div class="item"><span id="passName">Standard × 1</span><b id="base">₹6,000</b></div><div class="line"><span>Subtotal</span><span id="subtotal">₹6,000</span></div><div class="line"><span>GST (18%)</span><span id="gst">₹1,080</span></div><div class="total"><span>Total</span><span id="total">₹7,080</span></div></div><button class="pay" id="pay">Proceed to payment</button><p class="notice">Design prototype only. No payment will be taken.</p></aside></div></main><script>const passes={vip:['VIP',35000,41300],standard:['Standard',6000,7080],festival:['Rice Festival Day 3',600,708]},q=new URLSearchParams(location.search),key=q.get('pass')||'standard',v=passes[key]||passes.standard;function m(n){return '₹'+n.toLocaleString('en-IN')}passName.textContent=v[0]+' × 1';base.textContent=subtotal.textContent=m(v[1]);gst.textContent=m(v[2]-v[1]);total.textContent=m(v[2]);let identity=q.get('identity')||'';if(identity.includes('@'))email.value=identity;pay.onclick=()=>alert('Payment gateway will connect here in the next phase.');</script><script src="assets/checkout-page-marker.js"></script><script src="assets/desktop-nav-option15-global.js?v=20260820-2353"></script></body></html>
