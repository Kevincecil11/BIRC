name: Fix desktop registration forms and participation heading

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-desktop-registration-and-heading.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop registration system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Homepage heading: one complete line
          hp=Path('desktop.html')
          s=hp.read_text(encoding='utf-8')
          css=r'''<style id="participation-heading-one-line">
          #pathways .sechead>div{max-width:none!important}
          #pathways .sechead h2{max-width:none!important;width:max-content!important;white-space:nowrap!important;font-size:clamp(38px,3.2vw,58px)!important}
          @media(max-width:1280px){#pathways .sechead h2{font-size:40px!important}}
          </style>'''
          if 'id="participation-heading-one-line"' in s:s=re.sub(r'<style id="participation-heading-one-line">.*?</style>',css,s,flags=re.S)
          else:s=s.replace('</head>',css+'\n</head>',1)
          hp.write_text(s,encoding='utf-8')

          # Registration page: same functional form, genuine desktop composition
          rp=Path('register.html')
          r=rp.read_text(encoding='utf-8')
          r=r.replace('https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png','https://ik.imagekit.io/18ab23oqaj/birc.png')
          desktop=r'''<style id="desktop-registration-system">
          .logo{filter:none!important;mix-blend-mode:normal!important;object-fit:contain!important;object-position:left center!important}
          @media(min-width:900px){
            body{min-height:100vh;background:var(--j);color:var(--j);overflow-x:hidden}
            body:before{content:"";position:fixed;inset:0 50% 0 0;background:radial-gradient(720px 520px at 75% 22%,#ebb34124,transparent 66%),repeating-linear-gradient(116deg,transparent 0 72px,#faf0e605 72px 73px),var(--j);pointer-events:none}
            body:after{content:"India at the centre. Every rice market in the room.";position:fixed;z-index:1;left:max(48px,calc((50vw - 680px)/2));bottom:64px;width:34vw;max-width:540px;color:var(--l);font:600 clamp(34px,3.2vw,58px)/1.02 Poppins,sans-serif;letter-spacing:-.05em;text-wrap:balance;pointer-events:none}
            .page{position:relative;z-index:2;width:min(1280px,calc(100% - 96px));min-height:calc(100vh - 80px);margin:40px auto;padding:0;display:grid;grid-template-columns:minmax(390px,.85fr) minmax(560px,1.15fr);background:transparent}
            .bar{grid-column:1;height:auto;min-height:100%;padding:44px;display:flex;align-items:flex-start;justify-content:space-between;border:1px solid var(--line,#35332e);border-right:0;background:#0d0d0bcc;color:var(--l)}
            .logo{width:210px;height:72px}
            .close{border-color:#35332e;color:var(--l);cursor:pointer}
            #formView,.success{grid-column:2;padding:48px 58px 42px;background:var(--l);border:1px solid var(--ll);min-height:100%}
            .head{padding:0 0 34px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
            .head .eye{grid-column:1}.head h1{grid-column:1;margin:12px 0 0;font-size:clamp(34px,3vw,48px)}
            .steps{grid-column:2;grid-row:1/3;align-self:center}
            .fields{grid-template-columns:1fr 1fr;gap:20px 24px}
            .field{min-width:0}.field:nth-child(3),.field:nth-child(4),.field:nth-child(5),.fields>.check{grid-column:1/-1}
            .field:nth-child(3){grid-column:1/2}.fields>.check:nth-of-type(1){grid-column:2;align-self:end;padding-bottom:15px}
            .field:nth-child(5){grid-column:2}.fields>.check:nth-of-type(2){grid-column:1;align-self:center}
            .field input,.field select{background:#fffaf2}
            .industries{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
            .actions{margin-top:28px}.legal{text-align:left;margin-top:26px}
            .success{display:none;align-content:center}.success.active{display:grid}.success .mark{margin:0}.success h2{text-align:left}.success p{text-align:left}.success .btn{max-width:360px}
          }
          @media(min-width:900px) and (max-width:1120px){
            .page{width:calc(100% - 48px);grid-template-columns:330px minmax(0,1fr)}
            .bar{padding:30px}.logo{width:175px;height:60px}
            #formView,.success{padding:38px 42px}
          }
          </style>'''
          if 'id="desktop-registration-system"' in r:r=re.sub(r'<style id="desktop-registration-system">.*?</style>',desktop,r,flags=re.S)
          else:r=r.replace('</head>',desktop+'\n</head>',1)
          # Close/finish should return to desktop homepage on desktop
          r=r.replace("closeBtn.onclick=finish.onclick=()=>location.href='index.html'","closeBtn.onclick=finish.onclick=()=>location.href=matchMedia('(min-width:900px)').matches?'desktop.html':'index.html'")
          rp.write_text(r,encoding='utf-8')
          print('Updated homepage heading and all visitor/exhibitor/buyer registration states.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html register.html
          git diff --cached --quiet || git commit -m "Make registration forms desktop-native and keep participation heading on one line"
          git push
