<!doctype html><html><head><meta charset="utf-8"><script>if(!matchMedia('(min-width:900px)').matches)location.replace('conference.html')</script><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="assets/knowledge-sessions.css"><link rel="stylesheet" href="assets/desktop-typography.css"></head><body><script>KS={num:'07',day:'Day 2',track:'Sustainability & Carbon Credits',title:'Sustainability and Carbon Credits in Rice: Can the Business Case Work?',tag:'A carbon credit is not created by a claim. It is created by evidence.',image:'https://birc.in/images/knowledge-sessions/s07-sustainability.webp',intro:['Rice production can create measurable greenhouse-gas emissions, particularly through water and residue management. This has placed rice at the centre of new sustainability programmes and carbon-market interest.','The commercial question is more difficult: can a project deliver credible reductions, fair farmer participation and enough revenue to justify implementation, monitoring, verification and long-term obligations?'],why:'Sustainability is increasingly connected to buyer expectations, finance, supply security and brand credibility. Yet weak project design can create high costs, uncertain credit issuance or claims that cannot be defended. This session will separate genuine operating improvement from marketing language and examine where value can realistically be created.',scope:['Rice emissions profile: Methane, fertiliser, energy, water, residue and milling-related sources across the value chain.','Reduction pathways: Alternate wetting and drying, direct-seeded rice, improved inputs, residue management, renewable energy and efficiency.','Carbon-project fundamentals: Baseline, additionality, permanence, leakage, project boundary and crediting period.','Measurement, reporting and verification: Field data, remote sensing, sampling, digital records, audits and uncertainty.','Project models: Farmer groups, mill-led supply chains, cooperatives, aggregators, project developers and buyer-supported programmes.','Economics: Implementation cost, farmer incentives, verification expense, credit yield, revenue share, market price and time to issuance.','Integrity and claims: Avoiding double counting, over-crediting, unsupported labels and reputational or regulatory exposure.','Beyond credits: Water, soil, yield stability, energy savings, residue value, buyer access and resilience as additional business outcomes.'],take:['A plain-language understanding of how rice carbon projects are structured.','A checklist for evaluating methodology, partner credibility and MRV capability.','A realistic view of cost, revenue timing and farmer incentive design.','Better distinction between carbon-credit income and wider sustainability value.','Questions to ask before signing a project, data or credit-purchase agreement.'],attends:['Farmers, farmer organisations and rice millers','Exporters, brands and sustainability teams','Carbon project developers, registries and MRV providers','Banks, investors, insurers and development organisations','International buyers and supply-chain programme leaders'],panel:['Rice agronomy or methane-reduction specialist','Carbon methodology, registry or verification professional','Farmer-organisation or project-implementation leader','Buyer, investor or miller with a supply-chain sustainability programme'],faq:[['Does every sustainability activity generate carbon credits?','No. A crediting project must meet an applicable methodology and demonstrate measurable, additional and verified reductions. Many useful improvements may create value without generating credits.'],['Are carbon credits guaranteed to be profitable?','No. Commercial viability depends on implementation cost, verified reductions, credit price, revenue sharing, verification cycles and project risk.'],['Will farmer economics be part of the discussion?','Yes. Farmer incentive, data burden, operational practicality and fair benefit sharing should be central to the session.']],close:['Test the business case before making the claim.','Join BIRC 2026 for a practical discussion on credible sustainability and commercially responsible carbon opportunities in rice.']}</script><script src="assets/knowledge-render.js"></script></body></html>
