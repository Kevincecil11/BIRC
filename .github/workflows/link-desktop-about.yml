name: Link desktop About page
on:
  push:
    paths: ['.github/workflows/link-desktop-about.yml']
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop.html'); h=p.read_text(); h=h.replace('href="about.html">About</a>','href="desktop-about.html">About</a>'); p.write_text(h)
          p=Path('context.md'); c=p.read_text(); note='''\n## Desktop About page\n\n- `desktop-about.html` is the purpose-built desktop About experience.\n- It preserves the approved mobile About content while using desktop-native hero, mission, three-column values, split story, results, organisers, Advisory Board, industry overview, registration chooser, and quick-action dock.\n- The mobile `about.html` remains unchanged.\n''';
          if '## Desktop About page' not in c:p.write_text(c.rstrip()+note)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html context.md
          git commit -m "Link desktop navigation to desktop About page"
          git push
