name: Make Experience page Grain Field only
on:
  push:
    branches: [main]
    paths: [.github/workflows/make-grain-field-only.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stacked zone sections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/experience-grain-field.js')
          s=p.read_text()
          start=s.index("main.innerHTML='<section class=\"gf-field\"")
          end=s.index("';\nvar picker=",start)+2
          field="""main.innerHTML='<section class="gf-field"><canvas class="gf-canvas" aria-hidden="true"></canvas><div class="gf-top"><span class="gf-eye">Experience Zones · BIRC 2026</span><p>Move the cursor through the field. The grains part, then settle back into formation.</p></div><div class="gf-copy"><small class="gf-count">01 / 09 · '+zones[0][1]+'</small><h1>'+zones[0][0]+'</h1><p>'+zones[0][2]+'</p></div><div><nav class="gf-picker" aria-label="Choose an Experience Zone"></nav><div class="gf-hint">Nine worlds · one grain field</div></div></section>';"""
          s=s[:start]+field+s[end:]
          s=s.replace("var picker=main.querySelector('.gf-picker'),list=main.querySelector('.gf-zones'),copy=main.querySelector('.gf-copy');","var picker=main.querySelector('.gf-picker'),copy=main.querySelector('.gf-copy');")
          loop_start=s.index("zones.forEach(function(z,i){")
          loop_end=s.index("\nvar canvas=",loop_start)
          loop="""zones.forEach(function(z,i){var b=document.createElement('button');b.className='gf-pick';b.type='button';b.setAttribute('aria-selected',i===0?'true':'false');b.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b><span>'+z[0]+'</span>';b.onclick=function(){select(i)};picker.appendChild(b)});"""
          s=s[:loop_start]+loop+s[loop_end:]
          old="function select(i,scroll){active=i;picker.querySelectorAll('button').forEach(function(b,k){b.setAttribute('aria-selected',k===i?'true':'false')});copy.innerHTML='<small class=\"gf-count\">'+String(i+1).padStart(2,'0')+' / 09 · '+zones[i][1]+'</small><h1>'+zones[i][0]+'</h1><p>'+zones[i][2]+'</p>';shape(i);if(scroll)document.getElementById('gf-zone-'+(i+1)).scrollIntoView({behavior:'smooth',block:'start'})}"
          new="function select(i){active=i;picker.querySelectorAll('button').forEach(function(b,k){b.setAttribute('aria-selected',k===i?'true':'false')});copy.innerHTML='<small class=\"gf-count\">'+String(i+1).padStart(2,'0')+' / 09 · '+zones[i][1]+'</small><h1>'+zones[i][0]+'</h1><p>'+zones[i][2]+'</p>';shape(i)}"
          if old not in s: raise SystemExit('select marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('assets/experience-grain-field.css')
          s=p.read_text()
          s += '\n/* Single-screen Experience direction */\n.gf-main{height:100vh;overflow:hidden}.gf-field{height:100vh;min-height:100vh;padding-top:144px;padding-bottom:30px}.gf-main~.footer,.gf-main~.quick{display:none!important}.gf-copy{max-width:620px}.gf-copy h1{font-size:clamp(54px,5.4vw,96px)}.gf-copy p{max-width:32ch}.gf-picker{margin-top:18px}.gf-pick{min-height:66px;padding:10px 11px}.gf-hint{margin-top:10px}\n'
          p.write_text(s)
          PY
          rm .github/workflows/make-grain-field-only.yml
      - name: Commit single-view Experience page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/experience-grain-field.js assets/experience-grain-field.css .github/workflows/make-grain-field-only.yml
          git commit -m "Keep only the Grain Field Experience view"
          git push origin main
