name: Add floating action dock

on:
  push:
    paths:
      - '.github/workflows/add-floating-actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace('Not built for three days','Built for year-round progress')

          css='''/* Floating action dock */.action-dock{position:fixed;z-index:69;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:92px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.action-list{display:grid;gap:8px;opacity:0;transform:translateY(12px) scale(.96);transform-origin:bottom right;pointer-events:none;transition:opacity .25s var(--e),transform .3s var(--e)}.action-dock.open .action-list{opacity:1;transform:none;pointer-events:auto}.action-link{min-height:44px;padding:0 14px;display:flex;align-items:center;justify-content:flex-end;gap:10px;background:var(--j2);color:var(--l);border:1px solid var(--dl);font:600 9px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 22px #0006}.action-link span{width:22px;height:22px;display:grid;place-items:center;background:var(--g);color:var(--j);font-size:11px}.action-link.primary{background:var(--g);color:var(--j);border-color:var(--g)}.action-link.primary span{background:var(--j);color:var(--g)}.action-toggle{width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:var(--j);display:grid;place-items:center;font:600 24px/1 Poppins,sans-serif;box-shadow:0 10px 28px #0008;transition:transform .3s var(--e)}.action-dock.open .action-toggle{transform:rotate(45deg)}.action-toggle:focus-visible,.action-link:focus-visible{outline:3px solid var(--l);outline-offset:2px}.action-backdrop{position:fixed;z-index:68;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .2s}.action-backdrop.on{opacity:1;pointer-events:auto}/* Gallery 20% larger */.gallery-img{width:258px!important;height:206px!important}.gallery-img:nth-child(even){width:312px!important}.gallery-run{gap:4px!important}@media(prefers-reduced-motion:reduce){.action-list,.action-toggle,.action-backdrop{transition:none}}'''
          if '/* Floating action dock */' not in s:s=s.replace('</style></head>',css+'</style></head>',1)

          dock='''<div class="action-backdrop" id="actionBackdrop"></div><aside class="action-dock" id="actionDock" aria-label="Quick actions"><div class="action-list" id="actionList"><a class="action-link primary" href="#register">Book your stand <span>▣</span></a><a class="action-link" href="#register">Register to visit <span>↗</span></a><a class="action-link" href="#">Login <span>→</span></a><a class="action-link" href="https://wa.me/" aria-label="Open WhatsApp">WhatsApp <span>◉</span></a></div><button class="action-toggle" id="actionToggle" aria-label="Open quick actions" aria-expanded="false">+</button></aside>'''
          if 'id="actionDock"' not in s:s=s.replace('<div class="sticky" id="sticky">',dock+'<div class="sticky" id="sticky">',1)

          js="""const actionDock=document.getElementById('actionDock'),actionToggle=document.getElementById('actionToggle'),actionBackdrop=document.getElementById('actionBackdrop');function toggleActions(force){const open=typeof force==='boolean'?force:!actionDock.classList.contains('open');actionDock.classList.toggle('open',open);actionBackdrop.classList.toggle('on',open);actionToggle.setAttribute('aria-expanded',String(open));actionToggle.setAttribute('aria-label',open?'Close quick actions':'Open quick actions')}actionToggle.addEventListener('click',()=>toggleActions());actionBackdrop.addEventListener('click',()=>toggleActions(false));actionDock.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>toggleActions(false)));addEventListener('keydown',e=>{if(e.key==='Escape')toggleActions(false)});"""
          if 'const actionDock=' not in s:s=s.replace('</script></body></html>',js+'</script></body></html>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          s=s.replace('Not built for three days','Built for year-round progress')
          note='''\n### Homepage quick-action dock\n\nThe homepage has one floating circular `+` button to avoid clutter. Tapping it reveals four stacked actions: Book your stand, Register to visit, Login, and WhatsApp. Tapping outside, choosing an action, or pressing Escape closes it. Final Login and WhatsApp destination URLs are still pending and must not be invented.\n\n### Homepage gallery scale\n\nBIRC in pictures image/video placeholders are intentionally 20% larger than the earlier gallery dimensions. Preserve this scale unless explicitly changed.\n'''
          if '### Homepage quick-action dock' not in s:s=s.replace('## 7. Design decisions that must persist',note+'\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html context.md
          git commit -m 'Add floating quick actions and enlarge BIRC gallery'
          git push
