name: Restore Conference page
on:
  push:
    paths: ['.github/workflows/restore-conference.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous Conference implementation
        run: |
          git show c249daec0798f4c86115ab0ed9cf7077de279f22:conference.html > conference.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conference.html
          git commit -m 'Restore Conference page before latest iteration'
          git push
