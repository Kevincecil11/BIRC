name: Outline desktop pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/outline-desktop.yml'

permissions:
  contents: write

jobs:
  outline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append context
        run: |
          cat >> context.md <<'MD'

## Plan Visit + Contact rebuilt from scratch (2026-08-08, later)

- Root cause of the broken grid lines: both pages carried FOUR competing stylesheets (mobile base, an anonymous desktop block, #dt-polish, #desk-refine). The mobile border rules (.venue-row:last-child{border:0}, .route:nth-child(odd){border-right}, .route:nth-child(n+3){border-bottom:0}, container border-block) survived every override and drew half-finished lines around cells. Adding more overrides could never fix it.
- Both desktop-plan-visit.html and desktop-contact.html are now standalone single-stylesheet documents. No mobile CSS, no override layers. Same shared desktop system as desktop-partnership.html: --sh 1320px shell, --side gutter, 76px masthead, left-aligned heads, 132px section rhythm.
- STANDING RULE for connected grids: never rely on per-cell borders. Use gap:1px with the line colour as the grid background and the surface colour on each cell (.mesh.light uses --ll lines on --l cells, .mesh.dark uses --dl lines on --j2 cells). Every cell shares a hairline, nothing dangles, and orphan cells are impossible to see.
- Plan Visit: venue stats are a connected 2x2. Hotels are a 3-up where the third cell is an honest "full list coming" panel so the row is never orphaned. Travel is now a sticky left tab rail with the panel on the right and route rows in connected 2-up grids; every panel was padded to an even cell count.
- Plan Visit fares: the metro fare figures were removed (both instances of the airport one and the New Delhi Railway one) because a fare-less row next to a fare row read as unfinished. The taxi estimate was kept as it is genuinely useful.
- Contact: the four route cards are now a connected 2x2 instead of a 3-up with an orphan fourth. Official details is a 3-up of fully bordered ink panels plus a full-width social row. The enquiry form keeps the gold section with linen panel, two-column fields, full-width message and left-aligned ink submit.
- Mobile files untouched. plan-visit.html on mobile still carries the metro fare figures.
MD
      - name: Commit
        run: |
          git config user.name 'birc-bot'
          git config user.email 'birc-bot@users.noreply.github.com'
          git add context.md
          git commit -m 'Log plan visit and contact rebuilds' || echo 'no changes'
          git push
