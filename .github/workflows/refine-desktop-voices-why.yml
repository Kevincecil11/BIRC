name: Refine desktop voices and Why BIRC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-desktop-voices-why.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine targeted desktop sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop.html')
          html=p.read_text()

          old_voices='''  <section class="voices light section" id="voices">
    <div class="shell" style="display:block">
      <header class="sechead" style="margin-bottom:56px">
        <span class="eyebrow">Voices of the industry</span>
        <div><h2 class="d2">What leaders say</h2></div>
      </header>
    </div>
    <div class="shell">
      <div>
        <div class="qmark" aria-hidden="true">&ldquo;</div>
        <figure class="quote">
          <blockquote id="quoteText">BIRC redefined how we see global rice trade.</blockquote>
          <figcaption><b id="quoteName">Priya Nair</b><span id="quoteRole">Director, Global Grain Council</span></figcaption>
        </figure>
      </div>
      <div class="voicelist" id="voicelist"></div>
    </div>
  </section>'''

          new_voices='''  <section class="voices light section" id="voices">
    <div class="shell voices-layout">
      <header class="voices-intro">
        <span class="eyebrow">Voices of the industry</span>
        <h2>What leaders say</h2>
        <p>Four perspectives from across global trade, policy, and industry.</p>
        <div class="voice-progress" aria-hidden="true"><i id="voiceProgress"></i></div>
      </header>
      <div class="voice-stage" aria-live="polite">
        <div class="voice-index" id="voiceIndex">01 / 04</div>
        <div class="qmark" aria-hidden="true">&ldquo;</div>
        <figure class="quote">
          <blockquote id="quoteText">BIRC redefined how we see global rice trade.</blockquote>
          <figcaption><b id="quoteName">Priya Nair</b><span id="quoteRole">Director, Global Grain Council</span></figcaption>
        </figure>
      </div>
      <div class="voicelist" id="voicelist" aria-label="Select a leader quote"></div>
    </div>
  </section>'''

          old_why='''  <section class="section" id="why">
    <div class="shell">
      <header class="sechead">
        <span class="eyebrow">Why BIRC</span>
        <div>
          <h2 class="d2">One platform, every pillar</h2>
          <p class="lede">Four reasons the global rice industry meets here.</p>
        </div>
      </header>
      <div class="reasons">
        <article class="reason"><span>01</span><span class="word" aria-hidden="true">INDIA</span><div class="reason-copy"><h3>India-anchored, globally led</h3><p>We root the world's rice conversation in India, then open it to every market that trades in grain.</p></div></article>
        <article class="reason"><span>02</span><span class="word" aria-hidden="true">TRADE</span><div class="reason-copy"><h3>Trade, innovation, knowledge</h3><p>Every pillar of the industry under one roof, including sustainability and policy.</p></div></article>
        <article class="reason"><span>03</span><span class="word" aria-hidden="true">365</span><div class="reason-copy"><h3>Built for year-round progress</h3><p>A year-round community that convenes at the summit but never ends.</p></div></article>
        <article class="reason"><span>04</span><span class="word" aria-hidden="true">ONE</span><div class="reason-copy"><h3>Everyone wins together</h3><p>Growth for the entire rice ecosystem, not a smaller slice for a few.</p></div></article>
      </div>
      <p class="whyclose">India at the centre. <span>Every market in the room.</span></p>
    </div>
  </section>'''

          new_why='''  <section class="section why-section" id="why">
    <div class="shell">
      <header class="why-head">
        <div><span class="eyebrow">Why BIRC</span><span class="why-count">04 principles</span></div>
        <div><h2>One platform,<br>every pillar.</h2><p>Four reasons the global rice industry meets here.</p></div>
      </header>
      <div class="reasons">
        <article class="reason"><span class="reason-no">01</span><span class="word" aria-hidden="true">INDIA</span><div class="reason-copy"><h3>India-anchored,<br>globally led</h3><p>We root the world's rice conversation in India, then open it to every market that trades in grain.</p></div></article>
        <article class="reason"><span class="reason-no">02</span><span class="word" aria-hidden="true">TRADE</span><div class="reason-copy"><h3>Trade, innovation,<br>knowledge</h3><p>Every pillar of the industry under one roof, including sustainability and policy.</p></div></article>
        <article class="reason"><span class="reason-no">03</span><span class="word" aria-hidden="true">365</span><div class="reason-copy"><h3>Built for year-round<br>progress</h3><p>A year-round community that convenes at the summit but never ends.</p></div></article>
        <article class="reason"><span class="reason-no">04</span><span class="word" aria-hidden="true">ONE</span><div class="reason-copy"><h3>Everyone wins<br>together</h3><p>Growth for the entire rice ecosystem, not a smaller slice for a few.</p></div></article>
      </div>
      <div class="whyclose"><span>India at the centre.</span><strong>Every market in the room.</strong></div>
    </div>
  </section>'''

          if old_voices not in html: raise SystemExit('Voices block not found')
          if old_why not in html: raise SystemExit('Why block not found')
          html=html.replace(old_voices,new_voices)
          html=html.replace(old_why,new_why)

          css='''<style id="desktop-targeted-refinement">
          /* Register action: remove browser button chrome and restore BIRC gold */
          button.textlink{appearance:none;width:max-content;padding:0;border:0;background:transparent;color:var(--gold);text-align:left;cursor:pointer}
          button.textlink:hover,button.textlink:focus-visible{color:#f5c257;background:transparent}
          .path:first-child{border-color:var(--dl)}
          .path:first-child:hover{border-color:var(--gold-deep)}

          /* What leaders say: editorial feature, not a generic testimonial list */
          .voices{overflow:hidden}
          .voices .voices-layout{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto auto;gap:0 72px;align-items:stretch}
          .voices-intro{grid-column:1;grid-row:1/3;padding:10px 0 0;display:flex;flex-direction:column;border-top:1px solid var(--ll)}
          .voices-intro .eyebrow{padding-top:22px}
          .voices-intro h2{margin-top:32px;font:600 clamp(42px,3.2vw,56px)/.98 Poppins,sans-serif;letter-spacing:-.05em;max-width:7ch}
          .voices-intro p{margin-top:24px;color:var(--lm);font-size:15px;max-width:26ch}
          .voice-progress{height:2px;margin-top:auto;background:var(--ll)}
          .voice-progress i{display:block;width:25%;height:100%;background:var(--gold-deep);transform-origin:left;transition:width .45s var(--e)}
          .voice-stage{grid-column:2;position:relative;min-height:420px;padding:42px 52px 44px;background:var(--ink);color:var(--linen);display:flex;flex-direction:column;overflow:hidden}
          .voice-stage:after{content:"";position:absolute;right:-80px;top:-100px;width:360px;height:360px;border:1px solid var(--dl);border-radius:50%;box-shadow:0 0 0 60px var(--ink),0 0 0 61px var(--dl),0 0 0 120px var(--ink),0 0 0 121px var(--dl);opacity:.72}
          .voice-index{position:relative;z-index:2;text-align:right;font:600 10px Poppins,sans-serif;letter-spacing:.16em;color:var(--dm)}
          .voice-stage .qmark{position:relative;z-index:2;margin-top:26px;font-size:88px;color:var(--gold);line-height:.55}
          .voice-stage .quote{position:relative;z-index:2;display:flex;flex:1;flex-direction:column}
          .voice-stage .quote blockquote{margin:34px 0 0;font:500 clamp(38px,3vw,54px)/1.12 Poppins,sans-serif;letter-spacing:-.045em;max-width:16ch}
          .voice-stage .quote figcaption{margin-top:auto;padding-top:22px;border-top:1px solid var(--dl);display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}
          .voice-stage .quote figcaption b{color:var(--linen);font-size:16px}
          .voice-stage .quote figcaption span{color:var(--dm);font-size:13px;text-align:right}
          .voices .voicelist{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ll);border-top:0}
          .voices .voicelist button{position:relative;min-height:94px;padding:18px 16px;border:0;border-right:1px solid var(--ll);background:transparent}
          .voices .voicelist button:last-child{border-right:0}
          .voices .voicelist button:before{content:"0" counter(voice);counter-increment:voice;display:block;margin-bottom:10px;font:600 9px Poppins,sans-serif;color:var(--gold-deep)}
          .voices .voicelist{counter-reset:voice}
          .voices .voicelist button b{font-size:13px;color:var(--lm)}
          .voices .voicelist button span{font-size:11px;line-height:1.4}
          .voices .voicelist button[aria-selected="true"]{padding-left:16px;background:var(--linen-2)}
          .voices .voicelist button[aria-selected="true"]:after{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--gold-deep)}
          .voices .voicelist button[aria-selected="true"] b{color:var(--ink)}

          /* Why BIRC: two strong horizontal chapters instead of four cramped cards */
          .why-section{background:var(--ink-2)}
          .why-head{display:grid;grid-template-columns:300px 1fr;gap:72px;padding-bottom:64px;border-bottom:1px solid var(--dl)}
          .why-head>div:first-child{display:flex;flex-direction:column;justify-content:space-between;min-height:190px}
          .why-count{font:600 10px Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--lm)}
          .why-head h2{font:600 clamp(52px,4.5vw,76px)/.92 Poppins,sans-serif;letter-spacing:-.06em}
          .why-head p{margin-top:24px;color:var(--dm);font-size:17px}
          .why-section .reasons{display:grid;grid-template-columns:1fr 1fr;border:0}
          .why-section .reason{min-height:380px;padding:34px 36px 38px;border:0;border-bottom:1px solid var(--dl)}
          .why-section .reason:nth-child(odd){border-right:1px solid var(--dl)}
          .why-section .reason .reason-no{position:relative;z-index:3;font:600 11px Poppins,sans-serif;color:var(--gold)}
          .why-section .reason .word{left:auto;right:24px;top:42px;font-size:clamp(76px,7vw,116px);color:#242420;opacity:1;transform:none}
          .why-section .reason-copy{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(220px,1fr);gap:32px;align-items:end}
          .why-section .reason h3{font-size:27px;color:var(--linen)}
          .why-section .reason p{margin:0;color:var(--dm);font-size:14px;max-width:32ch}
          .why-section .whyclose{margin:0;padding:52px 0 0;display:flex;justify-content:space-between;align-items:baseline;font:500 clamp(28px,2.4vw,40px)/1.2 Poppins,sans-serif;letter-spacing:-.04em}
          .why-section .whyclose span{color:var(--dm)}
          .why-section .whyclose strong{color:var(--gold);font-weight:500}
          @media(max-width:1180px){.voices .voices-layout,.why-head{grid-template-columns:250px 1fr;gap:48px}.why-section .reason-copy{grid-template-columns:1fr;gap:18px}.why-section .reason .word{font-size:76px}.voice-stage{padding-inline:38px}}
          </style>'''
          html=html.replace('</head>',css+'</head>',1)

          old_js="""  var vlist=document.getElementById('voicelist'),qText=document.getElementById('quoteText'),
      qName=document.getElementById('quoteName'),qRole=document.getElementById('quoteRole');"""
          new_js="""  var vlist=document.getElementById('voicelist'),qText=document.getElementById('quoteText'),
      qName=document.getElementById('quoteName'),qRole=document.getElementById('quoteRole'),
      voiceIndex=document.getElementById('voiceIndex'),voiceProgress=document.getElementById('voiceProgress');"""
          html=html.replace(old_js,new_js)
          old_click="""      qText.textContent=v[0];qName.textContent=v[1];qRole.textContent=v[2];
      Array.prototype.forEach.call(vlist.children,function(x,xi){x.setAttribute('aria-selected',xi===i?'true':'false')});"""
          new_click="""      qText.textContent=v[0];qName.textContent=v[1];qRole.textContent=v[2];
      voiceIndex.textContent=String(i+1).padStart(2,'0')+' / 04';
      voiceProgress.style.width=((i+1)/voices.length*100)+'%';
      Array.prototype.forEach.call(vlist.children,function(x,xi){x.setAttribute('aria-selected',xi===i?'true':'false')});"""
          html=html.replace(old_click,new_click)

          p.write_text(html)
          PY
      - name: Commit targeted redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          git diff --cached --quiet || (git commit -m "Fix register CTA and redesign desktop voices and Why BIRC" && git push)
