name: Split Influencers into three pages
on:
  push:
    paths: ['.github/workflows/split-influencer-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split Content Creators and Rice Masterchef
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('creators.html').read_text()
          # Strict brand palette: remove the unapproved navy.
          src=src.replace('#17354c','var(--j2)')
          # Content Creators becomes its own page only.
          creators=re.sub(r'<section class="masterchef" id="rice-masterchef">[\s\S]*?</section></section>(?=<section class="coming" id="artists">)','',src,count=1)
          creators=re.sub(r'<section class="coming" id="artists">[\s\S]*?</section>','',creators,count=1)
          creators=creators.replace('<a href="#content-creators">Content Creators <span>01</span></a><a href="#rice-masterchef">Rice Masterchef <span>02</span></a><a href="#artists">Artists <span>03</span></a>','<a href="creators.html">Content Creators <span>01</span></a><a href="rice-masterchef.html">Rice Masterchef <span>02</span></a><a href="artists.html">Artists <span>03</span></a>')
          creators=creators.replace('23–25','23-24-25').replace('23-25','23-24-25')
          Path('creators.html').write_text(creators)

          # Rice Masterchef is a separate page, retaining only its approved competition content.
          master=src
          start=master.index('<section class="masterchef" id="rice-masterchef">')
          end=master.index('<section class="coming" id="artists">')
          master_section=master[start:end]
          shell_before=master[:master.index('<main class="page">')+len('<main class="page">')]
          shell_after=master[master.index('</main><footer class="page footer">'):]
          master=shell_before+master_section+shell_after
          master=master.replace('<title>Content Creators | BIRC 2026</title>','<title>Rice Masterchef | BIRC 2026</title>')
          master=master.replace('<a href="#content-creators">Content Creators <span>01</span></a><a href="#rice-masterchef">Rice Masterchef <span>02</span></a><a href="#artists">Artists <span>03</span></a>','<a href="creators.html">Content Creators <span>01</span></a><a href="rice-masterchef.html">Rice Masterchef <span>02</span></a><a href="artists.html">Artists <span>03</span></a>')
          master=master.replace('23–25','23-24-25').replace('23-25','23-24-25')
          # Remove creator form JS when its form no longer exists.
          master=re.sub(r'creatorForm\.onsubmit=[\s\S]*?\};(?=masterForm\.onsubmit)', '', master, count=1)
          Path('rice-masterchef.html').write_text(master)
          PY
      - name: Build Rice Art Showcase page
        run: |
          cat > artists.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Rice Art Showcase | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>
          :root{--j:#0d0d0b;--j2:#191916;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--m:#2b2b27;--dm:#aba49c;--lm:#6d6862;--dl:#35332e;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#211f1d;color:var(--l);font:400 16px/1.62 Inter,sans-serif;-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.page{width:min(100%,520px);margin:auto;background:var(--j);overflow:hidden}.light{background:var(--l);color:var(--j)}.pad{padding:96px var(--p)}.eye{font:600 10px/1 Poppins;letter-spacing:.18em;text-transform:uppercase}.title{font:600 clamp(43px,13vw,68px)/.91 Poppins;letter-spacing:-.067em;margin:0;text-wrap:balance}.section-title{font:600 clamp(35px,10vw,52px)/.96 Poppins;letter-spacing:-.055em;margin:0;text-wrap:balance}.lead{font-weight:300;color:var(--dm);margin:0}.head{display:grid;gap:16px;margin-bottom:42px}.bar{position:fixed;z-index:80;top:0;left:50%;width:min(100%,520px);height:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;padding:0 var(--p);background:var(--j);border-bottom:1px solid var(--dl)}.logo{width:158px;height:48px;object-fit:contain;object-position:left}.menu{width:44px;height:44px;border:0;background:none;color:var(--l);padding:11px}.menu i{display:block;height:1px;background:currentColor;margin:6px 0}.drawer{position:fixed;z-index:100;inset:0;margin:auto;width:min(100%,520px);background:var(--j);padding:22px;display:flex;flex-direction:column;overflow:auto;transform:translateY(-102%);transition:transform .45s var(--e)}.drawer.open{transform:none}.drawer-top{display:flex;justify-content:space-between}.drawer nav{margin:auto 0}.drawer nav>a,.nav-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins;letter-spacing:-.05em;text-align:left}.nav-sub{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.nav-sub>div{overflow:hidden}.nav-sub.open{grid-template-rows:1fr;opacity:1}.nav-sub a{display:flex;justify-content:space-between;padding:10px 0 10px 18px;border-bottom:1px solid var(--dl);color:var(--dm);font:500 12px Poppins}.nav-sub a span{order:2;color:var(--g);font:600 9px Poppins}.drawer p,.drawer-social{color:var(--dm);font-size:13px}.drawer-social{display:flex;gap:7px;padding-top:18px;border-top:1px dashed var(--dl)}.x{width:44px;height:44px;border:1px solid var(--dl);background:none;color:var(--l)}.hero{min-height:94svh;padding:124px var(--p) 64px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 18%,#ebb34132,transparent 28%),repeating-linear-gradient(116deg,transparent 0 31px,#faf0e609 31px 32px)}.hero>*{position:relative}.hero .eye{color:var(--g);margin-bottom:24px}.hero .lead{font-size:18px;margin-top:26px;max-width:33ch}.btn{min-height:56px;padding:0 20px;background:var(--g);color:var(--j);display:flex;align-items:center;justify-content:center;font:600 13px Poppins;margin-top:30px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:42px}.stat{padding:16px 9px;border:1px solid var(--dl)}.stat strong{display:block;color:var(--g);font:600 23px Poppins}.stat small{color:var(--dm);font:600 8px Poppins;text-transform:uppercase}.manifesto{background:var(--l);color:var(--j)}.manifesto .eye{color:var(--g2)}.manifesto p{color:var(--lm);font-size:17px}.materials{background:var(--j2)}.material-list{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--dl);margin-top:38px}.material{min-height:90px;padding:16px;border-right:1px solid var(--dl);border-bottom:1px solid var(--dl);display:flex;align-items:end;color:var(--dm);font:600 11px Poppins;text-transform:uppercase}.material:nth-child(even){border-right:0}.material:nth-last-child(-n+2){border-bottom:0}.language{background:var(--j)}.language .eye{color:var(--g)}.language p{color:var(--dm)}.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:36px}.art-tile{min-height:180px;padding:15px;background:var(--j2);border:1px solid var(--dl);display:flex;flex-direction:column;justify-content:flex-end}.art-tile.wide{grid-column:1/-1;min-height:260px}.art-tile strong{color:var(--g);font:600 10px Poppins}.art-tile span{font:600 12px Poppins;text-transform:uppercase}.audience{background:var(--l);color:var(--j)}.pathways{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ll);margin-top:38px}.pathway{padding:18px;border-right:1px solid var(--ll);border-bottom:1px solid var(--ll);font:600 11px Poppins;text-transform:uppercase}.pathway:nth-child(even){border-right:0}.pathway:nth-last-child(-n+2){border-bottom:0}.prize{background:var(--g);color:var(--j)}.prize h2{margin:22px 0}.prize p{color:#534631}.prize-box{margin:38px 0;padding:28px;background:var(--l);border-left:3px solid var(--j)}.prize-box small{font:600 9px Poppins;text-transform:uppercase}.prize-box strong{display:block;font:600 clamp(48px,15vw,72px)/.9 Poppins;margin:10px 0}.recognition{background:var(--j)}.recognition-list{border-top:1px solid var(--dl)}.recognition-row{padding:24px 0;border-bottom:1px solid var(--dl)}.recognition-row span{color:var(--g);font:600 9px Poppins}.recognition-row h3{font:600 19px Poppins;margin:9px 0}.recognition-row p{color:var(--dm);font-size:14px}.apply{background:var(--l);color:var(--j)}.form{display:grid;gap:20px;margin-top:38px}.field{display:grid;gap:7px}.field label{font:600 9px Poppins;text-transform:uppercase}.field input,.field select,.field textarea{padding:13px;border:1px solid var(--ll);background:transparent;border-radius:0}.submit{min-height:54px;border:0;background:var(--j);color:var(--l);font:600 12px Poppins}.footer{padding:70px var(--p) 100px;background:var(--j);border-top:1px solid var(--dl)}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}.end{margin-top:40px;color:var(--dm);font-size:12px}</style></head><body><header class="bar"><a href="index.html"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"></a><button class="menu" id="openMenu" aria-label="Open menu"><i></i><i></i></button></header><aside class="drawer" id="drawer"><div class="drawer-top"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"><button class="x" id="closeMenu">×</button></div><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><div><button class="nav-parent" aria-expanded="true">Influencers <small>⌄</small></button><div class="nav-sub open"><div><a href="creators.html">Content Creators <span>01</span></a><a href="rice-masterchef.html">Rice Masterchef <span>02</span></a><a href="artists.html">Artists <span>03</span></a></div></div></div><a href="partnership.html">Partnership</a><a href="plan-visit.html">Plan Visit</a><a href="contact.html">Contact</a></nav><div class="drawer-social"><a href="#">Instagram</a><span>·</span><a href="#">LinkedIn</a></div><p>Bharat Mandapam, Pragati Maidan<br>New Delhi · 23-24-25 October 2026</p></aside><main class="page"><section class="hero"><span class="eye">BIRC 2026 · International Open Call</span><h1 class="title">If Rice Is Part of Your Art, the World Should See It.</h1><p class="lead">From furniture, craft and sculpture to fashion, edible art, architecture and experimental materials — showcase your creation before an international audience connected to 120+ countries.</p><a class="btn" href="#apply">Apply to Showcase →</a><div class="stats"><div class="stat"><strong>120+</strong><small>Countries reached</small></div><div class="stat"><strong>03</strong><small>Days of exhibition</small></div><div class="stat"><strong>08</strong><small>Creative pathways</small></div></div></section><section class="manifesto pad"><span class="eye">A material. A memory. A global stage.</span><h2 class="section-title" style="margin-top:24px">One Grain Can Carry a Civilisation.</h2><p>Rice is nourishment, ritual, labour, landscape and identity. The BIRC Rice Art Showcase invites artists, makers, studios, designers and creative businesses to reveal what the world's most shared grain can become in the hands of imagination.</p></section><section class="materials pad"><span class="eye" style="color:var(--g)">The Rice Material Observatory</span><h2 class="section-title" style="margin-top:22px">Every Part Can Become a Creative Medium.</h2><p class="lead" style="margin-top:22px">Look beyond the grain. Paddy, husk, bran, straw, flour, starch, paper, fibre, broken rice, bio-composites and rice culture itself can all become the beginning of a remarkable work.</p><div class="material-list"><div class="material">Rice Paper</div><div class="material">Grain</div><div class="material">Husk</div><div class="material">Paddy & Straw</div><div class="material">Bran & Flour</div><div class="material">Bio-composites</div></div></section><section class="language pad"><span class="eye">The Visual Language of Rice</span><h2 class="section-title" style="margin-top:22px">Tiny Material. Infinite Expression.</h2><p style="margin-top:22px">From one grain to an entire room, we are looking for work that makes people stop, move closer and see rice differently.</p><div class="art-grid"><div class="art-tile wide"><strong>01</strong><span>Pattern / Ritual / Precision</span></div><div class="art-tile wide"><strong>02</strong><span>Landscape in Grain</span></div><div class="art-tile"><strong>03</strong><span>Process / Patience / Touch</span></div><div class="art-tile"><strong>04</strong><span>Installation / Light / Scale</span></div></div></section><section class="audience pad"><span class="eye" style="color:var(--g2)">Who is this for?</span><h2 class="section-title" style="margin-top:22px">If Rice Is Part of It, You Belong Here.</h2><p style="color:var(--lm);margin-top:22px">Choose the world closest to your work. The list is a doorway — not a boundary.</p><div class="pathways"><div class="pathway">Furniture & Objects</div><div class="pathway">Fine Art</div><div class="pathway">Craft</div><div class="pathway">Textile & Fashion</div><div class="pathway">Space & Installation</div><div class="pathway">Edible Art</div><div class="pathway">New Media</div><div class="pathway">Something Else</div></div></section><section class="prize pad"><span class="eye">Prize & Recognition</span><h2 class="section-title">Win the Room, and the Headline With It.</h2><p>The standout work at the Rice Art Showcase does not simply get seen. It gets awarded, recorded and honoured in front of the people who move the global rice ecosystem.</p><div class="prize-box"><small>Winning prize</small><strong>₹1,00,000</strong><span>One lakh rupees</span></div><a class="btn" href="#apply" style="background:var(--j);color:var(--l)">Enter the Showcase →</a></section><section class="recognition pad"><div class="recognition-list"><article class="recognition-row"><span>01</span><h3>₹1 Lakh Winning Prize</h3><p>A cash prize of ₹1,00,000 awarded to the winning artist of the BIRC 2026 Rice Art Showcase.</p></article><article class="recognition-row"><span>02</span><h3>Media Byte</h3><p>A dedicated media interaction — your work, your material and your practice recorded for press coverage and BIRC channels.</p></article><article class="recognition-row"><span>03</span><h3>On-Stage Recognition</h3><p>Called to the BIRC main stage and felicitated before an international audience connected to 120+ countries.</p></article></div></section><section class="apply pad" id="apply"><span class="eye" style="color:var(--g2)">One simple test</span><h2 class="section-title" style="margin-top:22px">Does Rice Make It Possible?</h2><p style="color:var(--lm)">Does rice — or any part, by-product, story or material connected to rice — make your work possible? Then this opportunity is for you.</p><form class="form" id="artistForm"><div class="field"><label for="artist-name">Your Name *</label><input id="artist-name" name="name" required></div><div class="field"><label for="artist-email">Email *</label><input id="artist-email" name="email" type="email" required></div><div class="field"><label for="artist-path">Creative Pathway *</label><select id="artist-path" name="path" required><option value="">Choose pathway</option><option>Furniture & Objects</option><option>Fine Art</option><option>Craft</option><option>Textile & Fashion</option><option>Space & Installation</option><option>Edible Art</option><option>New Media</option><option>Something Else</option></select></div><div class="field"><label for="artist-work">Describe Your Work *</label><textarea id="artist-work" name="work" required></textarea></div><button class="submit" type="submit">Apply to Showcase →</button><div id="artistStatus" role="status"></div></form></section></main><footer class="page footer"><div class="links"><a href="index.html">Home</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a><a href="contact.html">Contact</a></div><div class="end">© 2026 Bharat International Rice Conference<br>Privacy · Terms · Code of Conduct</div></footer><script>const drawer=document.getElementById('drawer');function menu(o){drawer.classList.toggle('open',o);document.body.classList.toggle('lock',o)}openMenu.onclick=()=>menu(true);closeMenu.onclick=()=>menu(false);drawer.querySelectorAll('a').forEach(a=>a.onclick=()=>menu(false));const parent=document.querySelector('.nav-parent'),sub=document.querySelector('.nav-sub');parent.onclick=()=>{const o=parent.getAttribute('aria-expanded')==='true';parent.setAttribute('aria-expanded',String(!o));sub.classList.toggle('open',!o)};artistForm.onsubmit=e=>{e.preventDefault();const d=new FormData(artistForm),subject=encodeURIComponent('BIRC 2026 Rice Art Showcase Application'),body=encodeURIComponent(`Name: ${d.get('name')}\nEmail: ${d.get('email')}\nPathway: ${d.get('path')}\nWork: ${d.get('work')}`);artistStatus.textContent='Opening your email app…';location.href=`mailto:booking@birc.in?subject=${subject}&body=${body}`};</script></body></html>
          HTML
      - name: Update all Influencer links, remove blue, and update context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html','partnership.html','plan-visit.html','contact.html']
          old_patterns=[
            ('creators.html#content-creators','creators.html'),
            ('creators.html#rice-masterchef','rice-masterchef.html'),
            ('creators.html#artists','artists.html')]
          for name in pages:
            p=Path(name);s=p.read_text()
            for a,b in old_patterns:s=s.replace(a,b)
            s=s.replace('#17354c', '#191916')
            p.write_text(s)
          # Ensure Creator and Masterchef menus use separate destinations and no blue remains.
          for name in ['creators.html','rice-masterchef.html']:
            p=Path(name);s=p.read_text().replace('#17354c','var(--j2)')
            s=s.replace('href="#content-creators"','href="creators.html"').replace('href="#rice-masterchef"','href="rice-masterchef.html"').replace('href="#artists"','href="artists.html"')
            p.write_text(s)
          p=Path('context.md');s=p.read_text()
          old='Influencers landing page with three anchored sections: Content Creators (`#content-creators`), Rice Masterchef (`#rice-masterchef`), and Artists (`#artists`).'
          new='Influencers is three separate pages: Content Creators (`creators.html`), Rice Masterchef (`rice-masterchef.html`), and Artists / Rice Art Showcase (`artists.html`).'
          s=s.replace(old,new)
          s=s.replace('Artists remains reserved for approved Rice Art Showcase content.','Artists is implemented from ten approved Rice Art Showcase screenshots, including material manifesto, eight pathways, ₹1,00,000 prize, recognition, and application form.')
          rule='Influencer pages must never use navy or blue. Use only the exact design.md ink, raised ink, linen, gold, editorial grey, and muted tokens. Each Influencers submenu item opens its own separate HTML page.'
          if rule not in s:s=s.replace('## 7. Design decisions that must persist',rule+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit all split-page updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creators.html rice-masterchef.html artists.html index.html about.html conference.html exhibition.html experience.html partnership.html plan-visit.html contact.html context.md
          git commit -m 'Split Influencers into branded standalone pages'
          git push
