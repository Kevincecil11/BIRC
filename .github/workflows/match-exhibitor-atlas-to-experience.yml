name: Match Exhibitor atlas to Experience Zones

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/match-exhibitor-atlas-to-experience.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply matching linen and gold flip system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('desktop-exhibitor-profile.html')
          s=p.read_text(encoding='utf-8')

          # Convert each generated card into a two-faced click target.
          def transform(m):
              top,symbol,title,copy,detail=m.groups()
              return f'''<article class="exhibitor-card" role="button" tabindex="0" aria-expanded="false" aria-label="View full {title} profile"><div class="exhibitor-card-inner"><div class="exhibitor-card-front">{top}{symbol}<h3>{title}</h3><p>{copy}</p><span class="exhibitor-flip-hint">View profile <b>+</b></span></div><div class="exhibitor-card-back"><div class="exhibitor-back-top"><span>Full exhibitor profile</span><b>×</b></div><h3>{title}</h3><p>{copy}</p><div class="exhibitor-back-scroll">{detail}</div></div></div></article>'''
          pattern=r'<article class="exhibitor-card">(<div class="exhibitor-card-top">.*?</div>)(<div class="exhibitor-symbol".*?</div>)<h3>(.*?)</h3><p>(.*?)</p>(<div class="exhibitor-detail">.*?</div>)</article>'
          s,n=re.subn(pattern,transform,s,flags=re.S)
          if n!=11: raise SystemExit(f'Expected 11 cards, transformed {n}')

          css=r'''<style id="exhibitor-experience-match">
          /* Exact visual language of the homepage Experience Zone atlas */
          .exhibitor-atlas{background:var(--l)!important;color:var(--j)!important;padding:124px 0 136px!important}
          .exhibitor-atlas .eye{color:var(--g2)!important}.exhibitor-atlas .title{color:var(--j)!important}.exhibitor-atlas .lead{color:var(--lm)!important}
          .exhibitor-grid{background:var(--ll)!important;border-color:var(--ll)!important}
          .exhibitor-card{position:relative;min-height:570px!important;padding:0!important;background:transparent!important;color:var(--j)!important;overflow:visible!important;perspective:1400px;cursor:pointer}
          .exhibitor-card:focus-visible{outline:3px solid var(--g2);outline-offset:-3px}
          .exhibitor-card-inner{position:relative;width:100%;height:100%;min-height:570px;transform-style:preserve-3d;transition:transform .62s var(--e)}
          .exhibitor-card.is-flipped .exhibitor-card-inner{transform:rotateY(180deg)}
          .exhibitor-card-front,.exhibitor-card-back{position:absolute;inset:0;padding:20px 20px 26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
          .exhibitor-card-front{background:var(--l);color:var(--j);transition:background .24s var(--e),color .24s var(--e)}
          .exhibitor-card:not(.is-flipped):hover .exhibitor-card-front{background:var(--g)}
          .exhibitor-card-top{color:var(--lm)!important}.exhibitor-card:not(.is-flipped):hover .exhibitor-card-top{color:#4a3507!important}
          .exhibitor-symbol{height:210px!important;margin:18px 0 20px!important;background:var(--j2)!important;border-color:var(--dl)!important}
          .exhibitor-symbol b{color:var(--m)!important}.exhibitor-symbol:before,.exhibitor-symbol:after{border-color:var(--dl)!important}.exhibitor-symbol i{background:var(--g)!important}
          .exhibitor-card-front h3{color:var(--j)!important;font:600 clamp(22px,1.7vw,30px)/1.05 Poppins!important;letter-spacing:-.045em!important}
          .exhibitor-card-front>p{margin-top:11px!important;color:var(--lm)!important;font-size:13px!important;line-height:1.5!important;max-width:31ch!important}.exhibitor-card:not(.is-flipped):hover .exhibitor-card-front>p{color:#4a3507!important}
          .exhibitor-flip-hint{position:absolute;left:20px;right:20px;bottom:22px;min-height:40px;padding-top:13px;border-top:1px solid var(--ll);display:flex;align-items:center;justify-content:space-between;color:var(--g2);font:600 9px Poppins;letter-spacing:.11em;text-transform:uppercase}.exhibitor-flip-hint b{font-size:18px;font-weight:500}
          .exhibitor-card:not(.is-flipped):hover .exhibitor-flip-hint{color:var(--j);border-color:#9e711b}
          .exhibitor-card-back{transform:rotateY(180deg);background:var(--g);color:var(--j);display:flex;flex-direction:column}
          .exhibitor-back-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid #9e711b;color:#5a4008;font:600 9px Poppins;letter-spacing:.14em;text-transform:uppercase}.exhibitor-back-top b{font-size:22px;font-weight:500;color:var(--j)}
          .exhibitor-card-back h3{margin-top:24px;color:var(--j)!important;font:600 31px/1.05 Poppins!important;letter-spacing:-.05em!important}
          .exhibitor-card-back>p{margin-top:14px!important;color:#3f2d06!important;font-size:14px!important;line-height:1.55!important;max-width:none!important}
          .exhibitor-back-scroll{min-height:0;margin-top:22px;padding-right:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#8e6516 transparent}
          .exhibitor-back-scroll .exhibitor-detail{margin:0!important;padding:0!important;border:0!important}.exhibitor-back-scroll .exhibitor-detail>span{color:#5a4008!important}.exhibitor-back-scroll .exhibitor-detail ul{display:block!important;margin-top:12px!important}.exhibitor-back-scroll .exhibitor-detail li{padding:13px 0 13px 22px!important;border-color:#9e711b!important;color:#3f2d06!important;font-size:13px!important}.exhibitor-back-scroll .exhibitor-detail li:before{background:var(--j)!important;left:1px!important;top:20px!important}
          .ecosystem{border-color:var(--ll)!important}.ecosystem header h3{color:var(--j)!important}.ecosystem-pointers li{border-color:var(--ll)!important;color:var(--lm)!important}.ecosystem-pointers li:before{background:var(--g2)!important}
          @media(max-width:1400px){.exhibitor-card,.exhibitor-card-inner{min-height:530px!important}.exhibitor-card-front,.exhibitor-card-back{padding:16px 16px 22px}.exhibitor-symbol{height:180px!important}.exhibitor-flip-hint{left:16px;right:16px}.exhibitor-card-back h3{font-size:27px!important}}
          @media(prefers-reduced-motion:reduce){.exhibitor-card-inner{transition:none}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          js=r'''<script id="exhibitor-card-flip-script">(function(){function set(card,open){card.classList.toggle('is-flipped',open);card.setAttribute('aria-expanded',String(open))}document.querySelectorAll('.exhibitor-card').forEach(function(card){card.addEventListener('click',function(e){if(e.target.closest('.exhibitor-back-scroll'))return;set(card,!card.classList.contains('is-flipped'))});card.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.exhibitor-back-scroll')){e.preventDefault();set(card,!card.classList.contains('is-flipped'))}})});document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.exhibitor-card.is-flipped').forEach(function(card){set(card,false)})})})();</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Matched Exhibitor atlas to Experience Zone styling and full-card flip behavior.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-exhibitor-profile.html
          git diff --cached --quiet || git commit -m "Match Exhibitor atlas to Experience Zone flips and colors"
          git push
