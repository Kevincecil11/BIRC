name: Inspect report

on:
  push:
    paths:
      - '.github/workflows/inspect-report.yml'
      - 'tools/inspect_pages.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - run: python tools/inspect_pages.py
      - name: Commit
        run: |
          git config user.name "birc-bot"
          git config user.email "bot@birc.local"
          git add -A _inspect
          git commit -m "Inspection reports" || echo "no changes"
          git push
