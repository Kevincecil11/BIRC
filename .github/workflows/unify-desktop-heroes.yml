name: Unify desktop hero framing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unify-desktop-heroes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply desktop hero and footer refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'desktop-about.html','desktop-artists.html','desktop-conference.html',
              'desktop-contact.html','desktop-creators.html','desktop-exhibition.html',
              'desktop-exhibitor-profile.html','desktop-experience.html',
              'desktop-media-coverage.html','desktop-partnership.html',
              'desktop-plan-visit.html','desktop-rice-masterchef.html',
              'desktop-space-rental.html'
          ]

          hero_css = r'''<style id="unified-desktop-hero-frame">
          /* Homepage-scale hero framing for every desktop landing page */
          body{background:#0d0d0b!important}
          main>section:first-child{
            min-height:100vh!important;
            margin:0!important;
            padding-top:136px!important;
            padding-bottom:56px!important;
            padding-left:max(32px,calc((100vw - 1680px)/2))!important;
            padding-right:max(32px,calc((100vw - 1680px)/2))!important;
            display:flex!important;
            flex-direction:column!important;
            justify-content:center!important;
            align-items:stretch!important;
            position:relative!important;
            overflow:hidden!important;
            background-color:#0d0d0b!important;
            color:#faf0e6!important;
          }
          main>section:first-child:before{
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:radial-gradient(1000px 600px at 79% 18%,#ebb34124,transparent 62%),repeating-linear-gradient(116deg,transparent 0 76px,#faf0e605 76px 77px)!important;
          }
          main>section:first-child>*{position:relative;z-index:1}
          main>section:first-child>.shell,
          main>section:first-child>.hero-in{
            width:min(1680px,100%)!important;
            margin:0 auto!important;
            padding:0!important;
            display:grid!important;
            grid-template-columns:minmax(0,1fr) minmax(360px,.72fr)!important;
            gap:clamp(52px,5vw,88px)!important;
            align-items:center!important;
          }
          main>section:first-child h1,
          main>section:first-child .display,
          main>section:first-child .title{
            margin:28px 0 0!important;
            max-width:12ch!important;
            color:#faf0e6!important;
            font-size:clamp(62px,5vw,96px)!important;
            line-height:.93!important;
            letter-spacing:-.06em!important;
            text-wrap:balance!important;
          }
          main>section:first-child p,
          main>section:first-child .lead,
          main>section:first-child .lede{
            margin-top:28px!important;
            margin-bottom:0!important;
            max-width:58ch!important;
            color:#aba49c!important;
            font-size:18px!important;
            line-height:1.62!important;
          }
          main>section:first-child .eye,
          main>section:first-child .ey,
          main>section:first-child .eyebrow{
            display:block!important;
            margin:0!important;
            color:#ebb341!important;
            font:600 13.2px/1 Poppins,sans-serif!important;
            letter-spacing:.16em!important;
            text-transform:uppercase!important;
          }
          main>section:first-child aside,
          main>section:first-child .meta,
          main>section:first-child .spec,
          main>section:first-child .hero-meta,
          main>section:first-child .hero-stat{
            align-self:center!important;
            width:100%!important;
            margin:0!important;
            background:transparent!important;
            color:#faf0e6!important;
          }
          main>section:first-child+.light,
          main>section:first-child+.intro,
          main>section:first-child+.section,
          main>section:first-child+.view{
            margin-top:0!important;
          }
          main.page{padding-top:0!important}
          main.page>section:first-child{width:100%!important}
          main.page>section:first-child>.stats,
          main.page>section:first-child>.master-stats{
            width:min(760px,100%)!important;
            margin-top:40px!important;
          }
          @media(max-width:1400px){
            main>section:first-child>.shell,main>section:first-child>.hero-in{grid-template-columns:minmax(0,1fr) minmax(330px,.68fr)!important;gap:52px!important}
            main>section:first-child h1,main>section:first-child .display,main>section:first-child .title{font-size:clamp(58px,5.4vw,82px)!important}
          }
          </style>'''

          def inject(text, block, style_id):
              pattern = re.compile(r'<style id=["\']'+re.escape(style_id)+r'["\']>.*?</style>', re.S)
              if pattern.search(text):
                  return pattern.sub(block, text)
              return text.replace('</head>', block+'\n</head>', 1)

          for name in pages:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = inject(text, hero_css, 'unified-desktop-hero-frame')
              p.write_text(text, encoding='utf-8')

          home = Path('desktop.html')
          text = home.read_text(encoding='utf-8')
          footer_css = r'''<style id="desktop-footer-control-fix">
          /* Footer exhibition control: dark, typographically consistent, never browser-white */
          .footer .nav-exhibition{position:relative;display:block!important;margin:0!important}
          .footer .nav-exhibition>button{
            appearance:none!important;
            width:auto!important;
            height:auto!important;
            margin:0!important;
            padding:7px 0!important;
            border:0!important;
            background:transparent!important;
            color:var(--dm)!important;
            font:400 15px/1.65 Inter,sans-serif!important;
            text-align:left!important;
            cursor:pointer!important;
          }
          .footer .nav-exhibition>button:hover{color:var(--gold)!important;background:transparent!important}
          .footer .exhibition-menu{
            position:static!important;
            width:auto!important;
            padding:0!important;
            border:0!important;
            background:transparent!important;
            opacity:1!important;
            visibility:visible!important;
            transform:none!important;
            box-shadow:none!important;
          }
          .footer .exhibition-menu a{
            display:flex!important;
            justify-content:flex-start!important;
            gap:5px!important;
            padding:5px 0!important;
            border:0!important;
            background:transparent!important;
            color:var(--dm)!important;
            font:400 15px/1.65 Inter,sans-serif!important;
          }
          .footer .exhibition-menu a:hover{color:var(--gold)!important}
          .footer .exhibition-menu span{color:var(--gold-deep)!important;font-size:10px!important}
          </style>'''
          text = inject(text, footer_css, 'desktop-footer-control-fix')
          home.write_text(text, encoding='utf-8')

          print('Updated 13 landing heroes and repaired the desktop homepage footer control.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop*.html
          git diff --cached --quiet || git commit -m "Standardize desktop hero framing and fix footer contrast"
          git push
