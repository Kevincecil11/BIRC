name: Refine desktop About and Exhibition layouts
on:
  push:
    paths: ['.github/workflows/refine-about-exhibition-desktop.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop-only layout refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # About: left-align Values heading and bottom-align story copy with route visual.
          p=Path('desktop-about.html'); h=p.read_text()
          h=h.replace('<section class="section"><div class="shell"><header class="head"><span class="eyebrow">Our values</span>','<section class="section values-section"><div class="shell"><header class="head"><span class="eyebrow">Our values</span>',1)
          css='''<style id="about-alignment-refinement">.values-section .head{grid-template-columns:1fr;gap:22px}.values-section .head .eyebrow{padding-top:0}.values-section .head>div{max-width:720px}.values-section .head h2{max-width:12ch}.story .shell{align-items:stretch}.story-copy{align-self:end;padding-bottom:0}.route{position:relative;top:auto}@media(max-width:1180px){.values-section .head{grid-template-columns:1fr}.story-copy{align-self:end}}</style>'''
          if 'id="about-alignment-refinement"' not in h:h=h.replace('</head>',css+'</head>',1)
          p.write_text(h)

          # Exhibition: remove the centered yellow page label from every separate page.
          for name in ['desktop-exhibition.html','desktop-exhibitor-profile.html','desktop-space-rental.html']:
              p=Path(name); h=p.read_text()
              h=re.sub(r'<div class="page-label"><div class="shell"><span>Exhibition · \d+</span><span>.*?</span></div></div>','',h,count=1)
              # Remove the now-unused page-label CSS declarations while retaining page visibility rules.
              h=re.sub(r'\.page-label\{.*?\}\.page-label \.shell\{.*?\}\.page-label a\{.*?\}','',h,count=1)
              # Make current content begin naturally below its own hero, no shared secondary strip.
              h=h.replace('.view.page-current{display:block!important;padding-top:120px}', '.view.page-current{display:block!important;padding-top:110px}')
              p.write_text(h)

          p=Path('context.md'); c=p.read_text(); note='''\n- Desktop About values heading is left-aligned and the Our Story copy is bottom-aligned with the route visual.\n- The centered yellow Exhibition page label was removed from all three desktop Exhibition pages; navigation remains in the navbar dropdown only.\n'''
          if note not in c:p.write_text(c.rstrip()+'\n'+note)
          PY
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-about.html desktop-exhibition.html desktop-exhibitor-profile.html desktop-space-rental.html context.md
          git commit -m "Align About sections and remove Exhibition page label strip"
          git push
