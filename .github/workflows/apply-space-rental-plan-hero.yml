name: Apply Space Rental floor-plan hero

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-space-rental-plan-hero.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build floor-plan atlas hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('desktop-space-rental.html')
          s=p.read_text(encoding='utf-8')
          old=r'<section class="hero"><div class="shell"><div><span class="eye">Exhibition · 03</span><h1 class="display">Space rental</h1><p class="lead">BIRC 2026 at Bharat Mandapam, New Delhi\.</p></div></div></section>'
          stalls=[]
          for n in range(1,25): stalls.append(f'<i class="s{(n%5)+1}" style="--n:\'{n:02d}\'"></i>')
          new='''<section class="hero rental-plan-hero"><div class="shell"><div class="rental-hero-copy"><span class="eye">Exhibition</span><h1 class="display">Space rental</h1><p class="lead">Choose the exact position your brand will occupy at Bharat Mandapam.</p></div><div class="rental-plan-art" aria-hidden="true"><header><span>Halls 4 & 5</span><span>18,000 sqm</span></header><div class="rental-plan-grid">'''+''.join(stalls)+'''</div><span class="rental-aisle a1"></span><span class="rental-aisle a2"></span><b class="rental-entry">Entry</b><b class="rental-stage">Main stage</b></div></div></section>'''
          s,n=re.subn(old,new,s)
          if n!=1: raise SystemExit(f'hero replacement count {n}')
          css=r'''<style id="space-rental-plan-hero">
          .rental-plan-hero>.shell{display:grid!important;grid-template-columns:minmax(0,.85fr) minmax(620px,1.15fr)!important;gap:76px!important;align-items:stretch!important;height:100%!important}
          .rental-hero-copy{align-self:end!important;padding-bottom:8px!important;max-width:760px!important}
          .rental-plan-hero h1.display{font-size:clamp(68px,6vw,108px)!important;max-width:none!important}
          .rental-plan-art{position:relative;min-height:610px;align-self:stretch;overflow:hidden;border:1px solid var(--dl);background:var(--j2)}
          .rental-plan-art header{position:absolute;z-index:4;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;color:var(--g);font:600 9px Poppins;letter-spacing:.15em;text-transform:uppercase}
          .rental-plan-grid{position:absolute;inset:58px 34px 50px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:12px;transform:perspective(1100px) rotateX(4deg);transform-origin:center bottom}
          .rental-plan-grid i{position:relative;border:1px solid var(--dl);background:var(--j);overflow:hidden}
          .rental-plan-grid i:before{content:var(--n);position:absolute;left:9px;top:7px;color:var(--lm);font:600 8px Poppins}.rental-plan-grid i:after{content:"";position:absolute;inset:12px;border:1px solid var(--dl)}
          .rental-plan-grid i.s1,.rental-plan-grid i.s4{border-color:var(--g2)}.rental-plan-grid i.s1:after,.rental-plan-grid i.s4:after{border-color:var(--g)}
          .rental-aisle{position:absolute;z-index:3;background:var(--g);opacity:.9}.rental-aisle.a1{left:34px;right:34px;top:50%;height:2px}.rental-aisle.a2{top:58px;bottom:50px;left:50%;width:2px}
          .rental-entry,.rental-stage{position:absolute;z-index:5;padding:8px 11px;background:var(--g);color:var(--j);font:600 8px Poppins;letter-spacing:.12em;text-transform:uppercase}.rental-entry{left:34px;bottom:17px}.rental-stage{right:34px;bottom:17px;background:var(--l)}
          @media(max-width:1400px){.rental-plan-hero>.shell{grid-template-columns:minmax(0,.78fr) minmax(540px,1.22fr)!important;gap:52px!important}.rental-plan-art{min-height:560px}.rental-plan-grid{inset:56px 26px 48px;gap:9px}}
          @media(max-width:1180px){.rental-plan-hero>.shell{grid-template-columns:minmax(0,.7fr) minmax(500px,1.3fr)!important;gap:38px!important}.rental-plan-art{min-height:520px}.rental-plan-grid{inset:54px 20px 46px;gap:7px}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-space-rental.html
          git diff --cached --quiet || git commit -m "Apply floor-plan atlas hero to Space Rental"
          git push
