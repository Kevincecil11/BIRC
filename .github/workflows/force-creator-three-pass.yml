name: Force Creator Three Pass
on:
  push:
    paths:
      - '.github/workflows/force-creator-three-pass.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap to uncached Creator pass asset
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('desktop-creators.html','creators.html'):
              p=Path(name);s=p.read_text().replace('assets/creator-three-passes.js?v=20260820-2358','assets/creator-three-passes-2359.js')
              p.write_text(s)
          Path('.github/workflows/force-creator-three-pass.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-creators.html creators.html .github/workflows/force-creator-three-pass.yml
          git commit -m 'Publish uncached three Creator passes'
          git push
