name: Add shared registration forms
on:
  push:
    paths: ['.github/workflows/add-registration-forms.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal two-step form
        run: |
          cat > register.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Registration | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>
          :root{--j:#0d0d0b;--j2:#191916;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--dm:#aba49c;--lm:#6d6862;--dl:#35332e;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}body{margin:0;background:#211f1d;color:var(--j);font:400 16px/1.55 Inter,sans-serif;-webkit-font-smoothing:antialiased}.page{width:min(100%,520px);min-height:100svh;margin:auto;background:var(--l);padding:0 var(--p) 54px}.bar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ll)}.logo{width:158px;height:48px;object-fit:contain;filter:invert(1);mix-blend-mode:multiply}.close{width:44px;height:44px;border:1px solid var(--ll);border-radius:50%;background:none;color:var(--j);font-size:23px}.form-head{text-align:center;padding:42px 0 34px}.eyebrow{font:600 9px Poppins;letter-spacing:.17em;text-transform:uppercase;color:var(--g2)}h1{font:600 clamp(28px,8vw,40px)/1 Poppins;letter-spacing:-.055em;margin:18px 0 25px}.steps{display:flex;align-items:center;justify-content:center}.step-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e4dac9;color:var(--lm);font:600 11px Poppins}.step-dot.active{background:var(--g);color:var(--j)}.step-line{width:62px;height:2px;background:var(--ll)}.step-line.active{background:var(--g)}.panel{display:none}.panel.active{display:block;animation:enter .45s var(--e)}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fields{display:grid;gap:22px}.field{display:grid;gap:8px}.field label,.legend{font:600 10px Poppins;letter-spacing:.06em;color:var(--lm)}.required{color:var(--g2)}.field input,.field select{width:100%;height:52px;border:1px solid var(--ll);border-radius:0;background:transparent;padding:0 14px;color:var(--j);font-size:16px}.field input:focus,.field select:focus{outline:3px solid #ebb34145;border-color:var(--g2)}.phone-grid{display:grid;grid-template-columns:112px 1fr;gap:8px}.checkline{display:flex;align-items:flex-start;gap:10px;color:var(--lm);font-size:13px}.checkline input,.industry input{accent-color:var(--g2);width:18px;height:18px;flex:none}.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:30px}.actions.single{grid-template-columns:1fr}.button{height:54px;border:1px solid var(--j);background:var(--j);color:var(--l);font:600 12px Poppins}.button.secondary{width:84px;background:transparent;color:var(--j);border-color:var(--ll)}.button.primary{background:var(--g);border-color:var(--g);color:var(--j)}fieldset{border:0;padding:0;margin:0}.industries{display:grid;gap:12px;margin-top:18px}.industry{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--ll);color:var(--lm);font-size:14px}.declaration{margin-top:28px;padding-top:20px;border-top:1px solid var(--ll)}.legal{text-align:center;color:var(--lm);font-size:11px;margin-top:34px}.legal a{color:var(--j);font-weight:600}.status{text-align:center;min-height:22px;margin-top:18px;color:var(--g2);font-size:13px}.success{display:none;text-align:center;padding:80px 0}.success.active{display:block}.success-mark{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--g);font-size:28px}.success h2{font:600 34px/1 Poppins;margin:25px 0 13px}.success p{color:var(--lm)}@media(prefers-reduced-motion:reduce){.panel{animation:none}}</style></head><body><main class="page"><header class="bar"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"><button class="close" id="closeButton" aria-label="Close registration">×</button></header><section id="formView"><header class="form-head"><span class="eyebrow">Registration</span><h1 id="formTitle">Visitor Registration</h1><div class="steps" aria-label="Form progress"><span class="step-dot active" id="dot1">1</span><span class="step-line" id="stepLine"></span><span class="step-dot" id="dot2">2</span></div></header><form id="registrationForm"><section class="panel active" id="panel1" aria-labelledby="formTitle"><div class="fields"><div class="field"><label for="name">Name <span class="required">*</span></label><input id="name" name="name" required autocomplete="name" placeholder="Enter your full name"></div><div class="field"><label for="company">Company Name <span class="required">*</span></label><input id="company" name="company" required autocomplete="organization" placeholder="Enter company name"></div><div class="field"><label for="phone">Mobile Number <span class="required">*</span></label><div class="phone-grid"><select id="code" name="code" aria-label="Country code" required><option value="+91">+91 India</option><option value="+1">+1 USA</option><option value="+44">+44 UK</option><option value="+971">+971 UAE</option><option value="+65">+65 Singapore</option><option value="+254">+254 Kenya</option><option value="+27">+27 South Africa</option><option value="other">Other</option></select><input id="phone" name="phone" required type="tel" autocomplete="tel" placeholder="Enter phone number"></div></div><label class="checkline"><input id="sameWhatsapp" name="sameWhatsapp" type="checkbox" checked><span>WhatsApp Number Same as Mobile Number</span></label><div class="field"><label for="country">Country <span class="required">*</span></label><select id="country" name="country" required><option value="">Select country</option><option>India</option><option>United Arab Emirates</option><option>United States</option><option>United Kingdom</option><option>Singapore</option><option>Kenya</option><option>South Africa</option><option>Other</option></select></div><div class="field"><label for="email">Email <span class="required">*</span></label><input id="email" name="email" type="email" required autocomplete="email" placeholder="Enter email"></div><label class="checkline"><input name="remember" type="checkbox"><span>Remember me</span></label></div><div class="actions single"><button class="button primary" id="nextButton" type="button">Next →</button></div></section><section class="panel" id="panel2"><fieldset><legend class="legend">Industry Type <span class="required">*</span></legend><div class="industries" id="industryList"></div></fieldset><div class="declaration"><label class="checkline"><input id="declaration" name="declaration" type="checkbox" required><span>I declare that all information provided is accurate and complete <span class="required">*</span></span></label></div><div class="actions"><button class="button secondary" id="backButton" type="button">Back</button><button class="button primary" type="submit">Submit →</button></div></section><div class="status" id="formStatus" role="status" aria-live="polite"></div></form><p class="legal">By registering, you agree to our <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.</p></section><section class="success" id="successView"><div class="success-mark">✓</div><h2>Registration ready.</h2><p>Your completed registration has been prepared for the BIRC team.</p><button class="button primary" id="finishButton" type="button" style="width:100%;margin-top:24px">Return to BIRC</button></section></main><script>
const params=new URLSearchParams(location.search);const raw=(params.get('type')||'visitor').toLowerCase();const type=['visitor','exhibitor','buyer'].includes(raw)?raw:'visitor';const labels={visitor:'Visitor',exhibitor:'Exhibitor',buyer:'Buyer'};formTitle.textContent=labels[type]+' Registration';document.title=labels[type]+' Registration | BIRC 2026';
const industries=['Buyer','Importer','Rice Miller','Exporter','Trader','Commodity Broker','Modern Trade Buyer','FPO','Farmer','Logistics & Supply Chain','Equipment Manufacturer','Packaging Solution','Agri-Tech Companies','Testing & Certification','Government Bodies','Research Institution','Others'];industryList.innerHTML=industries.map((x,i)=>`<label class="industry"><input type="checkbox" name="industry" value="${x}"><span>${x}</span></label>`).join('');
function showStep(n){panel1.classList.toggle('active',n===1);panel2.classList.toggle('active',n===2);dot1.classList.toggle('active',n>=1);dot2.classList.toggle('active',n>=2);stepLine.classList.toggle('active',n>=2);scrollTo({top:0,behavior:'smooth'})}
nextButton.onclick=()=>{const required=[name,company,phone,country,email];if(required.some(x=>!x.reportValidity()))return;showStep(2)};backButton.onclick=()=>showStep(1);closeButton.onclick=()=>location.href='index.html';finishButton.onclick=()=>location.href='index.html';
registrationForm.onsubmit=e=>{e.preventDefault();const selected=[...document.querySelectorAll('input[name="industry"]:checked')].map(x=>x.value);if(!selected.length){formStatus.textContent='Choose at least one industry type.';return}if(!declaration.reportValidity())return;const d=new FormData(registrationForm);const subject=encodeURIComponent(`BIRC 2026 ${labels[type]} Registration`);const body=encodeURIComponent(`Registration type: ${labels[type]}\nName: ${d.get('name')}\nCompany: ${d.get('company')}\nMobile: ${d.get('code')} ${d.get('phone')}\nWhatsApp same as mobile: ${d.get('sameWhatsapp')?'Yes':'No'}\nCountry: ${d.get('country')}\nEmail: ${d.get('email')}\nIndustry type: ${selected.join(', ')}`);const recipient=type==='visitor'?'visit@birc.in':'booking@birc.in';formView.style.display='none';successView.classList.add('active');setTimeout(()=>{location.href=`mailto:${recipient}?subject=${subject}&body=${body}`},450)};
</script></body></html>
          HTML
      - name: Route chooser options into shared form
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace('https://birc.in/register/visitor','register.html?type=visitor').replace('https://birc.in/register/exhibitor','register.html?type=exhibitor').replace('https://birc.in/register/buyer','register.html?type=buyer')
          p.write_text(s)
          p=Path('context.md');s=p.read_text()
          note='Registration uses one shared minimal two-step page at `register.html?type=visitor|exhibitor|buyer`. Step 1 is identical for all roles: name, company, mobile/country code, WhatsApp match, country, email, remember me. Step 2 is identical: multi-select Industry Type plus declaration. Only the title and submission routing differ by role. Homepage chooser links to these local forms.'
          if note not in s:s=s.replace('## 7. Design decisions that must persist',note+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add register.html index.html context.md
          git commit -m 'Add shared two-step registration forms'
          git push
