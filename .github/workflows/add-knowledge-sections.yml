name: Add homepage Knowledge Sessions

on:
  push:
    paths:
      - '.github/workflows/add-knowledge-sections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Knowledge Sessions above Experience
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          if 'id="knowledge-sessions"' in s:
              raise SystemExit('Knowledge sections already exist')

          css='''/* Knowledge Sessions */.knowledge{padding:96px 0;background:var(--j);color:var(--l)}.knowledge .head,.difference .head{padding:0 var(--p)}.knowledge .head .eye,.difference .head .eye{color:var(--g)}.knowledge-meta{margin:0 var(--p) 42px;padding:18px 0;border-block:1px solid var(--dl);display:flex;justify-content:space-between;align-items:center}.knowledge-meta strong{font:600 13px Poppins,sans-serif}.knowledge-meta span{color:var(--dm);font:600 9px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase}.session-day{padding:0 var(--p)}.session-day+.session-day{margin-top:58px}.session-day-head{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--dl)}.session-day-head strong{color:var(--g);font:600 12px Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase}.session-day-head span{color:var(--dm);font:600 9px Poppins,sans-serif;letter-spacing:.1em;text-transform:uppercase}.session-list{counter-reset:session}.session{counter-increment:session;display:grid;grid-template-columns:36px 1fr;gap:14px;padding:23px 0;border-bottom:1px solid var(--dl)}.session:before{content:counter(session);width:30px;height:30px;border-radius:50%;background:var(--g);color:var(--j);display:grid;place-items:center;font:700 11px Poppins,sans-serif}.session-day:nth-of-type(2) .session-list{counter-reset:session 4}.session h3{font:600 18px/1.2 Poppins,sans-serif;letter-spacing:-.035em;margin:2px 0 6px}.session p{color:var(--dm);font-size:13px;line-height:1.55;margin:0}.difference{padding:96px 0;background:var(--j2);color:var(--l)}.ey-report{margin:0 var(--p) 42px;padding:20px;border:1px solid var(--dl);display:grid;grid-template-columns:1fr auto;gap:14px}.ey-report strong{display:block;color:var(--g);font:600 12px Poppins,sans-serif;margin-bottom:6px}.ey-report p{color:var(--dm);font-size:12px;line-height:1.5;margin:0}.ey-report span{align-self:center;color:var(--g);font:600 9px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase}.difference-list{border-top:1px solid var(--dl)}.difference-item{border-bottom:1px solid var(--dl)}.difference-btn{width:100%;min-height:94px;padding:0 var(--p);border:0;background:none;color:var(--l);display:grid;grid-template-columns:38px 1fr 22px;gap:12px;align-items:center;text-align:left}.difference-btn>span:first-child{color:var(--g);font:600 10px Poppins,sans-serif}.difference-btn strong{font:600 16px/1.28 Poppins,sans-serif;letter-spacing:-.025em}.difference-btn em{font-style:normal;font-size:20px;transition:transform .3s var(--e)}.difference-item.open .difference-btn em{transform:rotate(45deg)}.difference-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--e)}.difference-detail>div{overflow:hidden}.difference-detail p{color:var(--dm);font-size:13px;line-height:1.6;margin:0;padding:0 var(--p) 25px 72px}.difference-item.open .difference-detail{grid-template-rows:1fr}@media(prefers-reduced-motion:reduce){.difference-detail,.difference-btn em{transition:none}}'''
          s=s.replace('</style></head>',css+'</style></head>',1)

          html='''<section class="knowledge dark" id="knowledge-sessions"><header class="head"><span class="eye rv">Knowledge Sessions</span><h2 class="title rv">The 9 Knowledge Sessions.</h2></header><div class="knowledge-meta"><strong>9 sessions · 2 days</strong><span>23–24 October</span></div><section class="session-day"><header class="session-day-head"><strong>Day 1</strong><span>Friday 23 October</span></header><div class="session-list"><article class="session"><div><h3>Crop Survey &amp; Price Forecasting</h3><p>Global Demand &amp; Supply Outlook — 2027: Price Crash or New Bull Run?</p></div></article><article class="session"><div><h3>New Market Opportunities</h3><p>Top 10 Rice Markets to Watch in 2027 and Entry Strategy</p></div></article><article class="session"><div><h3>Documentation, Insurance &amp; Credit</h3><p>Protecting Export Payments: Cut Risk by 80% and Prevent Disputes.</p></div></article><article class="session"><div><h3>Shipping — Bulk &amp; Containers</h3><p>Bulk &amp; Container Shipping 2026: Protect Margins and Mitigate Disputes</p></div></article></div></section><section class="session-day"><header class="session-day-head"><strong>Day 2</strong><span>Saturday 24 October</span></header><div class="session-list"><article class="session"><div><h3>Quality &amp; Certification</h3><p>Why Buyers Reject Rice Shipments: How Exporters Can Prevent It</p></div></article><article class="session"><div><h3>Trade Schemes &amp; Incentives</h3><p>Policy Shifts 2026: Trade Schemes, Incentives and Export Opportunities</p></div></article><article class="session"><div><h3>Sustainability &amp; Carbon Credits</h3><p>Sustainability Initiatives &amp; Carbon Credits in Rice: Can Your Business Profit?</p></div></article><article class="session"><div><h3>Rice Milling</h3><p>Profitable Rice Milling: Costs, Planning and Margin Improvement</p></div></article><article class="session"><div><h3>Value-Added Products</h3><p>Cleaning, sorting and branded — value-added rice products.</p></div></article></div></section></section><section class="difference dark" id="knowledge-difference"><header class="head"><span class="eye rv">Built differently</span><h2 class="title rv">What Makes the BIRC 2026 Knowledge Sessions Different</h2></header><aside class="ey-report"><div><strong>EY Post-Conference Report</strong><p>The Ernst &amp; Young Post-Conference Report on BIRC 2025 established the 2025 edition as the world's largest-ever dedicated rice conference in terms of scale and participation.</p></div><span>EY BIRC 2025 Report</span></aside><div class="difference-list"><article class="difference-item open"><button class="difference-btn" aria-expanded="true"><span>01</span><strong>Sessions Built as Business Training Modules — Months of Deep Curation, Every Speaker Chosen for Impact</strong><em>+</em></button><div class="difference-detail"><div><p>Not long speeches. Not boring panels. Real working sessions. Every BIRC 2026 session is built like a business training class — with months of planning behind each one, focused on the real decisions rice businesses make every day. And every speaker is chosen for one reason: they have actually done the business, not just studied it.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>02</span><strong>A Trade-Led Agenda Built Around Real Business Decisions</strong><em>+</em></button><div class="difference-detail"><div><p>Every session answers one simple question: how will this grow your rice business? No heavy theory, no general talk — only the real decisions you face. Where prices will go. Which markets to target. How to lower risk, protect margins, use new ideas and find bigger partners. You go home with clear decisions, not just notes.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>03</span><strong>Price Forecasting and Market Intelligence as a Signature Feature</strong><em>+</em></button><div class="difference-detail"><div><p>Price affects every decision — buying, stocking, contracts and exports. So BIRC 2026 makes price forecasting the main highlight: crop surveys, production estimates, demand-and-supply data and expert views, all in one place. Understand the market before it moves.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>04</span><strong>From Knowledge to Commercial Success</strong><em>+</em></button><div class="difference-detail"><div><p>Knowledge is useful only when it makes money. BIRC 2026 turns learning into results — real case studies, live market analysis and simple business examples that improve your planning, strengthen your position and protect your profit across the value chain.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>05</span><strong>Managing Risk. Improving Profit.</strong><em>+</em></button><div class="difference-detail"><div><p>Big sales do not always mean big profit — margins do. BIRC 2026 focuses on what really affects your earnings: price ups and downs, payment and transaction risk, extra costs and trade planning. Protect your money, keep your margins and grow stronger.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>06</span><strong>Discovering Tomorrow's Markets</strong><em>+</em></button><div class="difference-detail"><div><p>The next big market is not always where everyone is looking. BIRC 2026 looks ahead — new countries, changing customer tastes, new trade rules and government schemes — so you can enter early, move first and grow where the demand is going.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>07</span><strong>Innovation That Creates Business Value</strong><em>+</em></button><div class="difference-detail"><div><p>New technology is useful only if you can actually use it. We checked hundreds of new products, technologies and solutions, and picked only the ones with real business value — shown live at the Top Innovations Reveal and Innovation Showcase. Practical, profitable and ready to use.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>08</span><strong>Experience Zones and Global Rice Cuisine Showcase</strong><em>+</em></button><div class="difference-detail"><div><p>Rice is not just a commodity — it is loved on plates all over the world. Nine special Experience Zones and a Global Rice Cuisine Showcase bring rice dishes from more than 50 countries and over 25 types of biryani to life. See the demand for yourself — and find your next product, market or value-added idea.</p></div></div></article><article class="difference-item"><button class="difference-btn" aria-expanded="false"><span>09</span><strong>Structured Networking for Meaningful Partnerships</strong><em>+</em></button><div class="difference-detail"><div><p>Good deals should not depend on luck or a chance meeting. BIRC 2026 makes networking planned and simple — app-based scheduling and organised B2B meetings connect buyers, exporters, millers and importers with the right partners. Less waiting, more real deals.</p></div></div></article></div></section>'''
          marker='<section class="zones light" id="zones">'
          if marker not in s: raise SystemExit('Experience section marker not found')
          s=s.replace(marker,html+marker,1)

          js="""document.querySelectorAll('.difference-item').forEach(item=>{const button=item.querySelector('.difference-btn');button.addEventListener('click',()=>{const was=item.classList.contains('open');document.querySelectorAll('.difference-item').forEach(x=>{x.classList.remove('open');x.querySelector('.difference-btn').setAttribute('aria-expanded','false')});if(!was){item.classList.add('open');button.setAttribute('aria-expanded','true')}})});"""
          s=s.replace('</script></body></html>',js+'</script></body></html>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          s=s.replace('7. Experience Zones carousel','7. Knowledge Sessions: 9 sessions across Day 1 and Day 2\n8. What Makes the Knowledge Sessions Different: 9 expandable differentiators\n9. Experience Zones carousel')
          s=s.replace('8. October 23, 24, 25 date composition','10. October 23, 24, 25 date composition').replace('9. Three-day programme timeline','11. Three-day programme timeline').replace('10. Industry leader quotes','12. Industry leader quotes').replace('11. Why BIRC','13. Why BIRC').replace('12. Impressions gallery','14. Impressions gallery').replace('13. Plan your visit 2 x 2 grid','15. Plan your visit 2 x 2 grid').replace('14. Final registration CTA','16. Final registration CTA').replace('15. Footer and sticky registration CTA','17. Footer and sticky registration CTA')
          note='''\n### Homepage Knowledge Sessions\n\nTwo sections sit immediately above Experience Zones in `index.html`:\n\n1. `#knowledge-sessions`: all nine Knowledge Sessions across Friday 23 October and Saturday 24 October.\n2. `#knowledge-difference`: the EY report note plus nine expandable reasons the BIRC 2026 sessions are different.\n\nThe copy was extracted from two user-supplied images on 2026-08-01 and must remain unchanged unless revised source content is supplied. The differentiators use a one-open-at-a-time accordion.\n'''
          if '### Homepage Knowledge Sessions' not in s:s=s.replace('### `about.html`',note+'\n### `about.html`')
          s=s.replace('Last updated: 2026-07-31','Last updated: 2026-08-01')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html context.md
          git commit -m 'Add Knowledge Sessions above Experience'
          git push
