name: Publish Passes Rendering Fix
on:
  push:
    paths:
      - '.github/workflows/publish-passes-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach rendering repair and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('passes.html');s=p.read_text()
          css='<link rel="stylesheet" href="assets/passes-render-fix.css?v=20260820-2347">'
          js='<script src="assets/passes-render-fix.js?v=20260820-2347"></script>'
          if 'passes-render-fix.css' not in s:s=s.replace('</head>',css+'</head>',1)
          if 'passes-render-fix.js' not in s:s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          Path('.github/workflows/publish-passes-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add passes.html .github/workflows/publish-passes-fix.yml
          git commit -m 'Publish repaired Passes cards'
          git push
