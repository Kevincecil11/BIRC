name: Desktop audit

on:
  push:
    paths:
      - '.github/workflows/desktop-audit.yml'
      - 'tools/audit.py'
      - 'tools/polish2.py'
      - 'tools/contrast_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/polish2.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Serve, fix, audit
        run: |
          sed -i "s/wait_until='load'/wait_until='domcontentloaded', timeout=60000/" tools/audit.py
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 3
          python tools/contrast_fix.py
          cat _inspect/contrast-log.txt
          python tools/audit.py
      - name: Commit
        run: |
          git config user.name "birc-bot"
          git config user.email "bot@birc.local"
          git checkout -- tools/audit.py
          git add -A _inspect *.html
          git commit -m "Contrast fixes and audit" || echo "no changes"
          git push
