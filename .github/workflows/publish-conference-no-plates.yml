name: Publish Conference No Plates
on:
  push:
    paths:
      - '.github/workflows/publish-conference-no-plates.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach hero cleanup and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-conference.html');s=p.read_text()
          css='<link rel="stylesheet" href="assets/conference-hero-no-plates.css?v=20260821-0002">'
          if 'conference-hero-no-plates.css' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          Path('.github/workflows/publish-conference-no-plates.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-conference.html .github/workflows/publish-conference-no-plates.yml
          git commit -m 'Publish Knowledge hero without thumbnails'
          git push
