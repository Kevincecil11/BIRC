name: Mobile single-frame fix
on:
  push:
    branches: [main]
    paths:
      - 'assets/mobile-one-frame-fix.css'
      - '.github/workflows/mobile-one-frame-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Attach final one-frame layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          tag='<link rel="stylesheet" href="assets/mobile-one-frame-fix.css?v=20260826-1">'
          if tag not in s: s=s.replace('</head>',tag+'</head>')
          p.write_text(s)
          p=Path('context.md'); s=p.read_text()
          old='- The homepage Passes section and Published Across rail use explicit mobile overrides even when Mobile view is forced on a wide desktop browser; do not let desktop media queries compress or offset them.'
          new='- The homepage Passes section must show VIP, Standard and Rice Festival together in one three-column mobile frame. The Published Across label, moving outlet rail and See Coverage control must share one single horizontal line, including when Mobile view is forced on a wide desktop browser.'
          s=s.replace(old,new); p.write_text(s)
          Path('publish-refresh.html').write_text('<!doctype html><meta charset="utf-8"><title>BIRC publish marker</title><!-- mobile one-frame fix 2026-08-26 -->\n')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html context.md publish-refresh.html
          git commit -m "Apply mobile single-frame passes and media rail"
          git push
