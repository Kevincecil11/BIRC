name: Update BIRC hamburger menu

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-menu.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace navigation copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          new = '''<nav><a href="#top">Home</a><a href="#about">About <small>⌄</small></a><a href="#programme">Conference <small>⌄</small></a><a href="#exhibition">Exhibition <small>⌄</small></a><a href="#zones">Experience</a><a href="#partnership">Partnership <small>⌄</small></a><a href="#visit">Plan Visit <small>⌄</small></a><a href="#contact">Contact</a></nav><div class="drawer-social"><a href="#">Instagram</a><span>·</span><a href="#">LinkedIn</a></div>'''
          s, count = re.subn(r'<nav><a href="#pathways">Take part.*?</nav><p>', new + '<p>', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected menu markup was not found')
          p.write_text(s)
          PY
      - name: Add social link styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          css = '.drawer-social{display:flex;gap:7px;align-items:center;padding-top:18px;border-top:1px dashed var(--dl);color:var(--dm);font-size:13px}.drawer-social a{color:inherit}.drawer-social a:hover{color:var(--g)}'
          s = s.replace('</style></head>', css + '</style></head>', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use approved hamburger menu copy'
          git push
