name: Fix registration chooser flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-registration-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire every registration CTA to the chooser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text()

          html = html.replace('<a class="btn" href="#">Secure your early bird rate ↗</a>', '<a class="btn" href="#register">Secure your early bird rate ↗</a>')

          marker = '</dialog></body></html>'
          script = '''</dialog><script>
          (function(){
            const dialog=document.getElementById('registrationDialog');
            const closeButton=document.getElementById('registrationClose');
            if(!dialog||!closeButton)return;

            function openRegistration(event){
              if(event)event.preventDefault();
              if(typeof dialog.showModal==='function')dialog.showModal();
              else dialog.setAttribute('open','');
              document.body.classList.add('registration-open');
            }

            function closeRegistration(){
              if(typeof dialog.close==='function'&&dialog.open)dialog.close();
              else dialog.removeAttribute('open');
              document.body.classList.remove('registration-open');
            }

            document.addEventListener('click',function(event){
              const trigger=event.target.closest('a[href="#register"]');
              if(!trigger)return;
              openRegistration(event);
            });

            closeButton.addEventListener('click',closeRegistration);
            dialog.addEventListener('cancel',function(){
              document.body.classList.remove('registration-open');
            });
            dialog.addEventListener('close',function(){
              document.body.classList.remove('registration-open');
            });
            dialog.addEventListener('click',function(event){
              const box=dialog.getBoundingClientRect();
              const outside=event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom;
              if(outside)closeRegistration();
            });
          })();
          </script></body></html>'''

          if 'function openRegistration(event)' not in html:
              if marker not in html:
                  raise SystemExit('Registration dialog marker not found')
              html = html.replace(marker, script)

          path.write_text(html)

          context = Path('context.md')
          if context.exists():
              text = context.read_text()
              note = '\n- Registration flow: every homepage registration CTA opens a native chooser for Visitor, Exhibitor, or Buyer; each choice routes to `register.html?type=<role>`.\n'
              if 'every homepage registration CTA opens a native chooser' not in text:
                  context.write_text(text.rstrip()+note)
          PY
      - name: Commit the working flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html context.md
          git diff --cached --quiet && exit 0
          git commit -m "Wire registration chooser to role forms"
          git push
