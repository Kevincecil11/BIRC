name: Desktop polish

on:
  push:
    paths:
      - '.github/workflows/desktop-polish.yml'
      - 'tools/desktop_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/desktop_polish.py
      - run: cat _inspect/polish-log.txt
      - name: Commit
        run: |
          git config user.name "birc-bot"
          git config user.email "bot@birc.local"
          git add -A
          git commit -m "Desktop polish: masterchef, artists, plan visit, partnership, contact" || echo "no changes"
          git push
