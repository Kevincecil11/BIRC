name: Apply desktop navigation and bottom bar refinement

on:
  push:
    paths:
      - '.github/workflows/add-desktop-controls-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop-only refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('desktop.html')
          h=p.read_text()

          css='''
          /* compact desktop masthead */
          .masthead .shell{grid-template-columns:auto 1fr auto;gap:26px}
          .mainnav{display:none}
          .header-center{display:flex;justify-content:center;align-items:center;gap:8px}
          .utility-link{height:40px;padding:0 13px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--dl);color:var(--dm);font:600 9px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:border-color .2s var(--e),color .2s var(--e)}
          .utility-link:hover{border-color:var(--gold);color:var(--linen)}
          .menu-toggle{width:42px;height:42px;padding:0;display:grid;place-content:center;gap:5px;border:1px solid var(--dl);background:transparent;color:var(--linen);cursor:pointer}
          .menu-toggle i{display:block;width:17px;height:1px;background:currentColor;transition:transform .3s var(--e),opacity .2s var(--e)}
          .menu-toggle[aria-expanded=true] i:first-child{transform:translateY(3px) rotate(45deg)}
          .menu-toggle[aria-expanded=true] i:last-child{transform:translateY(-3px) rotate(-45deg)}
          .desktop-menu-shade{position:fixed;z-index:67;inset:0;background:#0d0d0bb3;opacity:0;pointer-events:none;transition:opacity .25s var(--e)}
          .desktop-menu-shade.on{opacity:1;pointer-events:auto}
          .desktop-menu{position:fixed;z-index:68;top:0;right:0;width:min(520px,42vw);height:100vh;padding:34px 42px 46px;background:var(--ink-3);border-left:1px solid var(--dl);transform:translateX(102%);transition:transform .45s var(--e);overflow:auto}
          .desktop-menu.open{transform:none}
          .desktop-menu-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid var(--dl)}
          .desktop-menu-head img{width:132px;height:42px;object-fit:contain}
          .desktop-menu-close{width:44px;height:44px;border:1px solid var(--dl);background:transparent;color:var(--linen);font-size:22px;cursor:pointer}
          .desktop-menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 38px;margin-top:26px}
          .menu-col>a,.menu-group>span{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid var(--dl);font:600 17px Poppins,sans-serif;letter-spacing:-.025em;color:var(--linen)}
          .menu-group>span{color:var(--gold)}
          .menu-sub{padding:8px 0 18px;border-bottom:1px solid var(--dl)}
          .menu-sub a{display:flex;justify-content:space-between;padding:8px 0;color:var(--dm);font:500 13px Poppins,sans-serif}
          .menu-sub a:hover,.menu-col>a:hover{color:var(--gold)}
          .menu-sub i{font-style:normal;color:var(--gold-deep);font-size:10px}
          .desktop-menu-foot{margin-top:34px;padding-top:24px;border-top:1px solid var(--dl);display:flex;gap:10px}
          .desktop-menu-foot a{flex:1;height:48px;display:grid;place-items:center;border:1px solid var(--dl);font:600 10px Poppins,sans-serif;text-transform:uppercase;letter-spacing:.1em}
          .desktop-menu-foot a:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}
          /* full-width desktop bottom action bar */
          .float-time{position:fixed;z-index:66;left:0;right:0;bottom:0;min-height:84px;padding:10px max(56px,calc((100vw - 1320px)/2));display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;background:var(--ink);border-top:1px solid var(--dl);box-shadow:0 -14px 42px #0007;transform:translateY(110%);opacity:0;transition:transform .4s var(--e),opacity .3s var(--e)}
          .float-time.on{transform:none;opacity:1}
          .float-countdown{grid-column:2;min-width:390px;padding:12px 26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;border:1px solid var(--gold-deep);background:var(--ink-3)}
          .float-time small{color:var(--gold);font:600 10px Poppins;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
          .float-time strong{font:600 20.4px Poppins;font-variant-numeric:tabular-nums;white-space:nowrap}
          .float-actions{grid-column:3;justify-self:end;height:54px;display:grid;grid-template-columns:190px 150px;border:1px solid var(--dl)}
          .float-action{padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-right:1px solid var(--dl);background:var(--ink-3);color:var(--linen);font:600 10px Poppins;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
          .float-action:last-child{border-right:0}.float-action:hover{background:var(--grey);color:var(--gold)}
          .float-action.primary{background:var(--gold);color:var(--ink)}.float-action.primary:hover{background:var(--gold-deep)}
          .float-action span{font-size:15px;color:var(--gold)}.float-action.primary span{color:var(--ink)}
          .footer{padding-bottom:124px}
          @media(max-width:1260px){.utility-link{padding-inline:9px;font-size:8px}.desktop-menu{width:520px}.float-time{padding-inline:32px}.float-countdown{min-width:350px}.float-actions{grid-template-columns:170px 135px}}
          @media(prefers-reduced-motion:reduce){.desktop-menu-shade,.desktop-menu,.float-time{transition:none}}
          '''
          h,n=re.subn(r'/\* compact desktop masthead \*/.*?(?=</style>)',css.strip()+'\n',h,count=1,flags=re.S)
          if n==0:
              h=h.replace('</style>',css+'</style>',1)

          old_nav=re.search(r'<nav aria-label="Primary">.*?</nav>',h,re.S)
          assert old_nav,'primary nav not found'
          header_center='''<nav class="header-center" aria-label="Desktop utilities"><button class="menu-toggle" id="desktopMenuToggle" type="button" aria-label="Open site menu" aria-expanded="false"><i></i><i></i></button><a class="utility-link" href="https://api.birc.in/uploads/birc-1781162197449-632024568.pdf" target="_blank" rel="noopener">Download EY report ↗</a><a class="utility-link" href="https://api.birc.in/uploads/birc-1784615646887-946540455.pdf" target="_blank" rel="noopener">Buyer facilitation ↗</a><a class="utility-link" href="https://api.birc.in/uploads/birc-agenda-2026.pdf" target="_blank" rel="noopener">BIRC 2026 agenda ↗</a></nav>'''
          h=h[:old_nav.start()]+header_center+h[old_nav.end():]

          old_bar=re.search(r'<aside class="float-time" id="floatTime".*?</aside>',h,re.S)
          assert old_bar,'floating bar not found'
          new_bar='''<aside class="float-time" id="floatTime" aria-label="BIRC quick actions"><div class="float-countdown"><small>Summit opens in</small><strong id="floatClock">00d 00h 00m 00s</strong></div><nav class="float-actions" aria-label="Quick actions"><a class="float-action primary" href="desktop-space-rental.html">Book your stand <span>↗</span></a><a class="float-action" href="https://wa.me/">WhatsApp <span>↗</span></a></nav></aside>'''
          h=h[:old_bar.start()]+new_bar+h[old_bar.end():]

          drawer='''<div class="desktop-menu-shade" id="desktopMenuShade"></div><aside class="desktop-menu" id="desktopMenu" aria-label="Site menu"><header class="desktop-menu-head"><img src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"><button class="desktop-menu-close" id="desktopMenuClose" type="button" aria-label="Close site menu">×</button></header><div class="desktop-menu-grid"><nav class="menu-col"><a href="desktop.html">Home <span>01</span></a><a href="desktop-about.html">About <span>02</span></a><a href="desktop-conference.html">Conference <span>03</span></a><div class="menu-group"><span>Exhibition</span><div class="menu-sub"><a href="desktop-exhibition.html">Why exhibit <i>01</i></a><a href="desktop-exhibitor-profile.html">Exhibitor profile <i>02</i></a><a href="desktop-space-rental.html">Space rental <i>03</i></a></div></div><a href="desktop-experience.html">Experience <span>04</span></a></nav><nav class="menu-col"><div class="menu-group"><span>Influencers</span><div class="menu-sub"><a href="desktop-creators.html">Content Creators <i>01</i></a><a href="desktop-rice-masterchef.html">Rice Masterchef <i>02</i></a><a href="desktop-artists.html">Artists <i>03</i></a></div></div><a href="desktop-partnership.html">Partnership <span>05</span></a><a href="desktop-plan-visit.html">Plan Visit <span>06</span></a><a href="desktop-contact.html">Contact <span>07</span></a></nav></div><footer class="desktop-menu-foot"><a href="index.html?view=mobile">Mobile view</a><a href="https://birc.in/login">Login</a></footer></aside>'''
          assert '<main>' in h
          h=h.replace('<main>',drawer+'<main>',1)

          menu_script='''<script id="desktop-menu-script">(function(){var menu=document.getElementById('desktopMenu'),shade=document.getElementById('desktopMenuShade'),toggle=document.getElementById('desktopMenuToggle'),close=document.getElementById('desktopMenuClose');function setMenu(open){menu.classList.toggle('open',open);shade.classList.toggle('on',open);toggle.setAttribute('aria-expanded',String(open));document.body.classList.toggle('locked',open)}toggle.addEventListener('click',function(){setMenu(!menu.classList.contains('open'))});close.addEventListener('click',function(){setMenu(false)});shade.addEventListener('click',function(){setMenu(false)});menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setMenu(false)})});document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)})})();</script>'''
          h=h.replace('</body>',menu_script+'</body>',1)

          assert h.count('<style>')==1 and h.count('</style>')==1
          assert 'Register to visit' not in new_bar and '>Login <' not in new_bar
          p.write_text(h)

          p=Path('context.md');c=p.read_text()
          old='- Desktop floating controls: visible `Mobile view` header control plus one full-width bottom bar containing the live countdown and four always-visible actions: Book your stand, Register to visit, Login, and WhatsApp. The separate Register button and expandable `+` dock were removed. Mobile controls remain unchanged.'
          new='- Desktop homepage floating controls: full-width bottom bar with a 20% larger highlighted countdown centred in the viewport; only Book your stand and WhatsApp sit at the right. Mobile controls remain unchanged.'
          assert c.count(old)==1
          c=c.replace(old,new)
          anchor='### Masthead\n\nFixed, `76px`, `#0d0d0bf0` with a `--dl` bottom border. Grid of `145px 1fr auto`: logo, centred inline nav, tools. Nav order is Home, About, Conference, Exhibition (hover dropdown, 3 items), Experience, Influencers (hover dropdown, 3 items), Partnership, Plan Visit, Contact. Current page marked with `aria-current="page"` in gold. Tools are a bordered `Mobile view` ghost link and a gold `Register ↗` button.'
          replacement='''### Masthead

Desktop homepage masthead uses the logo, a sandwich-menu control, and three utility PDF links: Download EY report, Buyer facilitation, and BIRC 2026 agenda. The drawer contains every main menu and the Exhibition and Influencers submenus. Existing Mobile view, Login, and Register controls remain. Other approved desktop pages retain their current inline masthead until navigation is intentionally synchronized across the experience.'''
          assert c.count(anchor)==1
          c=c.replace(anchor,replacement)
          c=c.replace('- Homepage Login and WhatsApp destination URLs','- Homepage WhatsApp destination URL')
          c=c.replace('- Conference Agenda and Schedule, Workshops, Learning Academy content','- Conference Agenda and Schedule page content (the official agenda PDF is linked from the desktop homepage masthead), Workshops, Learning Academy content')
          p.write_text(c)
          PY
      - name: Commit the desktop batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html context.md
          git commit -m "Refine desktop navigation and floating action bar"
          git push
