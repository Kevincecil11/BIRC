name: Rebuild desktop exhibitor profile grid

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-exhibitor-profile-grid.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exhibition profile experience
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html

          files=['desktop-exhibition.html','desktop-exhibitor-profile.html','desktop-space-rental.html']
          for name in files:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('Part 1 · Why Exhibit','Why Exhibit').replace('Part 2 · Exhibitor Profile','Exhibitor Profile').replace('Part 3 · Space Rental','Space Rental')
              p.write_text(s,encoding='utf-8')

          p=Path('desktop-exhibitor-profile.html'); s=p.read_text(encoding='utf-8')
          profiles=[
          ('Rice Millers','Companies and cooperatives processing raw paddy into finished rice products.',['Modern milling technologies','Plant infrastructure','Varieties processed','Hygiene standards']),
          ('Exporters','Export businesses connecting Indian rice supply to global markets.',['Export destinations','Quality certifications','Buyer relationships','Private-label capability']),
          ('Traders','Domestic and international rice trading houses.',['Trading capacity','Risk management','Spot and forward contracts','Market intelligence']),
          ('Equipment','Machinery manufacturers serving milling and packaging.',['Milling machinery','Packaging systems','Automation','After-sales service']),
          ('Agri-Tech','Technology companies serving the rice value chain.',['Traceability platforms','Biotechnology','Data and analytics','Smart irrigation']),
          ('Logistics','Shipping and transportation providers moving rice worldwide.',['Container capacity','Transit solutions','Storage','Documentation support']),
          ('Packaging','Packaging and storage solution providers.',['Export-grade formats','Compliance','Warehousing','Sustainable materials']),
          ('Testing & Certification','Laboratories and agencies supporting market compliance.',['MRL testing','Food-safety certification','Compliance audits','Accreditation']),
          ('Government','Departments and export-promotion councils enabling trade.',['Trade policy','Export schemes','Trade facilitation','Regulatory guidance']),
          ('Research','Research institutions and academia advancing rice.',['Breeding research','Sustainability studies','White papers','Industry collaboration']),
          ('Startups','Value-added product and innovation ventures.',['Nutraceuticals','Novel packaging','Retail innovation','Funding opportunities'])]
          ecosystem=['Rice Exporters','Rice Millers','Rice Processors','Grading & Sorting Machinery','Packaging & Labeling Solutions','Automation Companies','ICT Providers','Banking & Insurance','Testing Laboratories','Shipping Companies','Transportation & Logistics','Freight Forwarders','Storage & Warehousing','Biotechnology Companies','Crop Protection','Sustainability Solutions','Food Safety Services','Allied Commodity Traders','Trade Associations','Government Departments','Value-added Startups']

          cards=[]
          for i,(title,copy,items) in enumerate(profiles,1):
              bullets=''.join(f'<li>{html.escape(x)}</li>' for x in items)
              cards.append(f'''<article class="exhibitor-card"><div class="exhibitor-card-top"><span>{i:02d} / 11</span><span>Exhibitor profile</span></div><div class="exhibitor-symbol" aria-hidden="true"><b>{i:02d}</b><i></i></div><h3>{html.escape(title)}</h3><p>{html.escape(copy)}</p><div class="exhibitor-detail"><span>They typically showcase</span><ul>{bullets}</ul></div></article>''')
          pointers=''.join(f'<li>{html.escape(x)}</li>' for x in ecosystem)
          replacement=f'''<section class="view page-current exhibitor-atlas" id="exhibitor-profile"><div class="shell"><header class="exhibitor-atlas-head"><span class="eye">Exhibitor Profile</span><div><h2 class="title">Explore who exhibits</h2><p class="lead">The entire global rice value chain, organised for faster discovery.</p></div></header><div class="exhibitor-grid">{''.join(cards)}</div><section class="ecosystem"><header><span class="eye">Across the floor</span><h3>The entire rice ecosystem</h3></header><ul class="ecosystem-pointers">{pointers}</ul></section></div></section>'''
          s,n=re.subn(r'<section class="view page-current" id="exhibitor-profile">.*?</section>(?=<section class="view" id="space-rental">)',replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'profile section match: {n}')

          css=r'''<style id="exhibitor-atlas-system">
          .exhibitor-atlas{padding:112px 0 140px!important}
          .exhibitor-atlas-head{display:grid;grid-template-columns:240px minmax(0,1fr);gap:88px;align-items:start;margin-bottom:60px}
          .exhibitor-atlas-head>.eye{padding-top:12px}.exhibitor-atlas-head h2{margin:0}.exhibitor-atlas-head .lead{margin-top:20px}
          .exhibitor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--dl);border:1px solid var(--dl)}
          .exhibitor-card{position:relative;min-height:470px;padding:24px 26px 28px;background:var(--j);overflow:hidden;transition:background .25s var(--e),color .25s var(--e)}
          .exhibitor-card:hover{background:var(--j2)}
          .exhibitor-card-top{display:flex;justify-content:space-between;color:var(--lm);font:600 9px Poppins;letter-spacing:.14em;text-transform:uppercase}
          .exhibitor-symbol{position:relative;height:150px;margin:28px 0 24px;border:1px solid var(--dl);overflow:hidden}
          .exhibitor-symbol:before,.exhibitor-symbol:after{content:"";position:absolute;border:1px solid var(--dl);border-radius:50%}.exhibitor-symbol:before{width:170px;height:170px;right:-28px;top:-68px}.exhibitor-symbol:after{width:100px;height:100px;right:8px;top:-33px}
          .exhibitor-symbol b{position:absolute;left:18px;bottom:12px;color:var(--m);font:600 78px/.8 Poppins;letter-spacing:-.08em}.exhibitor-symbol i{position:absolute;left:18px;right:18px;top:50%;height:1px;background:var(--g);transform:rotate(-8deg)}
          .exhibitor-card h3{font:600 29px/1.08 Poppins;letter-spacing:-.045em}.exhibitor-card>p{margin-top:13px;color:var(--dm);font-size:14px;line-height:1.55;max-width:38ch}
          .exhibitor-detail{margin-top:26px;padding-top:18px;border-top:1px solid var(--dl)}.exhibitor-detail>span{color:var(--g);font:600 8px Poppins;letter-spacing:.13em;text-transform:uppercase}.exhibitor-detail ul{margin:12px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.exhibitor-detail li{position:relative;padding:9px 0 9px 18px;border-top:1px solid var(--dl);color:var(--dm);font-size:12px}.exhibitor-detail li:before{content:"";position:absolute;left:0;top:15px;width:9px;height:4px;background:var(--g);transform:rotate(-18deg) skewX(-10deg)}
          .ecosystem{margin-top:96px;padding:54px 0 16px;border-block:1px solid var(--dl);display:grid;grid-template-columns:300px minmax(0,1fr);gap:64px;align-items:start}.ecosystem header h3{margin:20px 0 0;font:600 38px/1.02 Poppins;letter-spacing:-.05em}.ecosystem-pointers{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}.ecosystem-pointers li{position:relative;min-height:48px;padding:14px 8px 12px 28px;border-top:1px solid var(--dl);color:var(--dm);font-size:13px}.ecosystem-pointers li:before{content:"";position:absolute;left:2px;top:20px;width:13px;height:6px;background:var(--g);transform:rotate(-18deg) skewX(-10deg)}
          @media(max-width:1400px){.exhibitor-atlas-head{grid-template-columns:190px 1fr;gap:56px}.exhibitor-card{min-height:450px;padding:20px}.ecosystem{grid-template-columns:250px 1fr;gap:48px}}
          @media(max-width:1180px){.exhibitor-grid{grid-template-columns:repeat(2,1fr)}.ecosystem-pointers{grid-template-columns:repeat(2,1fr)}}
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Rebuilt exhibitor profile into 11-card atlas and pointer ecosystem.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-exhibition.html desktop-exhibitor-profile.html desktop-space-rental.html
          git diff --cached --quiet || git commit -m "Rebuild exhibitor profile grid and simplify Exhibition labels"
          git push
