name: Refine desktop homepage navigation and hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-desktop-home.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop homepage refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('desktop.html')
          h=p.read_text()

          nav='''<div class="nav-utilities"><button class="nav-search" type="button" aria-label="Search BIRC"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button><a class="utility-link" href="https://api.birc.in/uploads/birc-1781162197449-632024568.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg><span>EY report</span></a><a class="utility-link" href="https://api.birc.in/uploads/birc-1784615646887-946540455.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM8 7V5h8v2"/><path d="M4 12h16M10 15h4"/></svg><span>Buyer facilitation</span></a><a class="utility-link" href="https://api.birc.in/uploads/birc-agenda-2026.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M13 14h3"/></svg><span>2026 agenda</span></a></div>'''
          h,n=re.subn(r'<nav class="header-center" aria-label="Desktop utilities">.*?</nav>',nav,h,count=1,flags=re.S)
          assert n==1, f'header utilities replacement: {n}'

          tools='''<div class="tools"><div class="nav-countdown"><small>Opens in</small><strong id="navClock">00d 00h 00m</strong></div><a class="ghost" href="https://birc.in/login">Login</a><button class="solid" type="button" data-register>Register <span aria-hidden="true">&#8599;</span></button><button class="menu-toggle" id="desktopMenuToggle" type="button" aria-label="Open site menu" aria-expanded="false"><i></i><i></i></button></div>'''
          h,n=re.subn(r'<div class="tools"><a class="ghost mobile-view-control".*?</div>\s*</div>\s*</header>',tools+'</div></header>',h,count=1,flags=re.S)
          assert n==1, f'header tools replacement: {n}'

          floats='''<aside class="side-actions" aria-label="Quick actions"><a class="side-action stand" href="desktop-space-rental.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16v11H4zM3 5h18l-2 4H5zM8 13v7M16 13v7"/></svg><span>Book your stand</span></a><a class="side-action whatsapp" href="https://wa.me/" aria-label="Open WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.4 2.6 2 4.2 4.6 4.9"/></svg><span>WhatsApp</span></a></aside>'''
          h,n=re.subn(r'<aside class="float-time" id="floatTime".*?</aside>',floats,h,count=1,flags=re.S)
          assert n==1, f'bottom bar replacement: {n}'
          h,n=re.subn(r'<script id="desktop-controls-script">.*?</script>','',h,count=1,flags=re.S)
          assert n==1, f'old clock script removal: {n}'

          css='''
          /* desktop navigation, hero symmetry and side actions */
          .masthead{height:78px;background:#0d0d0bf5;border-bottom:1px solid var(--dl);backdrop-filter:none}
          .masthead .shell{width:min(1760px,calc(100% - 40px));grid-template-columns:150px minmax(0,1fr) auto;gap:18px}
          .brand img{width:142px;height:46px}
          .nav-utilities{min-width:0;display:flex;align-items:center;justify-content:center;gap:7px}
          .nav-search{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--dl);border-radius:50%;background:var(--ink-3);color:var(--linen);cursor:pointer}
          .nav-search:hover{border-color:var(--gold);color:var(--gold)}
          .nav-search svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
          .utility-link{height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--dl);border-radius:0;background:var(--ink-3);color:var(--dm);font:600 9px Poppins,sans-serif;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
          .utility-link:hover{border-color:var(--gold);color:var(--linen)}
          .utility-link svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--gold)}
          .tools{gap:7px}
          .nav-countdown{height:42px;min-width:154px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--gold-deep);background:var(--ink-3)}
          .nav-countdown small{color:var(--gold);font:600 8px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase}
          .nav-countdown strong{margin-top:2px;font:600 12px Poppins,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
          .menu-toggle{order:99;width:42px;height:42px;flex:none;display:grid;place-content:center;gap:5px;border:1px solid var(--dl);background:var(--ink-3);color:var(--linen);cursor:pointer}
          .menu-toggle:hover{border-color:var(--gold)}.menu-toggle i{display:block;width:17px;height:1px;background:currentColor}
          .mobile-view-control{display:none!important}
          .float-time{display:none!important}.footer{padding-bottom:40px}
          .side-actions{position:fixed;z-index:65;right:18px;top:50%;transform:translateY(-50%);display:grid;gap:8px}
          .side-action{height:52px;min-width:176px;padding:0 15px;display:flex;align-items:center;gap:10px;border:1px solid var(--dl);box-shadow:0 12px 30px #0008;font:600 10px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase}
          .side-action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
          .side-action.stand{background:var(--gold);border-color:var(--gold);color:var(--ink)}
          .side-action.whatsapp{background:var(--ink-3);color:var(--linen)}.side-action:hover{transform:translateX(-4px)}
          .hero{padding-top:calc(var(--nav) + 48px);padding-bottom:56px;align-items:center}
          .hero .shell{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:stretch}
          .hero-copy{min-height:620px;padding-right:24px;display:flex;flex-direction:column;justify-content:center}
          .hero-copy .eyebrow{margin-top:0}
          .hero h1{font-size:clamp(62px,5vw,96px);max-width:11ch}
          .hero .lede{max-width:52ch}
          .scrollcue{margin-top:auto;padding-top:38px}
          .dossier{width:100%;max-width:none;min-height:620px;align-self:stretch;display:grid;grid-template-rows:auto 1fr auto;background:#12120fe8}
          .dossier-head{min-height:58px;padding:0 26px}
          .spec{height:100%;display:grid;grid-template-columns:160px minmax(0,1fr);grid-template-rows:repeat(5,1fr);gap:0;padding:0;border-bottom:1px solid var(--dl)}
          .spec dt,.spec dd{min-height:0;height:100%;display:flex;align-items:center;border-bottom:1px solid var(--dl)}
          .spec dt{padding-left:26px}.spec dd{justify-content:flex-end;padding-right:26px}
          .countdown{min-height:96px}.countdown div{display:grid;align-content:center;padding:16px 8px}
          @media(max-width:1450px){.masthead .shell{width:calc(100% - 32px)}.utility-link{padding-inline:9px}.utility-link span{font-size:8px}.nav-countdown{min-width:138px}.tools .ghost{display:none}.side-action{min-width:156px}.hero-copy,.dossier{min-height:570px}}
          '''
          assert h.count('</style>')==1
          h=h.replace('</style>',css+'</style>',1)

          clock='''<script id="nav-countdown-script">(function(){var out=document.getElementById('navClock'),target=new Date('2026-10-23T10:00:00+05:30').getTime();function pad(n){return String(n).padStart(2,'0')}function tick(){var d=Math.max(0,target-Date.now()),days=Math.floor(d/864e5),hours=Math.floor(d/36e5)%24,mins=Math.floor(d/6e4)%60;out.textContent=days+'d '+pad(hours)+'h '+pad(mins)+'m'}tick();setInterval(tick,60000)})();</script>'''
          h=h.replace('</body>',clock+'</body>',1)
          p.write_text(h)

          c=Path('context.md');text=c.read_text()
          text=re.sub(r'### Masthead\n\n.*?\n\n### Left alignment', '''### Masthead

Desktop homepage masthead uses the official logo, a search icon, three icon-labelled PDF utilities (EY report, Buyer facilitation, 2026 agenda), the live countdown, Login, Register, and a sandwich menu at the extreme right. The Mobile view control is removed from this homepage masthead. The previous full-width bottom action bar is removed; Book your stand and WhatsApp are stacked as floating actions at the right edge. Other desktop pages retain their current inline mastheads until navigation is intentionally synchronized.

### Left alignment''', text, count=1, flags=re.S)
          old='- Desktop floating controls: visible `Mobile view` header control plus one full-width bottom bar containing the live countdown and four always-visible actions: Book your stand, Register to visit, Login, and WhatsApp. The separate Register button and expandable `+` dock were removed. Mobile controls remain unchanged.'
          new='- Desktop homepage controls: countdown lives in the masthead; Book your stand and WhatsApp are stacked on the right edge. There is no full-width bottom bar and no desktop Mobile view control. Mobile controls remain unchanged.'
          assert text.count(old)==1
          text=text.replace(old,new)
          marker='- Desktop homepage uses a wide 1680px shell with 32px minimum side gutters. Its hero is a balanced 1:1 composition: headline and summit dossier align vertically, while the dossier uses a fixed label column, equal row heights, and four equal countdown cells.'
          replacement='- Desktop homepage uses a wide 1680px shell with 32px minimum side gutters. Its hero is a balanced 1:1 composition: the copy column and summit dossier have equal 620px height and matching top/bottom edges, while the dossier uses a fixed label column, five equal fact rows, and four equal countdown cells.'
          assert text.count(marker)==1
          c.write_text(text.replace(marker,replacement))
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html context.md
          git commit -m "Refine desktop header actions and hero symmetry"
          git push
