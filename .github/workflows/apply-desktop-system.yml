name: Apply shared desktop system

on:
  push:
    paths:
      - '.github/workflows/apply-desktop-system.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_shared_desktop_system.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-*.html context.md
          git commit -m "Apply shared desktop system across all pages"
          git push
