name: Publish site

on:
  workflow_dispatch:
  push:
    paths:
      - '**.html'
      - 'assets/**'
      - '.github/workflows/publish-desktop-home.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
          reporting_interval: 5000

# Canonical production deploy. Cancel stale runs so the newest main build publishes immediately. Forced 2026-08-20 23:10 IST.
