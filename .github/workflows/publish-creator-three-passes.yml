name: Publish Creator Three Passes
on:
  push:
    paths:
      - '.github/workflows/publish-creator-three-passes.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach three-pass system to creator pages
        run: |
          python - <<'PY'
          from pathlib import Path
          css='<link rel="stylesheet" href="assets/creator-three-passes.css?v=20260820-2358">'
          js='<script src="assets/creator-three-passes.js?v=20260820-2358"></script>'
          for name in ('desktop-creators.html','creators.html'):
              p=Path(name);s=p.read_text()
              if 'creator-three-passes.css' not in s:s=s.replace('</head>',css+'</head>',1)
              if 'creator-three-passes.js' not in s:s=s.replace('</body>',js+'</body>',1)
              p.write_text(s)
          Path('.github/workflows/publish-creator-three-passes.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-creators.html creators.html .github/workflows/publish-creator-three-passes.yml
          git commit -m 'Publish three Creator pass outcomes'
          git push
