name: Purge Influencer blue
on:
  push:
    paths: ['.github/workflows/purge-influencer-blue.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace every blue surface with BIRC ink
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['creators.html','rice-masterchef.html','artists.html']
          # Includes known source navy plus common variants from the source site.
          blue_values=['#17354c','#17354C','#18334b','#18334B','#0f253a','#0F253A','#102f47','#143b56','rgb(23, 53, 76)','rgb(24, 51, 75)']
          for name in pages:
              p=Path(name);s=p.read_text()
              for value in blue_values:s=s.replace(value,'#191916')
              # Force all previously named blue feature surfaces to approved raised ink.
              css='''/* Enforce design.md palette: zero blue */.criteria,.winner,.master-pass.vip,.pass.vip{background:var(--j2)!important;border-color:var(--dl)!important}.criteria-list,.winner-list{border-color:var(--dl)!important}.criterion,.winner-row{border-color:var(--dl)!important}'''
              if '/* Enforce design.md palette: zero blue */' not in s:s=s.replace('</style></head>',css+'</style></head>',1)
              p.write_text(s)
          PY
      - name: Update context and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          rule='Influencer pages have a zero-blue rule: use `#0d0d0b` ink and `#191916` raised ink for every dark surface. Source-site navy values such as `#17354c`, `#18334b`, and `#0f253a` are forbidden.'
          if rule not in s:s=s.replace('## 7. Design decisions that must persist',rule+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creators.html rice-masterchef.html artists.html context.md
          git commit -m 'Remove all blue from Influencer pages'
          git push
