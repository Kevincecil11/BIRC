<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Registration | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--j:#0d0d0b;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--lm:#6d6862;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}body{margin:0;background:#211f1d;color:var(--j);font:400 16px/1.55 Inter,sans-serif}.page{width:min(100%,520px);min-height:100svh;margin:auto;background:var(--l);padding:0 var(--p) 52px}.bar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ll)}.logo{width:158px;height:48px;object-fit:contain;filter:invert(1);mix-blend-mode:multiply}.close{width:44px;height:44px;border:1px solid var(--ll);border-radius:50%;background:none;font-size:23px}.head{text-align:center;padding:42px 0 34px}.eye{font:600 9px Poppins;letter-spacing:.17em;text-transform:uppercase;color:var(--g2)}h1{font:600 clamp(28px,8vw,40px)/1 Poppins;letter-spacing:-.055em;margin:18px 0 25px}.steps{display:flex;align-items:center;justify-content:center}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e4dac9;color:var(--lm);font:600 11px Poppins}.dot.active{background:var(--g);color:var(--j)}.line{width:62px;height:2px;background:var(--ll)}.line.active{background:var(--g)}.panel{display:none}.panel.active{display:block;animation:enter .45s var(--e)}@keyframes enter{from{opacity:0;transform:translateY(14px)}}.fields{display:grid;gap:22px}.field{display:grid;gap:8px}.field label,.legend{font:600 10px Poppins;letter-spacing:.06em;color:var(--lm)}.req{color:var(--g2)}.field input,.field select{width:100%;height:52px;border:1px solid var(--ll);border-radius:0;background:transparent;padding:0 14px;color:var(--j);font-size:16px}.field input:focus,.field select:focus{outline:3px solid #ebb34145;border-color:var(--g2)}.phone{display:grid;grid-template-columns:112px 1fr;gap:8px}.check{display:flex;align-items:flex-start;gap:10px;color:var(--lm);font-size:13px}.check input,.industry input{accent-color:var(--g2);width:18px;height:18px;flex:none}.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:30px}.actions.single{grid-template-columns:1fr}.btn{height:54px;border:1px solid var(--j);background:var(--j);color:var(--l);font:600 12px Poppins}.btn.back{width:84px;background:transparent;color:var(--j);border-color:var(--ll)}.btn.primary{background:var(--g);border-color:var(--g);color:var(--j)}fieldset{border:0;padding:0;margin:0}.industries{display:grid;gap:12px;margin-top:18px}.industry{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--ll);color:var(--lm);font-size:14px}.declaration{margin-top:28px;padding-top:20px;border-top:1px solid var(--ll)}.legal{text-align:center;color:var(--lm);font-size:11px;margin-top:34px}.legal a{color:var(--j);font-weight:600}.status{text-align:center;min-height:22px;margin-top:18px;color:var(--g2);font-size:13px}.success{display:none;text-align:center;padding:80px 0}.success.active{display:block}.mark{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--g);font-size:28px}.success h2{font:600 34px/1 Poppins;margin:25px 0 13px}.success p{color:var(--lm)}@media(prefers-reduced-motion:reduce){.panel{animation:none}}</style></head><body><main class="page"><header class="bar"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"><button class="close" id="closeBtn" aria-label="Close">×</button></header><section id="formView"><header class="head"><span class="eye">Registration</span><h1 id="title">Visitor Registration</h1><div class="steps"><span class="dot active" id="d1">1</span><span class="line" id="ln"></span><span class="dot" id="d2">2</span></div></header><form id="form"><section class="panel active" id="p1"><div class="fields"><div class="field"><label>Name <span class="req">*</span></label><input name="name" required autocomplete="name" placeholder="Enter your full name"></div><div class="field"><label>Company Name <span class="req">*</span></label><input name="company" required autocomplete="organization" placeholder="Enter company name"></div><div class="field"><label>Mobile Number <span class="req">*</span></label><div class="phone"><select name="code" required><option>+91</option><option>+1</option><option>+44</option><option>+971</option><option>+65</option><option>+254</option><option>+27</option></select><input name="phone" required type="tel" placeholder="Enter phone number"></div></div><label class="check"><input name="whatsapp" type="checkbox" checked><span>WhatsApp Number Same as Mobile Number</span></label><div class="field"><label>Country <span class="req">*</span></label><select name="country" required><option value="">Select country</option><option>India</option><option>United Arab Emirates</option><option>United States</option><option>United Kingdom</option><option>Singapore</option><option>Kenya</option><option>South Africa</option><option>Other</option></select></div><div class="field"><label>Email <span class="req">*</span></label><input name="email" type="email" required placeholder="Enter email"></div><label class="check"><input name="remember" type="checkbox"><span>Remember me</span></label></div><div class="actions single"><button class="btn primary" id="next" type="button">Next →</button></div></section><section class="panel" id="p2"><fieldset><legend class="legend">Industry Type <span class="req">*</span></legend><div class="industries" id="industryList"></div></fieldset><div class="declaration"><label class="check"><input name="declaration" type="checkbox" required><span>I declare that all information provided is accurate and complete <span class="req">*</span></span></label></div><div class="actions"><button class="btn back" id="back" type="button">Back</button><button class="btn primary" type="submit">Submit →</button></div></section><div class="status" id="status" role="status"></div></form><p class="legal">By registering, you agree to our <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.</p></section><section class="success" id="success"><div class="mark">✓</div><h2>Registration ready.</h2><p>Your completed registration has been prepared for the BIRC team.</p><button class="btn primary" id="finish" style="width:100%;margin-top:24px">Return to BIRC</button></section></main><script>const q=new URLSearchParams(location.search),raw=(q.get('type')||'visitor').toLowerCase(),type=['visitor','exhibitor','buyer'].includes(raw)?raw:'visitor',labels={visitor:'Visitor',exhibitor:'Exhibitor',buyer:'Buyer'};title.textContent=labels[type]+' Registration';document.title=labels[type]+' Registration | BIRC 2026';const inds=['Buyer','Importer','Rice Miller','Exporter','Trader','Commodity Broker','Modern Trade Buyer','FPO','Farmer','Logistics & Supply Chain','Equipment Manufacturer','Packaging Solution','Agri-Tech Companies','Testing & Certification','Government Bodies','Research Institution','Others'];industryList.innerHTML=inds.map(x=>`<label class="industry"><input type="checkbox" name="industry" value="${x}"><span>${x}</span></label>`).join('');function step(n){p1.classList.toggle('active',n===1);p2.classList.toggle('active',n===2);d2.classList.toggle('active',n===2);ln.classList.toggle('active',n===2);scrollTo({top:0,behavior:'smooth'})}next.onclick=()=>{const r=[...p1.querySelectorAll('[required]')];if(r.some(x=>!x.reportValidity()))return;step(2)};back.onclick=()=>step(1);closeBtn.onclick=finish.onclick=()=>location.href='index.html';form.onsubmit=e=>{e.preventDefault();const selected=[...document.querySelectorAll('[name="industry"]:checked')].map(x=>x.value);if(!selected.length){status.textContent='Choose at least one industry type.';return}const d=new FormData(form),subject=encodeURIComponent(`BIRC 2026 ${labels[type]} Registration`),body=encodeURIComponent(`Type: ${labels[type]}\nName: ${d.get('name')}\nCompany: ${d.get('company')}\nMobile: ${d.get('code')} ${d.get('phone')}\nWhatsApp same: ${d.get('whatsapp')?'Yes':'No'}\nCountry: ${d.get('country')}\nEmail: ${d.get('email')}\nIndustry: ${selected.join(', ')}`),to=type==='visitor'?'visit@birc.in':'booking@birc.in';formView.style.display='none';success.classList.add('active');setTimeout(()=>location.href=`mailto:${to}?subject=${subject}&body=${body}`,450)};</script></body></html>
