name: Rebuild desktop homepage Experience Zones

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-home-experience-grid.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Experience Zones section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('desktop.html')
          s=p.read_text(encoding='utf-8')

          css=r'''<style id="home-zone-grid-reference">
          /* Reference-led 3x3 zone atlas, translated into BIRC's ink, linen and gold system */
          .zones.zone-atlas{padding:124px 0 136px;background:var(--linen);color:var(--ink)}
          .zone-atlas-head{display:grid;grid-template-columns:320px minmax(0,1fr);gap:64px;align-items:end;margin-bottom:52px}
          .zone-atlas-head .eyebrow{align-self:start;padding-top:12px;color:var(--gold-deep)}
          .zone-atlas-title{display:flex;align-items:end;justify-content:space-between;gap:40px}
          .zone-atlas-title h2{font:600 clamp(48px,4.1vw,72px)/.94 Poppins,sans-serif;letter-spacing:-.06em;max-width:12ch}
          .zone-atlas-title p{max-width:31ch;color:var(--lm);font-size:16px;line-height:1.55;text-align:right}
          .zone-atlas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--ll);border:1px solid var(--ll)}
          .zone-card{position:relative;min-width:0;padding:20px 20px 26px;background:var(--linen);color:var(--ink);overflow:hidden;transition:background .28s var(--e),color .28s var(--e)}
          .zone-card:hover,.zone-card:focus-visible{background:var(--ink);color:var(--linen);outline:none}
          .zone-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font:600 9px Poppins,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--lm)}
          .zone-card:hover .zone-card-top,.zone-card:focus-visible .zone-card-top{color:var(--gold)}
          .zone-card-art{position:relative;width:100%;aspect-ratio:4/3;margin-bottom:22px;overflow:hidden;background:var(--ink-3);border:1px solid var(--dl);transition:transform .55s var(--e)}
          .zone-card:hover .zone-card-art,.zone-card:focus-visible .zone-card-art{transform:scale(1.025)}
          .zone-card-art:after{content:"";position:absolute;inset:14px;border:1px solid #faf0e612;pointer-events:none}
          .zone-card h3{font:600 clamp(22px,1.7vw,30px)/1.05 Poppins,sans-serif;letter-spacing:-.045em}
          .zone-card-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-top:11px}
          .zone-card p{color:var(--lm);font-size:13px;line-height:1.5;max-width:31ch;transition:color .28s var(--e)}
          .zone-card:hover p,.zone-card:focus-visible p{color:var(--dm)}
          .zone-card-arrow{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ll);color:var(--gold-deep);font-size:16px;transition:background .2s var(--e),color .2s var(--e),border-color .2s var(--e)}
          .zone-card:hover .zone-card-arrow,.zone-card:focus-visible .zone-card-arrow{background:var(--gold);border-color:var(--gold);color:var(--ink)}
          .za-route .globe{position:absolute;width:58%;aspect-ratio:1;border:1px solid var(--dl);border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%)}
          .za-route .globe:before,.za-route .globe:after{content:"";position:absolute;inset:17% 0;border-block:1px solid var(--dl);border-radius:50%}
          .za-route .globe:after{inset:0 31%;border:0;border-inline:1px solid var(--dl)}
          .za-route .trail{position:absolute;left:11%;right:9%;top:47%;height:1px;background:var(--gold);transform:rotate(-15deg)}
          .za-route .trail:after{content:"";position:absolute;right:0;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
          .za-cloud i{position:absolute;width:18px;height:52px;border:1px solid var(--gold);border-radius:100% 0 100% 0;left:var(--x);top:var(--y);transform:rotate(var(--r))}
          .za-archive{display:grid;grid-template-columns:repeat(7,1fr);gap:11px;padding:54px 48px}
          .za-archive i{position:relative;aspect-ratio:1;border:1px solid var(--dl);border-radius:50%}.za-archive i:nth-child(4n){border-color:var(--gold)}
          .za-time:before{content:"";position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--dl)}
          .za-time i{position:absolute;top:calc(50% - 7px);left:var(--x);width:14px;height:14px;background:var(--gold);border-radius:50%}
          .za-table i{position:absolute;width:62px;height:62px;border:1px solid var(--gold);border-radius:50%;left:var(--x);top:var(--y)}
          .za-hands i{position:absolute;width:96px;height:190px;border:1px solid var(--gold);border-radius:50% 50% 12px 12px;top:23%}.za-hands i:first-child{left:27%;transform:rotate(30deg)}.za-hands i:last-child{right:27%;transform:rotate(-30deg)}
          .za-within i{position:absolute;width:46%;height:72%;border:1px solid var(--gold);border-radius:100% 0 100% 0;left:50%;top:48%;transform:translate(-50%,-50%) rotate(34deg)}
          .za-within i:before,.za-within i:after{content:"";position:absolute;inset:20%;border:1px solid var(--dl);border-radius:inherit}.za-within i:after{inset:39%}
          .za-mirror i{position:absolute;inset:17%;border:1px solid var(--dl);background:repeating-radial-gradient(circle at center,transparent 0 13px,#ebb3412e 14px 15px)}
          .za-window i{position:absolute;inset:19%;border:1px solid var(--gold)}.za-window i:before,.za-window i:after{content:"";position:absolute;background:var(--gold)}.za-window i:before{width:1px;inset:0 auto 0 50%}.za-window i:after{height:1px;inset:50% 0 auto}
          .zone-atlas-foot{margin-top:36px;padding-top:24px;border-top:1px solid var(--ll);display:flex;align-items:center;justify-content:space-between;color:var(--lm);font-size:14px}
          .zone-atlas-foot a{font:600 11px Poppins,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-deep)}
          @media(max-width:1400px){.zone-atlas-head{grid-template-columns:280px 1fr;gap:48px}.zone-card{padding:16px 16px 22px}.zone-card-art{margin-bottom:18px}}
          @media(max-width:1180px){.zone-atlas-head{grid-template-columns:220px 1fr;gap:40px}.zone-atlas-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.zone-atlas-title p{display:none}.zone-card h3{font-size:22px}.zone-card p{font-size:12px}}
          @media(prefers-reduced-motion:reduce){.zone-card,.zone-card-art{transition:none}}
          </style>'''
          if 'id="home-zone-grid-reference"' in s:
              s=re.sub(r'<style id="home-zone-grid-reference">.*?</style>',css,s,flags=re.S)
          else:
              s=s.replace('</head>',css+'\n</head>',1)

          cards=[
          ('01','Trade & logistics','The Rice Route Map',"From Indian fields to the world's plates.",'za-route','<i class="globe"></i><i class="trail"></i>'),
          ('02','Innovation & data','Seed Cloud','A cloud of capsules. A network of intelligence.','za-cloud','<i style="--x:18%;--y:18%;--r:30deg"></i><i style="--x:43%;--y:31%;--r:78deg"></i><i style="--x:72%;--y:14%;--r:120deg"></i><i style="--x:28%;--y:56%;--r:165deg"></i><i style="--x:68%;--y:51%;--r:210deg"></i>'),
          ('03','Heritage & knowledge','The Rice Archive','200+ varieties. One living archive.','za-archive',''.join('<i></i>' for _ in range(28))),
          ('04','Heritage & knowledge','Rice Through Time','Ancient grain. Future harvest.','za-time','<i style="--x:14%"></i><i style="--x:39%"></i><i style="--x:64%"></i><i style="--x:84%"></i>'),
          ('05','Culture & culinary','How the World Eats Rice','One grain. Forty metres of tables.','za-table','<i style="--x:17%;--y:27%"></i><i style="--x:43%;--y:41%"></i><i style="--x:70%;--y:22%"></i>'),
          ('06','Culture & culinary','Hands of Rice','From a single seed to the hands that serve.','za-hands','<i></i><i></i>'),
          ('07','Innovation & data','The World Within','Look closer. A grain becomes a universe.','za-within','<i></i>'),
          ('08','Immersive installation','Rice Mirror','Look up. The grains know your face.','za-mirror','<i></i>'),
          ('09','Industry & product','Beyond the Bowl',"Rice, reimagined. A window you can't pass.",'za-window','<i></i>')]
          items=[]
          for no,kind,title,copy,art,inside in cards:
              items.append(f'''<a class="zone-card" href="desktop-experience.html" aria-label="Explore {title}"><div class="zone-card-top"><span>{no} / 09</span><span>{kind}</span></div><div class="zone-card-art {art}" aria-hidden="true">{inside}</div><h3>{title}</h3><div class="zone-card-copy"><p>{copy}</p><span class="zone-card-arrow" aria-hidden="true">↗</span></div></a>''')
          section='''<section class="zones zone-atlas light" id="zones"><div class="shell"><header class="zone-atlas-head"><span class="eyebrow">Inside the summit</span><div class="zone-atlas-title"><h2>9 Zones.<br>Endless possibilities.</h2><p>Nine immersive worlds tracing rice from field to future, designed to be walked, touched, and remembered.</p></div></header><div class="zone-atlas-grid">'''+''.join(items)+'''</div><footer class="zone-atlas-foot"><span>Trade, culture, memory, material and the future of rice.</span><a href="desktop-experience.html">Explore every zone ↗</a></footer></div></section>'''
          pat=r'<section class="zones light section" id="zones">.*?</section>\s*(?=<section class="dates section">)'
          s,n=re.subn(pat,section+'\n\n',s,flags=re.S)
          if n!=1: raise SystemExit(f'Experience section match count: {n}')
          p.write_text(s,encoding='utf-8')
          print('Rebuilt desktop homepage Experience Zones as a 3x3 visual atlas.')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          git diff --cached --quiet || git commit -m "Rebuild desktop homepage Experience Zones as visual atlas"
          git push
