name: Publish current BIRC site

on:
  push:
    paths:
      - '.github/workflows/deploy-menu-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-current
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish current main branch
        id: deployment
        uses: actions/deploy-pages@v4

# Publish Conference exactly as it was before the latest iteration.
