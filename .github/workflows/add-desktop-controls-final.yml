name: Apply homepage timing and desktop action bar

on:
  push:
    paths:
      - '.github/workflows/add-desktop-controls-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the complete homepage update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_count(text, old, new, expected, label):
              count = text.count(old)
              assert count == expected, f'{label}: expected {expected}, found {count}'
              return text.replace(old, new)

          # Authorized copy corrections on both homepage experiences.
          for name in ('index.html', 'desktop.html'):
              p = Path(name)
              h = p.read_text()
              h = h.replace('23–25', '23-24-25').replace('23&ndash;25', '23-24-25').replace('23-25', '23-24-25')
              h = h.replace('gates open 08:30', 'gates open at 10:00 AM')
              h = h.replace('Gates open at 08:30', 'Gates open at 10:00 AM')
              h = h.replace('gates open 8:30', 'gates open at 10:00 AM')
              h = h.replace('Gates open at 8:30', 'Gates open at 10:00 AM')
              h = h.replace("2026-10-23T00:00:00+05:30", "2026-10-23T10:00:00+05:30")
              p.write_text(h)

          p = Path('desktop.html')
          h = p.read_text()

          new_controls_css = '''
          .mobile-view-control{color:var(--linen);border-color:var(--dm)}
          .float-time{position:fixed;z-index:66;left:0;right:0;bottom:0;min-height:76px;padding:10px max(56px,calc((100vw - 1320px)/2));display:grid;grid-template-columns:minmax(230px,.72fr) minmax(720px,1.8fr);gap:30px;align-items:center;background:var(--ink);border-top:1px solid var(--dl);box-shadow:0 -14px 42px #0007;transform:translateY(110%);opacity:0;transition:transform .4s var(--e),opacity .3s var(--e)}
          .float-time.on{transform:none;opacity:1}
          .float-countdown{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
          .float-time small{display:block;color:var(--dm);font:600 9px Poppins;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
          .float-time strong{display:block;font:600 17px Poppins;font-variant-numeric:tabular-nums;white-space:nowrap}
          .float-actions{height:54px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--dl)}
          .float-action{min-width:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-right:1px solid var(--dl);background:var(--ink-3);color:var(--linen);font:600 10px Poppins;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:background .2s var(--e),color .2s var(--e)}
          .float-action:last-child{border-right:0}
          .float-action:hover{background:var(--grey);color:var(--gold)}
          .float-action.primary{background:var(--gold);color:var(--ink)}
          .float-action.primary:hover{background:var(--gold-deep);color:var(--ink)}
          .float-action span{font-size:15px;color:var(--gold)}
          .float-action.primary span{color:var(--ink)}
          .footer{padding-bottom:116px}
          @media(max-width:1180px){.mobile-view-control{display:none}.float-time{padding-inline:32px;grid-template-columns:220px 1fr;gap:20px}.float-action{padding-inline:12px;font-size:9px}}
          @media(prefers-reduced-motion:reduce){.float-time{transition:none}}
          '''
          h, n = re.subn(r'<style id="desktop-controls-final">.*?</style>', '<style id="desktop-controls-final">'+new_controls_css+'</style>', h, count=1, flags=re.S)
          assert n == 1, f'desktop controls style: expected 1, found {n}'

          new_markup = '''<aside class="float-time" id="floatTime" aria-label="BIRC quick actions"><div class="float-countdown"><small>Summit opens in</small><strong id="floatClock">00d 00h 00m 00s</strong></div><nav class="float-actions" aria-label="Quick actions"><a class="float-action primary" href="desktop-space-rental.html">Book your stand <span>↗</span></a><button class="float-action" type="button" data-register>Register to visit <span>↗</span></button><a class="float-action" href="https://birc.in/login">Login <span>→</span></a><a class="float-action" href="https://wa.me/">WhatsApp <span>↗</span></a></nav></aside>'''
          h, n = re.subn(r'<div class="float-shade" id="floatShade"></div><aside class="quick-dock".*?</aside><aside class="float-time".*?</aside>', new_markup, h, count=1, flags=re.S)
          assert n == 1, f'desktop floating markup: expected 1, found {n}'

          new_script = '''<script id="desktop-controls-script">(function(){var bar=document.getElementById('floatTime'),clock=document.getElementById('floatClock'),target=new Date('2026-10-23T10:00:00+05:30').getTime();function pad(n){return String(n).padStart(2,'0')}function update(){var d=Math.max(0,target-Date.now()),dd=Math.floor(d/864e5),hh=Math.floor(d/36e5)%24,mm=Math.floor(d/6e4)%60,ss=Math.floor(d/1e3)%60;clock.textContent=dd+'d '+pad(hh)+'h '+pad(mm)+'m '+pad(ss)+'s';bar.classList.toggle('on',scrollY>innerHeight*.65)}update();setInterval(update,1000);addEventListener('scroll',update,{passive:true})})();</script>'''
          h, n = re.subn(r'<script id="desktop-controls-script">.*?</script>', new_script, h, count=1, flags=re.S)
          assert n == 1, f'desktop controls script: expected 1, found {n}'

          # Keep the desktop homepage compliant: one stylesheet, no layered override blocks.
          styles = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', h, flags=re.S)
          assert len(styles) >= 1, 'desktop stylesheet not found'
          combined = '\n'.join(styles)
          h = re.sub(r'<style(?:\s[^>]*)?>.*?</style>', '', h, flags=re.S)
          h = h.replace('</head>', '<style>\n'+combined+'\n</style></head>', 1)
          assert h.count('<style>') == 1 and h.count('</style>') == 1, 'desktop must finish with exactly one stylesheet'
          assert 'quick-dock' not in h and 'float-shade' not in h, 'old plus-button dock still present'
          assert 'Gates open at 10:00 AM daily' in h, 'desktop daily gate time not corrected'
          p.write_text(h)

          # Record the permanent desktop structure and timing decision.
          p = Path('context.md')
          c = p.read_text()
          old = '- Desktop floating controls: visible `Mobile view` header control, floating countdown/Register bar, expandable four-action quick dock.'
          new = '- Desktop floating controls: visible `Mobile view` header control plus one full-width bottom bar containing the live countdown and four always-visible actions: Book your stand, Register to visit, Login, and WhatsApp. The separate Register button and expandable `+` dock were removed. Mobile controls remain unchanged.'
          c = replace_count(c, old, new, 1, 'homepage floating-controls context')
          anchor = '- Header holds logo and menu only. No Register button in the mobile fixed header.'
          addition = anchor + '\n- Public opening time is 10:00 AM daily. Homepage countdowns target 10:00 AM on 23 October 2026.'
          c = replace_count(c, anchor, addition, 1, 'homepage opening-time context')
          p.write_text(c)
          PY
      - name: Commit the batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html desktop.html context.md
          git commit -m "Update homepage dates, opening time and desktop action bar"
          git push
