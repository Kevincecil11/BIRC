<!doctype html><html><head><meta charset="utf-8"><script>if(!matchMedia('(min-width:900px)').matches)location.replace('conference.html')</script><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="assets/knowledge-sessions.css"><link rel="stylesheet" href="assets/desktop-typography.css"></head><body><script>KS={num:'08',day:'Day 2',track:'Rice Milling',title:'Profitable Rice Milling: Costs, Planning and Margin Improvement',tag:'A mill does not become profitable when it starts running. It becomes profitable when every loss is measured.',image:'https://birc.in/images/knowledge-sessions/s08-milling.webp',intro:['Rice milling profitability depends on more than installed capacity. Paddy quality, process design, recovery, downtime, energy, labour, finance, product mix, quality claims and by-product value all influence the margin.','This session will examine how to plan a new mill or improve an existing one by connecting technical performance with commercial control.'],why:'A higher-throughput plant can still destroy value if procurement, recovery, quality and working capital are weak. Conversely, disciplined measurement can reveal improvements that do not require a complete rebuild. The session is intended to help owners and operators see the mill as one connected operating and financial system.',scope:['Project planning: Market, product mix, paddy availability, site, utilities, logistics, capacity, seasonality and expansion strategy.','Capital and funding: Machinery, civil works, electrical systems, storage, laboratory, installation, commissioning, contingency and working capital.','Process design: Cleaning, destoning, drying, parboiling where relevant, husking, separation, whitening, polishing, grading, sorting and packing.','Yield and recovery: Measuring head rice, broken rice, bran, husk, rejects, rework and invisible process losses.','Quality control: Incoming paddy, moisture, process settings, lot segregation, traceability, testing and release decisions.','Operating efficiency: Energy, water, labour, automation, maintenance planning, spares, downtime and bottleneck management.','By-product value: Bran, husk, broken rice and other streams as products, fuel, ingredients or inputs rather than waste.','Margin dashboard: Procurement cost, conversion cost, yield value, product realisation, finance cost, inventory days and break-even utilisation.'],take:['A feasibility checklist for new capacity or expansion decisions.','A clearer way to connect recovery and downtime with rupee margin.','A process map for identifying loss, rework and quality risk.','A practical set of mill-performance indicators.','Improvement priorities covering procurement, process, maintenance, energy and by-products.'],attends:['Rice mill owners, directors and plant heads','Entrepreneurs and investors evaluating a milling project','Production, maintenance, quality and procurement teams','Machinery, automation and utility providers','Banks, consultants and project-finance professionals'],panel:['Rice-milling process engineer','Successful mill owner or plant operator','Machinery, automation or energy-efficiency specialist','Finance or feasibility expert'],faq:[['Will the session provide a standard cost for setting up a rice mill?','No single cost fits every project. Speakers should explain the cost structure and the variables that change capital, operating and working-capital requirements.'],['Is the session relevant to existing mills?','Yes. Recovery, downtime, energy, maintenance, quality, product mix and by-product improvements can be evaluated in operating plants.'],['Will specific machinery brands be recommended?','The editorial focus remains on process requirements, performance criteria and decision factors rather than unverified brand endorsement.']],close:['Turn throughput into measurable margin.','Join the BIRC 2026 Knowledge Session and examine the operating decisions behind a stronger rice-milling business.']}</script><script src="assets/knowledge-render.js"></script></body></html>
