name: Finalize Plan Visit hover
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-visit-hover.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove initial active panel and install final CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop.html')
          s=p.read_text()
          s=s.replace('class="visit-item open"','class="visit-item"')
          marker='<style id="visit-hover-final">'
          block='''<style id="visit-hover-final">
          /* Final Plan Visit state: ivory at rest, black only while hovered/focused. */
          .visitgrid .visit-item,.visitgrid .visit-item.open{background:#faf0e6!important;color:#0d0d0b!important}
          .visitgrid .visit-item:before,.visitgrid .visit-item.open:before{transform:translateY(101%)!important}
          .visitgrid .visit-item:hover:before,.visitgrid .visit-item:focus-visible:before{transform:translateY(0)!important}
          .visitgrid .visit-item:hover,.visitgrid .visit-item:focus-visible{color:#faf0e6!important;outline:none!important}
          .visitgrid .visit-item:hover .label,.visitgrid .visit-item:focus-visible .label{color:#ebb341!important}
          .visitgrid .visit-item:hover .act,.visitgrid .visit-item:focus-visible .act{color:#faf0e6!important}
          .visitgrid .visit-item:hover .act i,.visitgrid .visit-item:focus-visible .act i{color:#ebb341!important}
          </style>'''
          if marker not in s:s=s.replace('</head>',block+'</head>')
          p.write_text(s)
          Path('publish-refresh.html').write_text('<!doctype html><meta charset="utf-8"><title>BIRC publish marker</title><!-- final Plan Visit hover-only state 2026-08-17 13:54 IST -->')
          PY
          rm .github/workflows/finalize-visit-hover.yml
      - name: Commit final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html publish-refresh.html .github/workflows/finalize-visit-hover.yml
          git commit -m "Remove persistent Plan Visit active state"
          git push origin main
