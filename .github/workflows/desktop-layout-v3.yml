name: Fix desktop homepage composition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-layout-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply balanced desktop layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop.html')
          html=p.read_text()
          css=r'''<style id="desktop-home-v3">
          :root{--content:min(1280px,calc(100vw - 96px));--edge:max(48px,calc((100vw - 1280px)/2));--section-y:clamp(96px,8vw,144px)}
          body{min-width:1024px}.page{width:100%;overflow:hidden}.bar{height:82px;padding-inline:var(--edge);grid-template-columns:170px 1fr auto;background:var(--j);border-bottom:1px solid var(--dl)}.bar .logo{width:150px}.desktop-nav{gap:clamp(12px,1.15vw,22px)}.desktop-nav a{padding-block:29px 26px}.desktop-tools>a{min-height:40px}.desktop-view-toggle{display:none!important}
          .hero,.statement,#pathways,.knowledge,.difference,.zones,.date-sec,.programme,#voices,.why,.visit,.final,.footer{padding-left:var(--edge)!important;padding-right:var(--edge)!important}
          .hero{height:auto;min-height:900px;max-height:none;padding-top:150px!important;padding-bottom:48px!important;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto 1fr auto auto;gap:22px 24px}.hero .slot{grid-column:10/13;grid-row:1;text-align:right}.hero-main{grid-column:1/9;grid-row:2;align-self:end;margin:0}.hero h1{font-size:clamp(72px,6.6vw,104px);line-height:.9;max-width:9ch}.hero .lead{font-size:17px;line-height:1.65;max-width:50ch;margin-top:28px}.hero .actions{grid-column:1/5;grid-row:3;grid-template-columns:1.15fr 1fr;align-self:stretch}.hero .facts{grid-column:5/13;grid-row:3;min-height:58px}.hero .scroll{grid-column:1/13;grid-row:4;margin-top:14px}
          .statement{min-height:0;padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important;display:grid;grid-template-columns:3fr 9fr;gap:56px;align-items:start}.statement .eye{padding-top:12px}.statement p{font-size:clamp(46px,4.35vw,68px);line-height:1.08;max-width:18ch}.statement footer{grid-column:2;font-size:9px;margin-top:28px}
          #pathways{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}#pathways>.head{display:grid;grid-template-columns:3fr 9fr;gap:56px;align-items:start}#pathways>.head .title{font-size:clamp(52px,4.5vw,72px);max-width:11ch}.path-list{gap:14px}.path{height:520px;padding:30px}.path h3{font-size:52px}.path p{font-size:14px}
          .light[style*="padding-top"]{padding:var(--section-y) var(--edge)!important;grid-template-columns:4fr 8fr;gap:64px}.light[style*="padding-top"]>.head .title{font-size:clamp(52px,4.2vw,68px);line-height:.95;max-width:8ch}.light[style*="padding-top"]>.fig{min-height:112px;padding:18px 0;align-items:center}.light[style*="padding-top"]>.fig b{font-size:clamp(56px,5vw,78px);line-height:.9}.light[style*="padding-top"]>.fig small{padding:0;font-size:9px;align-self:center}.light[style*="padding-top"]>.note{padding-top:18px}
          .knowledge{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.knowledge>.head{display:grid;grid-template-columns:4fr 8fr;gap:64px;align-items:start;margin-bottom:44px}.knowledge>.head .eye{grid-column:1;padding-top:10px}.knowledge>.head .title{grid-column:2;font-size:clamp(54px,4.6vw,74px);line-height:.96;max-width:9ch}.knowledge-meta{margin:0 0 40px calc(33.333% + 43px)}.knowledge>.session-day{grid-template-columns:4fr 8fr;gap:64px}.session-day+.session-day{margin-top:56px}.session-day-head{padding-top:22px}.session-list{grid-template-columns:repeat(2,minmax(0,1fr))}.session{min-height:158px;padding:24px 18px}.session h3{font-size:17px}.session p{font-size:13px}
          .difference{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important;grid-template-columns:4fr 8fr;gap:64px}.difference>.head .title{font-size:clamp(44px,3.5vw,60px);line-height:1;max-width:11ch}.ey-report{margin-top:48px}.difference-btn{min-height:100px}.difference-btn strong{font-size:16px;line-height:1.35}.difference-detail p{font-size:14px}
          .zones{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.zones>.head{grid-template-columns:7fr 5fr;gap:64px;margin-bottom:48px}.zones>.head .title{font-size:clamp(56px,4.8vw,76px)}.zones>.head .lead{align-self:end}.zone-vis{height:600px}.zone-copy h3{font-size:clamp(48px,4.3vw,68px)}.tour-ui{padding-top:20px}
          .date-sec{min-height:0;padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important;grid-template-columns:4fr 8fr;gap:64px}.date-sec>p{font-size:clamp(42px,3.6vw,58px);line-height:1.08;max-width:10ch}.date-lock{padding:50px 0}.date-lock h3{font-size:clamp(74px,6.5vw,102px)}.date-row{margin-top:30px;gap:18px}.date-row span{font-size:clamp(68px,5.8vw,92px)}
          .programme{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.programme>.head{grid-template-columns:4fr 8fr;gap:64px;margin-bottom:50px}.programme>.head .title{grid-column:2;font-size:clamp(54px,4.5vw,72px)}.program{grid-template-columns:repeat(3,minmax(0,1fr))}.day{min-height:390px;padding:28px}.day-num{font-size:100px;top:84px}.day h3{margin-top:205px;font-size:28px}.day p{font-size:13px}
          #voices{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important;grid-template-columns:4fr 8fr;gap:64px}#voices>.head .title{font-size:clamp(52px,4vw,68px)}.quote blockquote{font-size:clamp(40px,3.5vw,58px);line-height:1.08;max-width:15ch}.quote-mark{font-size:88px}
          .why{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.why>.head{display:grid;grid-template-columns:4fr 8fr;gap:64px;margin-bottom:24px}.why>.head .eye{padding-top:10px}.why>.head .title{font-size:clamp(54px,4.5vw,72px);line-height:.96;max-width:9ch}.why-intro{padding:0 0 48px 33.333%;margin-left:22px}.reasons{grid-template-columns:repeat(4,minmax(0,1fr))}.reason{min-height:420px;padding:24px}.reason-word{top:72px;font-size:clamp(52px,4.7vw,74px);white-space:nowrap}.reason h3{font-size:21px}.reason p{font-size:13px}.why-close{padding-top:50px;font-size:34px}
          .dark.pad[style*="padding-left:0"]{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.gallery-img{width:400px!important;height:280px!important}.gallery-img:nth-child(even){width:500px!important}
          .visit{padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.visit>.head{display:grid;grid-template-columns:4fr 8fr;gap:64px}.visit>.head .title{font-size:clamp(54px,4.5vw,72px)}.visit-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.visit-item{min-height:300px;padding:24px}.visit-item h3{font-size:21px}
          .final{min-height:720px;padding-top:var(--section-y)!important;padding-bottom:var(--section-y)!important}.final h2{font-size:clamp(82px,7vw,112px)}.clock{max-width:680px;margin-top:52px}.clock strong{font-size:38px}.footer{padding-top:80px!important;padding-bottom:56px!important}
          @media(max-width:1180px){:root{--edge:36px}.desktop-nav{gap:10px}.desktop-nav a{font-size:9px}.bar{grid-template-columns:150px 1fr auto}.desktop-tools>a{padding-inline:11px}.hero h1{font-size:72px}.statement p{font-size:48px}.path{height:460px}.path h3{font-size:44px}.reason{min-height:380px}.reason h3{font-size:19px}}
          </style>'''
          if 'id="desktop-home-v3"' not in html:
              html=html.replace('</head>',css+'</head>',1)
          p.write_text(html)
          PY
      - name: Commit desktop fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix desktop section proportions and alignment"
          git push
