name: Restore full Creators build
on:
  push:
    paths:
      - '.github/workflows/bootstrap-creators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete prepared workflow
        run: |
          git show 9c5d6530b4a35c4cd8803150d7842682788f868d:.github/workflows/add-influencers-creators.yml > .github/workflows/add-influencers-creators.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/add-influencers-creators.yml
          git commit -m 'Restore complete Content Creators build workflow'
          git push
