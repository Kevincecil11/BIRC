name: Build Rice Masterchef
on:
  push:
    paths: ['.github/workflows/build-rice-masterchef.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Masterchef placeholder with approved content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('creators.html');s=p.read_text()
          css='''/* Rice Masterchef */.masterchef{background:var(--l);color:var(--j)}.master-hero{min-height:82svh;padding:104px var(--p) 64px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.master-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 18%,#ebb34155,transparent 27%),repeating-linear-gradient(116deg,transparent 0 31px,#0d0d0b09 31px 32px)}.master-hero>*{position:relative}.master-hero .eye{color:var(--g2);margin-bottom:22px}.master-hero .lead{color:var(--lm);font-size:17px;margin-top:24px}.master-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:38px}.master-stat{padding:15px 9px;background:#17354c;color:var(--l)}.master-stat strong{display:block;color:var(--g);font:600 22px Poppins}.master-stat small{font:600 8px Poppins;text-transform:uppercase}.moment{padding:96px var(--p)}.moment .eye{color:var(--g2)}.moment-list{margin-top:42px;border-top:1px solid var(--ll)}.moment-row{padding:25px 0;border-bottom:1px solid var(--ll)}.moment-row span{color:var(--g2);font:600 9px Poppins}.moment-row h3{font:600 20px Poppins;letter-spacing:-.04em;margin:9px 0}.moment-row p{color:var(--lm);font-size:14px;margin:0}.winner{padding:96px var(--p);background:#17354c;color:var(--l)}.winner .eye{color:var(--g)}.winner h2{margin:22px 0;font:600 clamp(37px,11vw,54px)/.96 Poppins;letter-spacing:-.06em}.winner>p{color:var(--dm);margin:0}.prize{margin:40px 0;padding:28px 0 28px 24px;border-left:3px solid var(--g)}.prize small{color:var(--g);font:600 9px Poppins;text-transform:uppercase}.prize strong{display:block;color:var(--g);font:600 clamp(48px,15vw,72px)/.9 Poppins;margin:10px 0}.prize span{font:600 10px Poppins;text-transform:uppercase}.winner-list{border-top:1px solid #ffffff24}.winner-row{padding:23px 0;border-bottom:1px solid #ffffff24}.winner-row span{color:var(--g);font:600 9px Poppins}.winner-row h3{font:600 19px Poppins;margin:9px 0}.winner-row p{color:var(--dm);font-size:14px;margin:0}.master-score{padding:96px var(--p)}.master-score .eye{color:var(--g2)}.master-score>p{color:var(--lm)}.master-passes{display:grid;gap:14px;margin-top:38px}.master-pass{padding:25px;border:1px solid var(--ll)}.master-pass.vip{background:#17354c;color:var(--l);border-color:#17354c}.master-pass small{color:var(--g);font:600 9px Poppins;text-transform:uppercase}.master-pass h3{font:600 24px Poppins;margin:16px 0 5px}.master-pass strong{color:var(--g);font:600 10px Poppins;text-transform:uppercase}.master-pass p{color:var(--lm);font-size:14px}.master-pass.vip p{color:var(--dm)}.master-apply{padding:96px var(--p);background:var(--g);color:var(--j)}.master-form{margin-top:34px;padding:24px;background:var(--l);display:grid;gap:20px}.master-form .field label{color:var(--j)}.master-form .submit{background:var(--j);color:var(--l)}'''
          if '/* Rice Masterchef */' not in s:s=s.replace('</style></head>',css+'</style></head>',1)
          html='''<section class="masterchef" id="rice-masterchef"><section class="master-hero"><span class="eye">Rice Masterchef · BIRC 2026</span><h2 class="title">Your Rice Dish. The World's Biggest Rice Stage.</h2><p class="lead">Bring your signature rice dish and compete at BIRC 2026. Standout creator profiles receive VIP access for all three days; other approved creators receive Day 3 access.</p><a class="btn" href="#masterchef-apply">Enter the Competition →</a><div class="master-stats"><div class="master-stat"><strong>30,000+</strong><small>Expected participants</small></div><div class="master-stat"><strong>120+</strong><small>Countries</small></div><div class="master-stat"><strong>3,000+</strong><small>Buyers</small></div></div></section><section class="moment"><span class="eye">Your skill. A global audience.</span><h2 class="section-title">Turn One Rice Dish Into Your Moment.</h2><div class="moment-list"><article class="moment-row"><span>01</span><h3>Cook Live</h3><p>Present your signature rice creation in a high-energy culinary competition environment.</p></article><article class="moment-row"><span>02</span><h3>Show Your Craft</h3><p>Demonstrate flavour, technique, originality and presentation to an industry audience.</p></article><article class="moment-row"><span>03</span><h3>Earn VIP Access</h3><p>The strongest creator profiles receive all-three-day VIP access; other approved entrants receive Day 3 access.</p></article></div></section><section class="winner"><span class="eye">What the winner takes home</span><h2>Cook the Winning Plate. Leave With More Than the Title.</h2><p>One rice dish, judged live at Bharat Mandapam. The BIRC Rice MasterChef winner walks away with a cash prize, a recorded media moment and a felicitation in front of the industry.</p><div class="prize"><small>Winning prize</small><strong>₹1,00,000</strong><span>One lakh rupees</span></div><div class="winner-list"><article class="winner-row"><span>01</span><h3>₹1 Lakh Cash Prize</h3><p>A winning prize of ₹1,00,000 awarded to the Rice MasterChef champion at BIRC 2026.</p></article><article class="winner-row"><span>02</span><h3>Media Byte</h3><p>A dedicated media interaction — your dish, your technique and your story recorded for press coverage and BIRC channels.</p></article><article class="winner-row"><span>03</span><h3>On-Stage Recognition</h3><p>Called to the BIRC main stage and felicitated before an international audience connected to 120+ countries.</p></article></div></section><section class="master-score"><span class="eye">One application · two access outcomes</span><h2 class="section-title">Your Creator Score Determines Your Pass.</h2><p>Every approved profile is reviewed on the same five parameters. No single metric decides the result.</p><div class="master-passes"><article class="master-pass vip"><small>Highest-scoring profiles · VIP</small><h3>VIP Creator Pass</h3><strong>All 3 days · 23-24-25 October</strong><p>Full three-day access to the BIRC conference, exhibition and Rice Festival experience.</p></article><article class="master-pass"><small>Other approved creators · Day 3</small><h3>Day 3 Creator Pass</h3><strong>Day 3 only · 25 October</strong><p>Access for the competition day and Day 3 Rice Festival experience.</p></article></div></section><section class="master-apply" id="masterchef-apply"><span class="eye">Rice Masterchef application</span><h2 class="section-title" style="margin-top:20px">Enter in Under 60 Seconds.</h2><form class="master-form" id="masterForm"><div class="field"><label for="chef-name">Your Name *</label><input id="chef-name" name="name" required placeholder="Full name"></div><div class="field"><label for="chef-phone">WhatsApp Number *</label><input id="chef-phone" name="phone" type="tel" required placeholder="+91"></div><div class="field"><label for="chef-email">Email</label><input id="chef-email" name="email" type="email" placeholder="you@example.com"></div><div class="field"><label for="dish-name">Signature Rice Dish *</label><input id="dish-name" name="dish" required placeholder="Dish name"></div><button class="submit" type="submit">Enter the Competition →</button><div class="status" id="masterStatus" role="status"></div></form></section></section>'''
          s,n=re.subn(r'<section class="coming" id="rice-masterchef">[\s\S]*?</section>(?=<section class="coming" id="artists">)',html,s,count=1)
          if n!=1:raise SystemExit('Rice Masterchef placeholder not found')
          js="""masterForm.onsubmit=e=>{e.preventDefault();const d=new FormData(masterForm),subject=encodeURIComponent('BIRC 2026 Rice Masterchef Application'),body=encodeURIComponent(`Name: ${d.get('name')}\nWhatsApp: ${d.get('phone')}\nEmail: ${d.get('email')}\nSignature dish: ${d.get('dish')}`);masterStatus.textContent='Opening your email app…';location.href=`mailto:booking@birc.in?subject=${subject}&body=${body}`};"""
          s=s.replace('</script></body></html>',js+'</script></body></html>',1)
          p.write_text(s)
          PY
      - name: Update context and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          s=s.replace('Rice Masterchef must be built only after screenshots are supplied.','Rice Masterchef is implemented from six approved mobile screenshots, including competition proposition, three participation benefits, ₹1,00,000 prize, Media Byte, On-Stage Recognition, creator access tiers, and application form.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creators.html context.md
          git commit -m 'Build Rice Masterchef section from approved screenshots'
          git push
