name: Desktop shots

on:
  push:
    paths:
      - '.github/workflows/desktop-shots.yml'
      - 'tools/shots.py'
      - 'tools/contact_note.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/contact_note.py
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Serve and shoot
        run: |
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 3
          python tools/shots.py
          cat _shots/log.txt
      - name: Commit
        run: |
          git config user.name "birc-bot"
          git config user.email "bot@birc.local"
          git add -A _shots contact.html desktop-contact.html _inspect
          git commit -m "Desktop audit shots" || echo "no changes"
          git push
