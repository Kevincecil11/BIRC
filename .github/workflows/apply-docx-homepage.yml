name: Apply DOCX Homepage Changes
on:
  push:
    paths:
      - '.github/workflows/apply-docx-homepage.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach shared change layer to desktop and mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('desktop.html','index.html'):
              p=Path(name); s=p.read_text()
              tag='<script src="assets/docx-homepage-changes-2323.js"></script>'
              if tag not in s: s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          Path('.github/workflows/apply-docx-homepage.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop.html index.html .github/workflows/apply-docx-homepage.yml
          git commit -m 'Apply all DOCX homepage changes to desktop and mobile'
          git push
