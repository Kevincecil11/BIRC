name: Refine mobile homepage dock and gallery

on:
  push:
    paths:
      - '.github/workflows/refine-mobile-home.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/refine_mobile_dock_gallery.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html context.md
          git commit -m "Fix mobile dock overlap and expand BIRC gallery"
          git push
