name: Build six remaining desktop pages
on:
  push:
    paths: ['.github/workflows/build-six-remaining-desktop-pages.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build six desktop experiences
        run: |
          cat > /tmp/build.py <<'PY'
          from pathlib import Path
          import re

          pages={
            'creators.html':('desktop-creators.html','Content Creators','creators.html'),
            'rice-masterchef.html':('desktop-rice-masterchef.html','Rice Masterchef','rice-masterchef.html'),
            'artists.html':('desktop-artists.html','Artists','artists.html'),
            'partnership.html':('desktop-partnership.html','Partnership','partnership.html'),
            'plan-visit.html':('desktop-plan-visit.html','Plan Visit','plan-visit.html'),
            'contact.html':('desktop-contact.html','Contact','contact.html')
          }
          nav='''<header class="desktop-mast" id="desktopMast"><div class="desktop-shell"><a href="desktop.html"><img src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"></a><nav><a href="desktop.html">Home</a><a href="desktop-about.html">About</a><a href="desktop-conference.html">Conference</a><div class="desktop-ex"><button type="button">Exhibition ▾</button><div><a href="desktop-exhibition.html">Why exhibit <span>01</span></a><a href="desktop-exhibitor-profile.html">Exhibitor profile <span>02</span></a><a href="desktop-space-rental.html">Space rental <span>03</span></a></div></div><a href="desktop-experience.html">Experience</a><div class="desktop-inf"><button type="button">Influencers ▾</button><div><a href="desktop-creators.html">Content Creators <span>01</span></a><a href="desktop-rice-masterchef.html">Rice Masterchef <span>02</span></a><a href="desktop-artists.html">Artists <span>03</span></a></div></div><a href="desktop-partnership.html">Partnership</a><a href="desktop-plan-visit.html">Plan Visit</a><a href="desktop-contact.html">Contact</a></nav><div class="desktop-tools"><a class="mobile-switch" href="{mobile}">Mobile view</a><a class="desktop-register" href="register.html?type=visitor">Register ↗</a></div></div></header>'''
          footer='''<footer class="desktop-footer"><div class="desktop-shell"><div><h4>BIRC 2026</h4><p>India at the centre. Every rice market in the room.</p></div><div><small>Explore</small><a href="desktop.html">Home</a><a href="desktop-about.html">About</a><a href="desktop-conference.html">Conference</a></div><div><small>Participate</small><a href="desktop-exhibition.html">Exhibition</a><a href="desktop-partnership.html">Partnership</a><a href="desktop-creators.html">Influencers</a></div><div><small>Visit</small><a href="desktop-plan-visit.html">Plan Visit</a><a href="desktop-contact.html">Contact</a></div></div></footer>'''
          base_css='''<style id="desktop-page-system">
          :root{--desk-shell:min(1320px,calc(100% - 112px));--desk-side:max(56px,calc((100vw - 1320px)/2));--desk-nav:76px)}
          html{scroll-padding-top:76px}body{min-width:1100px!important;padding:0!important;background:var(--j,#0d0d0b)!important}.bar,.drawer,.site-footer,.page.footer,footer.page{display:none!important}.page,.dv-card{width:100%!important;max-width:none!important;margin:0!important;padding-top:76px!important;border:0!important;box-shadow:none!important;overflow:hidden!important}.desktop-shell{width:var(--desk-shell);margin:auto}.desktop-mast{position:fixed;z-index:1000;inset:0 0 auto;height:76px;background:#0d0d0bf0;border-bottom:1px solid #35332e;color:#faf0e6}.desktop-mast .desktop-shell{height:100%;display:grid;grid-template-columns:145px 1fr auto;align-items:center;gap:30px}.desktop-mast img{width:132px;height:42px;object-fit:contain}.desktop-mast nav{display:flex;justify-content:center;align-items:center;gap:20px}.desktop-mast nav>a,.desktop-mast nav button{border:0;background:none;color:#aba49c;font:500 12px Poppins,sans-serif;white-space:nowrap}.desktop-mast nav>a:hover,.desktop-mast nav button:hover{color:#faf0e6}.desktop-ex,.desktop-inf{position:relative;height:76px;display:flex;align-items:center}.desktop-ex>button,.desktop-inf>button{height:76px}.desktop-ex>div,.desktop-inf>div{position:absolute;left:-16px;top:66px;width:250px;padding:9px;background:#191916;border:1px solid #35332e;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.25s cubic-bezier(.16,1,.3,1)}.desktop-ex:hover>div,.desktop-inf:hover>div{opacity:1;visibility:visible;transform:none}.desktop-ex div a,.desktop-inf div a{display:grid;grid-template-columns:1fr auto;padding:12px;border-bottom:1px solid #35332e;color:#aba49c;font:500 13px Poppins}.desktop-ex div span,.desktop-inf div span{color:#ebb341;font-size:9px}.desktop-tools{display:flex;gap:8px}.desktop-tools a{height:42px;padding:0 14px;display:grid;place-items:center;border:1px solid #35332e;color:#faf0e6;font:600 9px Poppins;text-transform:uppercase;letter-spacing:.1em}.desktop-tools .desktop-register{background:#ebb341;color:#0d0d0b;border-color:#ebb341}.desktop-footer{padding:78px 0 44px;background:#0d0d0b;color:#faf0e6;border-top:1px solid #35332e}.desktop-footer .desktop-shell{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:56px}.desktop-footer h4{font:600 26px Poppins;margin:0}.desktop-footer p{color:#aba49c;max-width:34ch}.desktop-footer small{display:block;margin-bottom:12px;color:#6d6862;font:600 9px Poppins;text-transform:uppercase;letter-spacing:.15em}.desktop-footer a{display:block;padding:5px 0;color:#aba49c;font-size:14px}
          main.page>section,.dv-card>div{padding-left:var(--desk-side)!important;padding-right:var(--desk-side)!important}.hero,.master-hero{min-height:86vh!important;padding-top:160px!important;padding-bottom:80px!important}.hero .title,.master-hero .title{font-size:clamp(62px,5.2vw,92px)!important;max-width:12ch}.section-title{font-size:clamp(42px,3.5vw,62px)!important}.stats,.master-stats{max-width:720px;grid-template-columns:repeat(3,1fr)!important}.access-list,.moment-list,.criteria-list,.content-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 42px}.access-row,.moment-row,.criterion,.content-row{min-height:150px}.passes,.master-passes,.steps{grid-template-columns:repeat(3,1fr)!important}.passes,.master-passes{display:grid!important}.form,.master-form{max-width:820px;margin-left:auto!important;margin-right:auto!important;padding:42px!important}.faq-items{max-width:980px;margin:auto}.footer{display:none!important}
          @media(max-width:1180px){:root{--desk-shell:calc(100% - 64px);--desk-side:32px}.desktop-mast nav{gap:11px}.desktop-mast nav>a,.desktop-mast nav button{font-size:10px}}
          </style>'''
          special={
          'creators.html':'''<style>.access,.score,.process,.faq-section{padding:130px var(--desk-side)!important}.criteria,.apply{padding:130px var(--desk-side)!important}.score-bullets{display:grid;grid-template-columns:repeat(5,1fr)}.score-bullets li{min-height:130px}.passes{grid-template-columns:1fr 1fr!important}.steps{grid-template-columns:repeat(3,1fr)!important}.step{min-height:220px}</style>''',
          'rice-masterchef.html':'''<style>.moment,.winner,.master-score,.eligibility,.chef-process,.master-apply,.faq-section{padding:130px var(--desk-side)!important}.moment-list,.content-list{grid-template-columns:repeat(2,1fr)}.winner{display:grid;grid-template-columns:1fr 1fr;gap:60px}.winner .winner-list{grid-column:2;grid-row:1/5}.master-passes{grid-template-columns:1fr 1fr!important}</style>''',
          'artists.html':'''<style>.manifesto,.materials,.language,.audience,.prize,.recognition,.why-art,.momentum,.journey,.apply,.artist-faq{padding:130px var(--desk-side)!important}.material-list{grid-template-columns:repeat(6,1fr)}.art-grid{grid-template-columns:repeat(4,1fr)!important;grid-auto-rows:280px!important}.art-tile,.art-tile.wide{height:280px!important}.pathways{grid-template-columns:repeat(4,1fr)}.recognition-list,.content-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 44px}.source-visual{max-width:900px;margin-inline:auto}</style>''',
          'partnership.html':'''<style>.dv-card>div:nth-child(1){padding-top:150px!important;padding-bottom:80px!important}.dv-card>div:nth-child(1) .wf-h{font-size:80px!important}.dv-card>div:nth-child(2){height:520px!important;aspect-ratio:auto!important}.dv-card>div:nth-child(3),.dv-card>div:nth-child(4){padding-top:120px!important;padding-bottom:130px!important}.dv-card [style*="display:flex;flex-direction:column;gap:12px"],.dv-card [style*="display:flex;flex-direction:column;gap:10px"]{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:16px!important}.wf-tier-card,.wf-opp-card{min-width:0!important}.wf-tier-card summary,.wf-opp-card summary{min-height:190px!important}.wf-acc-body{max-height:460px;overflow:auto}.dv-card>div:nth-last-child(1){padding:46px!important}</style>''',
          'plan-visit.html':'''<style>.venue,.hotels,.travel,.faq-section{padding:130px var(--desk-side)!important}.venue-grid{display:grid;grid-template-columns:repeat(4,1fr)}.venue-row{display:block!important;padding:28px!important;border-right:1px solid var(--ll)}.map{height:440px}.hotel-list{display:grid;grid-template-columns:1fr 1fr;gap:20px}.travel{display:grid;grid-template-columns:300px 1fr;gap:60px}.travel .head,.travel-address,.travel-tabs{grid-column:1}.travel-panel{grid-column:2;grid-row:1/8}.travel-tabs{display:grid!important}.faq-section .faq{max-width:980px}</style>''',
          'contact.html':'''<style>.intro,.official-contact,.form-section{padding:130px var(--desk-side)!important}.routes{grid-template-columns:repeat(4,1fr)}.contact-stack{grid-template-columns:repeat(2,1fr)}.contact-row{min-height:250px;padding:32px}.form-section{display:grid;grid-template-columns:360px 1fr;gap:70px}.form-section .head{align-self:start}.form-section .form{margin:0!important;max-width:none!important;padding:0!important}</style>'''
          }
          for src,(dest,title,mobile) in pages.items():
              h=Path(src).read_text()
              h=h.replace('<meta name="viewport"',"<script>if(!matchMedia('(min-width:900px)').matches)location.replace('"+mobile+"')</script><meta name=\"viewport\"")
              h=h.replace('</head>',base_css+special[src]+'</head>',1)
              h=re.sub(r'<body[^>]*>',lambda m:m.group(0)+nav.format(mobile=mobile),h,count=1)
              h=h.replace('</body>',footer+'</body>',1)
              h=h.replace('<title>','<title>'+title+' Desktop | ',1)
              Path(dest).write_text(h)
          PY
          python3 /tmp/build.py
      - name: Link new desktop pages everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['desktop.html','desktop-about.html','desktop-conference.html','desktop-exhibition.html','desktop-exhibitor-profile.html','desktop-space-rental.html','desktop-experience.html','desktop-creators.html','desktop-rice-masterchef.html','desktop-artists.html','desktop-partnership.html','desktop-plan-visit.html','desktop-contact.html']
          reps={'href="creators.html"':'href="desktop-creators.html"','href="rice-masterchef.html"':'href="desktop-rice-masterchef.html"','href="artists.html"':'href="desktop-artists.html"','href="partnership.html"':'href="desktop-partnership.html"','href="plan-visit.html"':'href="desktop-plan-visit.html"','href="contact.html"':'href="desktop-contact.html"'}
          for f in files:
              p=Path(f);h=p.read_text()
              for a,b in reps.items():h=h.replace(a,b)
              p.write_text(h)
          p=Path('context.md');c=p.read_text();note='''\n## Remaining desktop pages\n\n- Desktop pages now exist for Content Creators, Rice Masterchef, Artists, Partnership, Plan Visit, and Contact.\n- All desktop navigation links route to desktop-specific pages.\n- Mobile source pages remain unchanged.\n''';
          if '## Remaining desktop pages' not in c:p.write_text(c.rstrip()+note)
          PY
      - name: Commit six desktop pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop*.html context.md
          git commit -m "Build six remaining desktop pages and connect navigation"
          git push
