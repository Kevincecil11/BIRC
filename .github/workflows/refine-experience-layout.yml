name: Refine Experience layout

on:
  push:
    paths:
      - '.github/workflows/refine-experience-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cohesive BIRC Experience styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experience.html');s=p.read_text()
          css='''/* Final Experience treatment: previous immersive visuals, BIRC page rhythm */.page{background:var(--l)!important}.hero{min-height:88svh!important;background:var(--j)!important;color:var(--l)!important;padding:120px var(--p) 64px!important}.hero:before{background:radial-gradient(circle at 82% 18%,#ebb3412b,transparent 28%),repeating-linear-gradient(116deg,transparent 0 31px,#faf0e609 31px 32px)!important}.hero .eye{color:var(--g)!important}.hero .lead,.hero-foot{color:var(--dm)!important}.hero-foot{border-color:var(--dl)!important}.zone{min-height:0!important;padding:96px var(--p)!important;background:var(--l)!important;color:var(--j)!important;border-bottom:1px solid var(--ll)!important;display:flex!important;flex-direction:column!important;gap:0!important}.zone:nth-of-type(even),.zone:nth-of-type(3n){background:var(--l)!important;color:var(--j)!important}.zone-kicker{order:0;color:var(--g2)!important;margin-bottom:18px;font:600 9px/1.3 Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase}.visual{order:1;width:calc(100% + 22px);height:390px!important;margin:0 0 36px!important;background:var(--j)!important;border:0!important;transform:none!important}.zone:nth-of-type(even) .visual,.zone:nth-of-type(3n) .visual{background:var(--j)!important;border:0!important;transform:none!important}.zone:nth-of-type(odd) .visual{margin-left:0!important}.zone:nth-of-type(even) .visual{align-self:flex-end;margin-right:0!important}.zone-copy{order:2;margin:0!important;text-align:left!important}.zone:nth-of-type(even) .zone-copy{text-align:left!important}.zone h2{color:var(--j)!important;font-size:clamp(38px,11vw,54px)!important;max-width:12ch!important;margin:0 0 14px!important}.zone:nth-of-type(even) .zone-copy h2,.zone:nth-of-type(even) .zone-copy p{margin-left:0!important}.zone p,.zone:nth-of-type(odd) p,.zone:nth-of-type(even) p,.zone:nth-of-type(3n) p{color:var(--lm)!important;font-size:15px!important;margin:0!important;max-width:35ch!important}.zone:nth-of-type(3n) .zone-kicker{color:var(--g2)!important}.zone:nth-of-type(3n) .visual{background:var(--j)!important}.cta{background:var(--j)!important;color:var(--l)!important;padding:104px var(--p)!important}.cta .eye{color:var(--g)!important}.cta h2{color:var(--l)!important}.footer{background:var(--j)!important;color:var(--l)!important}.visual:after{content:"";position:absolute;inset:14px;border:1px solid var(--dl);pointer-events:none}.route .trail,.time i,.table i,.within i,.window i{z-index:2}@media(max-width:360px){.visual{width:100%!important}}'''
          if '/* Final Experience treatment:' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          old='The page has no numeric rail and no zone submenu. Experience is one direct hamburger link across all pages. The page alternates linen, ink, and occasional gold editorial surfaces so it does not read as one long black page.'
          new='The page has no numeric rail and no zone submenu. Experience is one direct hamburger link across all pages. The approved layout uses a dark cinematic hero, then a consistent linen editorial body where every zone retains its earlier immersive abstract visual inside a large ink panel, followed by dark closing CTA and footer. Do not alternate random section colors.'
          s=s.replace(old,new)
          rule='Experience page styling must match the rest of BIRC: dark hero, linen content body, ink visual panels, gold accents, dark CTA/footer. Keep the immersive abstract zone visuals from the original version, but no numeric rail and no nine-item hamburger submenu.'
          marker='Experience navigation must remain a single direct link. Do not add the nine zones as hamburger submenus or restore a numbered 1–9 rail.'
          if rule not in s:s=s.replace(marker,marker+'\n\n'+rule)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience.html context.md
          git commit -m 'Refine Experience page to BIRC editorial aesthetic'
          git push
