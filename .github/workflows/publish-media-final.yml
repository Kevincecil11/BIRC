name: Publish Media Final
on:
  push:
    paths:
      - '.github/workflows/publish-media-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final media layer and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-media-coverage.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="assets/media-coverage-cabinet-refine.css?v=20260820-2306">'
          new='<link rel="stylesheet" href="assets/media-coverage-cabinet-final.css?v=20260820-2313">'
          assert old in s, 'refinement stylesheet reference not found'
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/publish-media-final.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-media-coverage.html .github/workflows/publish-media-final.yml
          git commit -m 'Publish final Media Coverage heading system' || exit 0
          git push
