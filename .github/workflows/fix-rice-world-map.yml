name: Fix rice world-map visibility

on:
  push:
    paths:
      - '.github/workflows/fix-rice-world-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix background positioning and contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css='''/* Rice world-map visibility fix */.final>.rice-world-bg{position:absolute!important;inset:0!important;z-index:0!important;display:block!important;background-image:url('assets/rice-world-map.png')!important;background-size:cover!important;background-position:center 42%!important;background-repeat:no-repeat!important;opacity:1!important}.final:after{background:linear-gradient(180deg,#0d0d0b55 0%,#0d0d0b2e 32%,#0d0d0b70 68%,#0d0d0bb8 100%)!important}.final>*:not(.rice-world-bg){position:relative;z-index:2}'''
          if '/* Rice world-map visibility fix */' not in s:s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix rice world-map background visibility'
          git push
