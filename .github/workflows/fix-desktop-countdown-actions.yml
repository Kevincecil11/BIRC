name: Connect global desktop controls
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-desktop-countdown-actions.yml'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect shared script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/canonical-navigation.js')
          s = p.read_text()
          marker = 'global-desktop-controls.js'
          if marker not in s:
              addition = "\n  if(desktop&&!document.querySelector('script[data-global-desktop-controls]')){var g=document.createElement('script');g.src='assets/global-desktop-controls.js?v=20260817';g.dataset.globalDesktopControls='1';document.head.appendChild(g)}\n"
              s = s.replace('\n})();\n', addition + '\n})();\n', 1)
              p.write_text(s)
          Path('publish-refresh.html').write_text('<!doctype html><meta charset="utf-8"><title>BIRC publish marker</title><!-- global desktop controls 2026-08-17 -->')
          PY
          rm .github/workflows/fix-desktop-countdown-actions.yml
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/canonical-navigation.js publish-refresh.html .github/workflows/fix-desktop-countdown-actions.yml
          git commit -m "Connect countdown and quick actions across desktop"
          git push origin main
