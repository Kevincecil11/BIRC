name: Unify Exhibition theme

on:
  push:
    paths:
      - '.github/workflows/unify-exhibition-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply black theme to all three views
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('exhibition.html');s=p.read_text()
          css='''/* Unified Exhibition dark theme */.profiles,.rental{background:var(--j)!important;color:var(--l)!important}.profiles .head .eye,.rental .head .eye{color:var(--dm)!important}.profiles .profile-tabs button{border-color:var(--dl)!important;color:var(--dm)!important}.profiles .profile-tabs button.active{background:var(--g)!important;color:var(--j)!important;border-color:var(--g)!important}.profile-list{border-top-color:var(--dl)!important}.profile{border-bottom-color:var(--dl)!important}.profile-btn{color:var(--l)!important}.profile-inner>p,.profile-inner li,.rental-intro,.rental .lead,.rental-note,.package p{color:var(--dm)!important}.profile-inner li,.packages,.package,.prospectus{border-color:var(--dl)!important}.profile.open .profile-btn strong{color:var(--g)!important}.floor-plan{background:var(--j2)!important}.package small{color:var(--g)!important}.package h3,.package strong,.prospectus{color:var(--l)!important}.view-switcher{background:var(--j)!important}body.section-view{background:#211f1d}body.section-view .page{background:var(--j)}'''
          if '/* Unified Exhibition dark theme */' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          rule='All three Exhibition views use the same black/ink background system. Do not switch Exhibitor Profile or Space Rental back to linen; only gold, linen text, muted grey, and editorial grey may vary within the dark surfaces.'
          anchor='Exhibition is a hash-driven single-section experience. Selecting a submenu or section switcher item shows only that section and hides the other two. The default view is Why exhibit. Do not return it to one long scrolling page unless explicitly requested.'
          if rule not in s:
              s=s.replace(anchor,anchor+'\n\n'+rule,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exhibition.html context.md
          git commit -m 'Use consistent black theme for Exhibition views'
          git push
