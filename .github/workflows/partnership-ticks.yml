name: Partnership ticks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/partnership-ticks.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Included labels with accessible ticks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('desktop-partnership.html')
          s = p.read_text()
          old = '<td class="yes">Included</td>'
          new = '<td class="yes"><span aria-label="Included">✓</span></td>'
          count = s.count(old)
          if count != 7:
              raise SystemExit(f'Expected 7 Included cells, found {count}')
          s = s.replace(old, new)
          s = s.replace('.yes{color:var(--g2);font-weight:600}', '.yes{color:var(--g2);font:700 20px/1 Poppins,sans-serif}')
          p.write_text(s)
          PY
          rm .github/workflows/partnership-ticks.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-partnership.html .github/workflows/partnership-ticks.yml
          git commit -m "Replace Partnership Included labels with ticks"
          git push origin main
