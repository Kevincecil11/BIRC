name: Import verified BIRC source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified standalone source
        run: |
          curl --fail --location --retry 3 'https://t90161376302.p.clickup-attachments.com/t90161376302/ca819c2b-d8a2-4a51-bc15-09757504ba70/index.html?view=open' --output index.html
          test "$(wc -c < index.html)" -eq 35154
          echo '41e51b48efab43d339dbb55419b4b1ffe4b64f863efbd2ea87b93a4e9d59a4fa  index.html' | sha256sum --check
      - name: Commit source of truth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Replace index with verified final v5 standalone'
          git push
