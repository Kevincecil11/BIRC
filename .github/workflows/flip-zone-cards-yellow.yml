name: Flip Experience Zone cards in place

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flip-zone-cards-yellow.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pull-down reader with card flips
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('desktop.html')
          s=p.read_text(encoding='utf-8')

          data={
          'The Rice Route Map':('From Indian Fields to the World',["Rice begins in India’s fields, then travels across continents to kitchens, markets and communities around the world.","Every line is a journey. Every destination reflects a growing global connection with Indian rice.","One grain. Many routes. A world connected by rice."]),
          'Seed Cloud':('Innovation & Data',['A cloud of capsules. A network of intelligence.']),
          'The Rice Archive':('200 Varieties. One Cultural Landscape.',["Every miniature jute sack holds a distinct variety shaped by soil, climate, water and generations of hands.","Traditional tarazus recall the markets where harvests were weighed, exchanged and celebrated.","Rice becomes a living expression of biodiversity, culture and memory."]),
          'Rice Through Time':('One Grain. 10,000 Years.',["Follow rice from wild grass and early domestication through civilisation, trade and the Green Revolution.","The journey moves from traditional farming to mechanised agriculture, then across borders and continents.","New varieties and smarter cultivation point towards a future responding to a changing planet."]),
          'How the World Eats Rice':('Different Tables. One Connecting Grain.',["A shared table journeys across cultures, with every place setting telling a story.","From Japan and India to the Middle East, Italy and Mexico, each tradition reflects culture, history and identity.","Different traditions. Different tables. One grain connecting us all."]),
          'Hands of Rice':('The Human Story of Every Grain',["Every grain passes through countless hands before reaching the plate.","The sculpted gestures move from soil preparation and sowing to harvesting, milling, cooking and serving.","A tribute to labour, craftsmanship, generosity, memory and human connection."]),
          'The World Within':('A Universe Hidden in a Single Grain',["Inside every grain are intricate cellular structures, crystalline formations and natural geometries.","Scientific imagery becomes an immersive landscape where science and art dissolve into discovery.","Sometimes the smallest grain holds the greatest universe."]),
          'Rice Mirror':('See Yourself. See Rice Differently.',["AI reconstructs your silhouette with thousands of floating rice grains.","As you move, grains fall, gather, grow and flow into fields, rivers, maps and landscapes.","For a moment, you become rice. One grain, infinite stories."]),
          'Beyond the Bowl':('One Grain, Infinitely More Than Food',["Rice becomes skincare, textiles, design, sustainable materials and everyday objects.","The familiar is elevated through science, craftsmanship and creativity.","Look beyond the bowl and discover possibilities hidden in a single grain."])}

          # Remove the pull-down reader entirely.
          s=re.sub(r'<section class="zone-reader".*?</section>','',s,flags=re.S)
          # Replace old reader script with flip initializer.
          payload=json.dumps(data,ensure_ascii=False).replace('</','<\\/')
          js=f'''<script id="zone-read-more-script">(function(){{var data={payload};document.querySelectorAll('[data-zone-card]').forEach(function(card){{var key=card.dataset.zoneCard,item=data[key],front=document.createElement('div'),inner=document.createElement('div'),back=document.createElement('div'),button=card.querySelector('.zone-read');front.className='zone-card-front';while(card.firstChild)front.appendChild(card.firstChild);inner.className='zone-card-inner';back.className='zone-card-back';back.innerHTML='<div class="zone-back-top"><span>'+item[0]+'</span><button type="button" aria-label="Show '+key+' front">×</button></div><h3>'+key+'</h3><div class="zone-back-copy">'+item[1].map(function(x){{return '<p>'+x+'</p>'}}).join('')+'</div>';inner.appendChild(front);inner.appendChild(back);card.appendChild(inner);button=front.querySelector('.zone-read');button.addEventListener('click',function(){{var open=card.classList.toggle('is-flipped');button.setAttribute('aria-expanded',String(open))}});back.querySelector('button').addEventListener('click',function(){{card.classList.remove('is-flipped');button.setAttribute('aria-expanded','false')}})}});document.addEventListener('keydown',function(e){{if(e.key==='Escape')document.querySelectorAll('.zone-card.is-flipped').forEach(function(c){{c.classList.remove('is-flipped');c.querySelector('.zone-read').setAttribute('aria-expanded','false')}})}})}})();</script>'''
          if 'id="zone-read-more-script"' in s:s=re.sub(r'<script id="zone-read-more-script">.*?</script>',js,s,flags=re.S)
          else:s=s.replace('</body>',js+'\n</body>',1)

          css=r'''<style id="zone-card-flip-yellow">
          .zone-reader{display:none!important}
          .zone-card{padding:0!important;min-height:570px!important;background:transparent!important;overflow:visible!important;perspective:1400px}
          .zone-card-inner{position:relative;width:100%;height:100%;min-height:570px;transform-style:preserve-3d;transition:transform .62s var(--e)}
          .zone-card.is-flipped .zone-card-inner{transform:rotateY(180deg)}
          .zone-card-front,.zone-card-back{position:absolute;inset:0;padding:20px 20px 26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
          .zone-card-front{background:var(--linen);color:var(--ink);transition:background .24s var(--e),color .24s var(--e)}
          .zone-card:not(.is-flipped):hover .zone-card-front{background:var(--gold);color:var(--ink)}
          .zone-card:not(.is-flipped):hover .zone-card-top,.zone-card:not(.is-flipped):hover p{color:#4a3507!important}
          .zone-card:not(.is-flipped):hover .zone-card-art{border-color:#9e711b}
          .zone-card:not(.is-flipped):hover .zone-read{border-color:var(--ink);color:var(--ink)}
          .zone-card-back{transform:rotateY(180deg);background:var(--gold);color:var(--ink);display:flex;flex-direction:column}
          .zone-back-top{display:flex;justify-content:space-between;align-items:start;gap:24px;padding-bottom:18px;border-bottom:1px solid #9e711b;color:#5a4008;font:600 9px Poppins;letter-spacing:.14em;text-transform:uppercase}
          .zone-back-top button{width:38px;height:38px;margin-top:-7px;border:1px solid #9e711b;background:transparent;color:var(--ink);font-size:21px;cursor:pointer}
          .zone-card-back h3{margin-top:26px;font:600 31px/1.05 Poppins;letter-spacing:-.05em;color:var(--ink)}
          .zone-back-copy{margin-top:24px;padding-right:8px;overflow:auto;scrollbar-width:thin;scrollbar-color:#9e711b transparent}
          .zone-back-copy p{margin:0 0 18px!important;color:#3f2d06!important;font-size:14px!important;line-height:1.62!important;max-width:none!important}
          .zone-read{background:transparent!important}
          @media(max-width:1400px){.zone-card,.zone-card-inner{min-height:530px!important}.zone-card-front,.zone-card-back{padding:16px 16px 22px}.zone-card-back h3{font-size:27px}.zone-back-copy p{font-size:13px!important}}
          @media(prefers-reduced-motion:reduce){.zone-card-inner{transition:none}}
          </style>'''
          if 'id="zone-card-flip-yellow"' in s:s=re.sub(r'<style id="zone-card-flip-yellow">.*?</style>',css,s,flags=re.S)
          else:s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          git diff --cached --quiet || git commit -m "Flip Experience Zone cards in place with yellow detail faces"
          git push
