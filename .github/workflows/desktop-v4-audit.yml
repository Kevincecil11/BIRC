name: Rebuild and audit desktop homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-v4-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace desktop styling with a clean system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop.html')
          html=p.read_text()
          css=r'''<style id="desktop-home-v4">
          /* Desktop v4: a clean, bounded editorial system */
          :root{--max:1240px;--side:max(40px,calc((100vw - 1240px)/2));--sy:112px}
          *{box-sizing:border-box}body{min-width:1100px;background:var(--j);font-size:16px}.page{width:100%;max-width:none;overflow:hidden}.view-switch,.action-dock,.action-backdrop,.sticky,.drawer,.menu{display:none!important}
          .bar{left:0;right:0;top:0;width:100%;height:80px;transform:none;padding:0 var(--side);display:grid;grid-template-columns:160px 1fr auto;gap:28px;background:var(--j);border-bottom:1px solid var(--dl)}.bar .logo{width:150px;height:46px}.desktop-nav{display:flex;justify-content:center;align-items:center;gap:20px}.desktop-nav a{padding:30px 0 27px;color:var(--dm);font:500 11px Poppins,sans-serif;white-space:nowrap}.desktop-nav a:hover{color:var(--l)}.desktop-tools{display:flex;align-items:center;gap:8px}.desktop-tools>a{min-height:40px;padding:0 14px;display:grid;place-items:center;border:1px solid var(--dl);font:600 9px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase}.desktop-tools .desktop-register{background:var(--g);border-color:var(--g);color:var(--j)}.desktop-view-toggle{display:none!important}.progress{left:0;width:100%;transform:none}
          .hero{min-height:860px;padding:148px var(--side) 44px;display:grid;grid-template-columns:7fr 5fr;grid-template-rows:auto auto 1fr auto;gap:28px 64px}.hero:before{background:radial-gradient(circle at 80% 30%,#ebb34120,transparent 28%),repeating-linear-gradient(116deg,transparent 0 55px,#faf0e606 55px 56px)}.hero .slot{grid-column:2;grid-row:1;text-align:right;align-self:start}.hero-main{grid-column:1/2;grid-row:1/4;margin:0;align-self:end}.hero .eye{margin-bottom:24px}.hero h1{font-size:clamp(72px,6vw,96px);line-height:.91;letter-spacing:-.065em;max-width:9.5ch}.hero .lead{font-size:17px;line-height:1.6;max-width:52ch;margin-top:28px}.hero .actions{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;align-self:end}.hero .facts{grid-column:2;grid-row:3;align-self:end;margin:0;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--dl)}.hero .fact{min-height:82px;padding:18px;border:0}.hero .fact:nth-child(odd){border-right:1px solid var(--dl)}.hero .fact:nth-child(-n+2){border-bottom:1px solid var(--dl)}.hero .fact:nth-child(even){padding-left:18px}.hero .scroll{grid-column:1/3;grid-row:4;padding-top:0}.ticker{padding:14px 0}
          .statement{min-height:0;padding:var(--sy) var(--side);display:grid;grid-template-columns:240px minmax(0,1fr);gap:64px;align-items:start}.statement .eye{padding-top:12px}.statement p{font-size:clamp(48px,4vw,64px);line-height:1.09;letter-spacing:-.05em;max-width:19ch}.statement footer{grid-column:2;margin-top:20px}
          #pathways{padding:var(--sy) var(--side)}#pathways>.head{display:grid;grid-template-columns:240px 1fr;gap:64px;margin-bottom:56px}#pathways>.head .eye{padding-top:12px}#pathways>.head .title{font-size:64px;max-width:11ch}.path-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.path{height:500px;padding:28px;border:1px solid var(--dl)}.path h3{font-size:48px}.path p{font-size:14px;max-width:30ch}
          .light[style*="padding-top"]{padding:var(--sy) var(--side)!important;display:grid;grid-template-columns:360px 1fr;gap:0 72px}.light[style*="padding-top"]>.head{grid-column:1;padding:0!important;position:static}.light[style*="padding-top"]>.head .title{font-size:58px;line-height:.95;max-width:8ch}.light[style*="padding-top"]>.fig{grid-column:2!important;min-height:112px;padding:20px 0;display:grid;grid-template-columns:1fr auto;align-items:center}.light[style*="padding-top"]>.fig b{font-size:72px;line-height:.9}.light[style*="padding-top"]>.fig small{align-self:center}.light[style*="padding-top"]>.note{grid-column:2!important;padding:20px 0 0}
          .knowledge{padding:var(--sy) var(--side)}.knowledge>.head{display:grid;grid-template-columns:360px 1fr;gap:72px;margin-bottom:48px}.knowledge>.head .eye{padding-top:12px}.knowledge>.head .title{font-size:60px;line-height:.96;max-width:10ch}.knowledge-meta{margin:0 0 36px 432px}.knowledge>.session-day{padding:0;display:grid;grid-template-columns:360px 1fr;gap:72px}.session-day+.session-day{margin-top:52px}.session-day-head{display:grid;gap:8px;align-content:start;padding-top:22px;border-top:1px solid var(--dl);position:static}.session-list{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--dl)}.session{min-height:150px;padding:22px 18px}.session h3{font-size:17px}.session p{font-size:13px}
          .difference{padding:var(--sy) var(--side);display:grid;grid-template-columns:360px 1fr;gap:0 72px}.difference>.head{padding:0;position:static}.difference>.head .title{font-size:50px;line-height:1;max-width:11ch}.ey-report{grid-column:1;margin:48px 0 0;position:static;grid-template-columns:1fr}.difference-list{grid-column:2;grid-row:1/3}.difference-btn{min-height:96px;padding:0 16px}.difference-btn strong{font-size:16px;line-height:1.35}.difference-detail p{font-size:14px;max-width:68ch}
          .zones{padding:var(--sy) var(--side)}.zones>.head{padding:0!important;display:grid;grid-template-columns:7fr 5fr;gap:72px;align-items:end;margin-bottom:48px}.zones>.head .title{font-size:62px;max-width:9ch}.zones>.head .lead{max-width:38ch}.tour-view{width:100%;max-width:none}.zone{padding:0}.zone-vis{height:590px}.zone-copy{left:42px;right:42px;bottom:40px}.zone-copy h3{font-size:62px;max-width:11ch}.zone-copy p{font-size:15px;max-width:46ch}.globe{width:390px;height:390px}.rings i{width:330px;height:440px}.tour-ui{padding:20px 0 0;grid-template-columns:1fr 68px auto}.tour-progress{min-width:0}.tour-actions{grid-column:auto;display:flex;gap:8px}.tour-actions button{width:140px}
          .date-sec{padding:var(--sy) var(--side);display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto 1fr;gap:16px 72px;align-items:start}.date-sec>.eye{grid-column:1;grid-row:1;padding-top:12px}.date-sec>p{grid-column:1;grid-row:2;font-size:48px;line-height:1.08;max-width:10ch;margin:0}.date-lock{grid-column:2;grid-row:1/3;width:100%;padding:44px 0}.date-lock h3{font-size:88px}.date-row{margin-top:28px;gap:18px}.date-row span{font-size:82px}
          .programme{padding:var(--sy) var(--side)}.programme>.head{padding:0!important;display:grid;grid-template-columns:360px 1fr;gap:72px;margin-bottom:48px}.programme>.head .eye{padding-top:12px}.programme>.head .title{font-size:60px}.program{margin:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--dl)}.rail{display:none}.day{min-height:380px;padding:28px}.day+.day{border-left:1px solid var(--dl)}.node{left:auto;right:28px;top:30px}.day-num{right:24px;top:76px;font-size:96px}.day h3{margin-top:195px;font-size:28px}.day p{font-size:13px}
          #voices{padding:var(--sy) var(--side);display:grid;grid-template-columns:360px 1fr;gap:72px}#voices>.head .title{font-size:58px}.quote blockquote{font-size:50px;line-height:1.1;max-width:15ch}.quote-mark{font-size:88px}.quote-ui{grid-column:2}
          .why{padding:var(--sy) var(--side)}.why>.head{padding:0!important;display:grid;grid-template-columns:360px 1fr;gap:72px;margin-bottom:18px}.why>.head .eye{padding-top:12px}.why>.head .title{font-size:60px;max-width:9ch}.why-intro{padding:0 0 44px 432px}.reasons{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--dl)}.reason{min-height:330px;padding:26px;border-bottom:1px solid var(--dl)}.reason:nth-child(odd){border-right:1px solid var(--dl)}.reason-word{top:48px;font-size:82px;white-space:nowrap}.reason h3{font-size:24px}.reason p{font-size:14px;max-width:34ch}.reason:nth-child(even){text-align:left}.why-close{padding:48px 0 0;font-size:34px}
          .dark.pad[style*="padding-left:0"]{padding:var(--sy) 0!important}.dark.pad[style*="padding-left:0"]>.head{padding:0 var(--side)!important}.gallery-img{width:390px!important;height:270px!important}.gallery-img:nth-child(even){width:490px!important}
          .visit{padding:var(--sy) var(--side)}.visit>.head{padding:0!important;display:grid;grid-template-columns:360px 1fr;gap:72px}.visit>.head .eye{padding-top:12px}.visit>.head .title{font-size:60px}.visit-grid{display:grid;grid-template-columns:repeat(4,1fr)}.visit-item{min-height:290px;padding:24px}.visit-item h3{font-size:21px}.visit-detail p{font-size:13px}.visit-note{margin:40px 0 0}
          .final{min-height:680px;padding:var(--sy) var(--side)}.final h2{font-size:104px}.final .btn{width:380px;margin:0 auto}.clock{width:640px;margin:50px auto 0}.clock strong{font-size:36px}.footer{padding:80px var(--side) 56px;display:grid;grid-template-columns:1fr 1fr;gap:28px 80px}.footer h4{font:600 38px Poppins}.footer .field{grid-column:1}.footer .links{grid-column:2;grid-row:1/4;margin:0}.footer .end{grid-column:1}
          .registration-dialog{width:min(760px,calc(100% - 60px))}.registration-options{grid-template-columns:repeat(3,1fr)}.registration-option{min-height:180px;grid-template-columns:1fr 20px;align-content:start}.registration-icon{grid-column:1/-1;margin-bottom:16px}
          @media(max-width:1200px){:root{--side:36px}.desktop-nav{gap:11px}.desktop-nav a{font-size:9px}.bar{grid-template-columns:145px 1fr auto}.bar .logo{width:138px}.desktop-tools>a{padding-inline:10px}.hero{gap-inline:40px}.hero h1{font-size:74px}.statement,#pathways>.head,.knowledge>.head,.knowledge>.session-day,.difference,.date-sec,.programme>.head,#voices,.why>.head,.visit>.head{grid-template-columns:300px 1fr;gap:52px}.knowledge-meta{margin-left:352px}.why-intro{padding-left:352px}.light[style*="padding-top"]{grid-template-columns:300px 1fr;gap:52px}.path{height:450px}.path h3{font-size:42px}}
          </style>'''
          # remove previous desktop override blocks so this stays auditable
          import re
          html=re.sub(r'<style id="desktop-home-style">.*?</style>','',html,flags=re.S)
          html=re.sub(r'<style id="desktop-home-v2">.*?</style>','',html,flags=re.S)
          html=re.sub(r'<style id="desktop-home-v3">.*?</style>','',html,flags=re.S)
          html=re.sub(r'<style id="desktop-home-v4">.*?</style>','',html,flags=re.S)
          html=html.replace('</head>',css+'</head>',1)
          p.write_text(html)
          PY
      - name: Commit clean desktop rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html
          git diff --cached --quiet || (git commit -m "Rebuild desktop homepage with clean editorial grid" && git push)
