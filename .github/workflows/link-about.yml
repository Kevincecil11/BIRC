name: Link About page

on:
  push:
    paths:
      - '.github/workflows/link-about.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link About page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="#about">About <small>⌄</small></a>'
          new = '<a href="about.html">About <small>⌄</small></a>'
          if old not in s:
              raise SystemExit('About menu link not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Link About page from main menu'
          git push
