name: Add Partnership and full-scale Experience

on:
  push:
    paths:
      - '.github/workflows/add-partnership-fullscale.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add styled Partnership page
        run: |
          curl --fail --location --retry 3 'https://t90161376302.p.clickup-attachments.com/t90161376302/d91498ab-7972-4a69-942d-6b4e9bb7d73e/partnership.html?view=open' --output partnership.html
          test "$(wc -c < partnership.html)" -eq 31133
      - name: Link Partnership and remove Experience side gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html']
          for name in pages:
              p=Path(name);s=p.read_text()
              # Partnership is one direct page link, no submenu indicator.
              s=re.sub(r'<a href="(?:index\.html)?#pathways">Partnership(?: <small>⌄</small>)?</a>','<a href="partnership.html">Partnership</a>',s)
              s=s.replace('<a href="partnership.html">Partnership <small>⌄</small></a>','<a href="partnership.html">Partnership</a>')
              p.write_text(s)

          p=Path('experience.html');s=p.read_text()
          css='''/* True full-bleed Experience sections */.zone{padding:0!important;gap:0!important}.zone-kicker{padding:56px var(--p) 18px!important;margin:0!important}.visual{width:100%!important;height:430px!important;margin:0!important;align-self:stretch!important;transform:none!important}.zone-copy{padding:40px var(--p) 88px!important;margin:0!important}.zone:nth-of-type(even) .zone-copy{padding-left:var(--p)!important;padding-right:var(--p)!important}.zone h2{max-width:12ch!important}.hero{padding-left:var(--p)!important;padding-right:var(--p)!important}.cta{padding-left:var(--p)!important;padding-right:var(--p)!important}@media(max-width:360px){.visual{width:100%!important}}'''
          if '/* True full-bleed Experience sections */' not in s:s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s)
          PY
      - name: Update living context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          block='''\n### `partnership.html`\n\nA separate Partnership page built from the user-supplied sponsorship content and styled with `design.md`. Partnership is one direct hamburger link with no submenu. The page preserves all supplied sponsorship tiers, prices, GST notes, package benefits, promotional visibility, special opportunities, and partner logo placeholders. Keep the detailed accordion content intact unless approved replacements are supplied.\n'''
          if '### `partnership.html`' not in s:s=s.replace('### `experience.html`',block+'\n### `experience.html`')
          s=s.replace('- Partnership: currently points to the homepage participation area until a dedicated page is created','- Partnership: `partnership.html`, direct link with no dropdown')
          old='The approved layout uses a dark cinematic hero, then a consistent linen editorial body where every zone retains its earlier immersive abstract visual inside a large ink panel, followed by dark closing CTA and footer. Do not alternate random section colors.'
          new='The approved layout uses a dark cinematic hero, then a consistent linen editorial body where every zone retains its immersive abstract visual inside a full-bleed ink panel, followed by dark closing CTA and footer. Zone visuals touch both edges of the 520px canvas; do not add left or right gutters around them.'
          s=s.replace(old,new)
          rule='Experience visual panels must remain full-bleed across the mobile canvas with zero left/right spacing. Text keeps 22px padding above or below the visual.'
          if rule not in s:s=s.replace('Experience page styling must match the rest of BIRC:',rule+'\n\nExperience page styling must match the rest of BIRC:')
          s=s.replace('Last updated: 2026-08-01','Last updated: 2026-08-01 (Partnership added; Experience made full-bleed)')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html conference.html exhibition.html experience.html partnership.html context.md
          git commit -m 'Add Partnership page and full-bleed Experience visuals'
          git push
