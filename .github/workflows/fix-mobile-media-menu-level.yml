name: Fix mobile Media Coverage menu level

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-media-menu-level.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move Media Coverage outside Influencers group
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          names=['index.html','about.html','conference.html','exhibition.html','experience.html','creators.html','rice-masterchef.html','artists.html','partnership.html','plan-visit.html','contact.html','register.html','media-coverage.html']
          changed=[]
          for name in names:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              old=s
              # Current generated shape: media link is the final child of influencer-group.
              s,n=re.subn(r'(<div class="influencer-group">.*?<div class="influencer-sub">.*?</div></div>)<a href="media-coverage\.html">Media Coverage</a></div>(<a href="partnership\.html">Partnership</a>)',r'\1</div><a href="media-coverage.html">Media Coverage</a>\2',s,count=1,flags=re.S)
              if n:
                  p.write_text(s,encoding='utf-8')
                  changed.append(name)
          print('Fixed',len(changed),'mobile menus')
          for x in changed: print(x)
          PY
      - name: Commit corrected mobile menu structure
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html conference.html exhibition.html experience.html creators.html rice-masterchef.html artists.html partnership.html plan-visit.html contact.html register.html media-coverage.html
          git commit -m 'Fix Media Coverage placement in mobile sandwich menus'
          git push origin main
