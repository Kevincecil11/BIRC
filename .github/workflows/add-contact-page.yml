name: Add BIRC Contact page
on:
  push:
    paths: ['.github/workflows/add-contact-page.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Contact page
        run: |
          cat > contact.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Contact Us | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>
          :root{--j:#0d0d0b;--j2:#191916;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--m:#2b2b27;--dm:#aba49c;--lm:#6d6862;--dl:#35332e;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#211f1d;color:var(--l);font:400 16px/1.62 Inter,sans-serif;-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.page{width:min(100%,520px);margin:auto;background:var(--j);overflow:hidden}.eye{font:600 10px/1 Poppins;letter-spacing:.18em;text-transform:uppercase}.title{font:600 clamp(44px,14vw,70px)/.9 Poppins;letter-spacing:-.07em;margin:0;text-wrap:balance}.section-title{font:600 clamp(36px,10vw,52px)/.96 Poppins;letter-spacing:-.055em;margin:0}.lead{font-weight:300;color:var(--dm);margin:0}.head{display:grid;gap:16px;margin-bottom:42px}.bar{position:fixed;z-index:80;top:0;left:50%;width:min(100%,520px);height:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;padding:0 var(--p);background:var(--j);border-bottom:1px solid var(--dl)}.logo{width:122px;height:48px;object-fit:contain;object-position:left}.menu{width:44px;height:44px;border:0;background:none;color:var(--l);padding:11px}.menu i{display:block;height:1px;background:currentColor;margin:6px 0}.drawer{position:fixed;z-index:100;inset:0;margin:auto;width:min(100%,520px);background:var(--j);padding:22px;display:flex;flex-direction:column;overflow:auto;transform:translateY(-102%);transition:transform .45s var(--e)}.drawer.open{transform:none}.drawer-top{display:flex;justify-content:space-between}.drawer nav{margin:auto 0}.drawer nav a{display:flex;padding:14px 0;border-bottom:1px solid var(--dl);font:600 27px/1.2 Poppins;letter-spacing:-.05em}.drawer p,.drawer-social{color:var(--dm);font-size:13px}.drawer-social{display:flex;gap:7px;padding-top:18px;border-top:1px dashed var(--dl)}.x{width:44px;height:44px;border:1px solid var(--dl);background:none;color:var(--l)}.hero{min-height:78svh;padding:130px var(--p) 70px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 83% 18%,#ebb34132,transparent 27%),repeating-linear-gradient(116deg,transparent 0 31px,#faf0e609 31px 32px)}.hero>*{position:relative}.hero .eye{color:var(--g);margin-bottom:26px}.hero .lead{font-size:18px;max-width:31ch;margin-top:26px}.hero-foot{display:flex;justify-content:space-between;margin-top:46px;padding-top:22px;border-top:1px solid var(--dl);color:var(--dm);font:600 9px Poppins;text-transform:uppercase}.intro{padding:96px var(--p);background:var(--l);color:var(--j)}.intro .eye{color:var(--g2);margin-bottom:22px}.intro p{color:var(--lm);margin:22px 0 0}.routes{display:grid;grid-template-columns:1fr 1fr;margin-top:44px;border-block:1px solid var(--ll)}.route{min-height:170px;padding:20px 14px 18px 0;display:flex;flex-direction:column;border-bottom:1px solid var(--ll)}.route:nth-child(odd){border-right:1px solid var(--ll)}.route:nth-child(even){padding-left:14px}.route:nth-child(n+3){border-bottom:0}.route small{color:var(--g2);font:600 8px Poppins;letter-spacing:.14em;text-transform:uppercase}.route h3{font:600 18px/1.2 Poppins;letter-spacing:-.035em;margin:12px 0 8px}.route p{font-size:12px;margin:0;color:var(--lm)}.route a{margin-top:auto;padding-top:18px;color:var(--g2);font:600 9px Poppins;text-transform:uppercase}.form-section{padding:96px var(--p)}.form-section .eye{color:var(--g)}.form{display:grid;gap:22px}.field{display:grid;gap:8px}.field label{font:600 9px Poppins;letter-spacing:.13em;text-transform:uppercase;color:var(--dm)}.field input,.field select,.field textarea{width:100%;border:0;border-bottom:1px solid var(--dl);border-radius:0;background:transparent;color:var(--l);padding:12px 0;font-size:16px}.field select{color-scheme:dark}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--g)}.submit{min-height:56px;border:0;background:var(--g);color:var(--j);font:600 13px Poppins}.submit[disabled]{opacity:.55}.status{min-height:22px;color:var(--g);font-size:13px}.footer{padding:70px var(--p) 100px;background:var(--j2);border-top:1px solid var(--dl)}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}.end{margin-top:40px;color:var(--dm);font-size:12px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header class="bar"><a href="index.html"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/birc-mark-white-solid.png" alt="BIRC"></a><button class="menu" id="openMenu" aria-label="Open menu"><i></i><i></i></button></header><aside class="drawer" id="drawer"><div class="drawer-top"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/birc-mark-white-solid.png" alt="BIRC"><button class="x" id="closeMenu" aria-label="Close menu">×</button></div><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a><a href="plan-visit.html">Plan Visit</a><a href="contact.html">Contact</a></nav><div class="drawer-social"><a href="#">Instagram</a><span>·</span><a href="#">LinkedIn</a></div><p>Bharat Mandapam, Pragati Maidan<br>New Delhi · 23–25 October 2026</p></aside><main class="page"><section class="hero"><span class="eye">We'd love to hear from you</span><h1 class="title">Contact Us</h1><p class="lead">Questions about BIRC 2026? Our team is here to help.</p><div class="hero-foot"><span>Contact Us</span><span>23–25 October 2026</span></div></section><section class="intro"><span class="eye">Get in touch</span><h2 class="section-title">You Have Questions.<br>We Have Answers.</h2><p>Reach out about visiting, exhibiting, sponsoring or partnering at BIRC 2026, our team is ready to help with every detail, big or small.</p><div class="routes"><article class="route"><small>Visit</small><h3>Delegate support</h3><p>Registration, travel, visas and access.</p><a href="plan-visit.html">Plan your visit →</a></article><article class="route"><small>Exhibit</small><h3>Exhibition team</h3><p>Profiles, floor plan and space rental.</p><a href="exhibition.html">Explore exhibition →</a></article><article class="route"><small>Partner</small><h3>Sponsorship team</h3><p>Packages and special opportunities.</p><a href="partnership.html">View partnership →</a></article><article class="route"><small>Conference</small><h3>Programme team</h3><p>Speakers, agenda and learning sessions.</p><a href="conference.html">View conference →</a></article></div></section><section class="form-section"><header class="head"><span class="eye">Send an enquiry</span><h2 class="section-title">Tell us what you need.</h2><p class="lead">We will route your message to the right BIRC team.</p></header><form class="form" id="contactForm"><div class="field"><label for="name">Name</label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div><div class="field"><label for="subject">I need help with</label><select id="subject" name="subject" required><option value="">Select an enquiry</option><option>Visiting BIRC</option><option>Exhibiting at BIRC</option><option>Sponsorship and partnership</option><option>Conference and programme</option><option>Media enquiry</option><option>Other</option></select></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div><button class="submit" id="submitButton" type="submit">Send enquiry →</button><div class="status" id="formStatus" role="status" aria-live="polite"></div></form></section></main><footer class="page footer"><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="plan-visit.html">Plan Visit</a></div><div class="end">© 2026 Bharat International Rice Conference<br>Privacy · Terms · Code of Conduct</div></footer><script>const drawer=document.getElementById('drawer');function menu(open){drawer.classList.toggle('open',open);document.body.classList.toggle('lock',open)}openMenu.onclick=()=>menu(true);closeMenu.onclick=()=>menu(false);drawer.querySelectorAll('a').forEach(a=>a.onclick=()=>menu(false));addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});contactForm.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(contactForm),subject=encodeURIComponent('BIRC 2026: '+data.get('subject')),body=encodeURIComponent(`Name: ${data.get('name')}\nEmail: ${data.get('email')}\nPhone: ${data.get('phone')}\n\n${data.get('message')}`);formStatus.textContent='Opening your email app…';location.href=`mailto:?subject=${subject}&body=${body}`});</script></body></html>
          HTML
      - name: Link Contact from all pages and update context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html','partnership.html','plan-visit.html']
          for name in pages:
              p=Path(name);s=p.read_text()
              # Replace first navigation Contact target, regardless of current footer anchor.
              s,n=re.subn(r'<a href="#contact">Contact</a>', '<a href="contact.html">Contact</a>', s, count=1)
              if n==0:
                  # Some pages may already point elsewhere or omit it in unusual nav markup.
                  s=s.replace('<a href="contact.html">Contact</a>','<a href="contact.html">Contact</a>',1)
              p.write_text(s)
          p=Path('context.md');s=p.read_text()
          block='''\n### `contact.html`\n\nDedicated Contact page based on the mobile `birc.in/contact` structure and BIRC `design.md`. Approved visible copy includes “We’d love to hear from you,” “Contact Us,” “Questions about BIRC 2026? Our team is here to help,” “Get in touch,” and “You Have Questions. We Have Answers.” The page routes users toward Visit, Exhibition, Partnership, or Conference and includes a working enquiry form that opens the user’s email client with a prefilled subject/body. No phone number or destination email was invented because none was supplied. Contact is a direct hamburger link on all current pages.\n'''
          if '### `contact.html`' not in s:s=s.replace('### `plan-visit.html`',block+'\n### `plan-visit.html`')
          s=s.replace('- Contact: current page footer contact anchor','- Contact: direct link to `contact.html`')
          s=s.replace('Last updated: 2026-08-01','Last updated: 2026-08-03')
          p.write_text(s)
          PY
      - name: Commit ten files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact.html index.html about.html conference.html exhibition.html experience.html partnership.html plan-visit.html context.md
          git commit -m 'Add working BIRC Contact page'
          git push
