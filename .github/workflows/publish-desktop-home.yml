name: Publish desktop pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-desktop-home.yml'
      - 'desktop.html'
      - 'desktop-about.html'
      - 'desktop-conference.html'
      - 'desktop-exhibition.html'
      - 'desktop-exhibitor-profile.html'
      - 'desktop-space-rental.html'
      - 'desktop-experience.html'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: desktop-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy desktop Experience page
        id: deployment
        uses: actions/deploy-pages@v4

