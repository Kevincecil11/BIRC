name: Split Exhibition into section views

on:
  push:
    paths:
      - '.github/workflows/split-exhibition-views.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add section-only Exhibition navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('exhibition.html')
          s=p.read_text()
          css='''.view-switcher{position:sticky;top:72px;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--j);border-block:1px solid var(--dl)}.view-switcher a{min-height:54px;padding:10px 7px;display:grid;place-items:center;text-align:center;color:var(--dm);font:600 8px/1.35 Poppins,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-right:1px solid var(--dl)}.view-switcher a:last-child{border-right:0}.view-switcher a.active{background:var(--g);color:var(--j)}body.view-why-exhibit .profiles,body.view-why-exhibit .ecosystem,body.view-why-exhibit .rental,body.view-exhibitor-profile .includes,body.view-exhibitor-profile .movement,body.view-exhibitor-profile .rental,body.view-space-rental .includes,body.view-space-rental .movement,body.view-space-rental .profiles,body.view-space-rental .ecosystem{display:none}body.section-view .hero,body.section-view .location{display:none}'''
          if '.view-switcher{' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          switcher='''<nav class="view-switcher" aria-label="Exhibition sections"><a href="#why-exhibit" data-view-link="why-exhibit">Why exhibit</a><a href="#exhibitor-profile" data-view-link="exhibitor-profile">Exhibitor profile</a><a href="#space-rental" data-view-link="space-rental">Space rental</a></nav>'''
          marker='<section class="includes dark" id="why-exhibit">'
          if switcher not in s:
              if marker not in s: raise SystemExit('Why Exhibit section not found')
              s=s.replace(marker,switcher+marker,1)
          js='''function setExhibitionView(){const valid=['why-exhibit','exhibitor-profile','space-rental'];const view=valid.includes(location.hash.slice(1))?location.hash.slice(1):'why-exhibit';document.body.classList.remove('view-why-exhibit','view-exhibitor-profile','view-space-rental');document.body.classList.add('section-view','view-'+view);document.querySelectorAll('[data-view-link]').forEach(x=>{const active=x.dataset.viewLink===view;x.classList.toggle('active',active);active?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current')});scrollTo(0,0)}addEventListener('hashchange',setExhibitionView);setExhibitionView();'''
          if 'function setExhibitionView()' not in s:
              s=s.replace('</script></body></html>',js+'</script></body></html>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          line='Exhibition is a hash-driven single-section experience. Selecting a submenu or section switcher item shows only that section and hides the other two. The default view is Why exhibit. Do not return it to one long scrolling page unless explicitly requested.'
          if line not in s:
              key='The Exhibitor Profile area uses horizontal category controls plus expandable detail rows. The Space Rental section retains placeholder prices `$X,XXX` and `On request` exactly as supplied; replace only when approved pricing is provided.'
              if key in s:s=s.replace(key,key+'\n\n'+line,1)
              else:s+='\n\n## Exhibition display rule\n\n'+line+'\n'
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exhibition.html context.md
          git commit -m 'Show one Exhibition section at a time'
          git push
