name: Clean desktop presentation chrome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-desktop-chrome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-site artifact chrome
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('desktop.html')
          html=p.read_text()
          html=re.sub(r'<!-- skill:chrome -->.*?<!-- /skill:chrome -->','',html,flags=re.S)
          p.write_text(html)
          c=Path('context.md')
          t=c.read_text()
          note='- Desktop homepage v4 was rebuilt with one clean 1240px editorial grid and audited section-by-section for hierarchy, alignment, overflow, interaction placement, and desktop readability. Artifact editing chrome is excluded from the published desktop page.\n'
          if note not in t:c.write_text(t.rstrip()+'\n'+note)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop.html context.md
          git diff --cached --quiet || (git commit -m "Remove artifact chrome from desktop homepage" && git push)
