name: Finalize BIRC consistency fixes
on:
  push:
    paths: ['.github/workflows/finalize-menu-partnership.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply menu, Partnership, and Exhibition fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html','partnership.html','plan-visit.html']

          # Single canonical hamburger menu, no Plan Visit submenu.
          nav='''<nav class="canonical-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><div class="exhibition-group"><button class="exhibition-parent" type="button" aria-expanded="false">Exhibition <small>⌄</small></button><div class="exhibition-sub"><div><a href="exhibition.html#why-exhibit">Why exhibit <span>01</span></a><a href="exhibition.html#exhibitor-profile">Exhibitor profile <span>02</span></a><a href="exhibition.html#space-rental">Space rental <span>03</span></a></div></div></div><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a><a href="plan-visit.html">Plan Visit</a><a href="#contact">Contact</a></nav>'''
          css='''.canonical-nav{margin:auto 0}.canonical-nav>a,.exhibition-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins,sans-serif;letter-spacing:-.05em;text-align:left}.exhibition-parent small{transition:transform .3s var(--e)}.exhibition-parent[aria-expanded=true] small{transform:rotate(180deg)}.exhibition-sub{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.exhibition-sub>div{overflow:hidden}.exhibition-sub.open{grid-template-rows:1fr;opacity:1}.exhibition-sub a{display:flex!important;justify-content:space-between;padding:10px 0 10px 18px!important;border-bottom:1px solid var(--dl);color:var(--dm)!important;font:500 12px/1.25 Poppins,sans-serif!important;letter-spacing:-.01em!important}.exhibition-sub a span{order:2;color:var(--g);font:600 9px Poppins,sans-serif}'''
          js="""const exhibitionParent=document.querySelector('.exhibition-parent'),exhibitionSub=document.querySelector('.exhibition-sub');if(exhibitionParent&&exhibitionSub)exhibitionParent.addEventListener('click',()=>{const open=exhibitionParent.getAttribute('aria-expanded')==='true';exhibitionParent.setAttribute('aria-expanded',String(!open));exhibitionSub.classList.toggle('open',!open)});"""
          for name in pages:
              p=Path(name);s=p.read_text()
              # Replace first drawer nav only.
              s,n=re.subn(r'<nav(?: class="[^"]*")?>[\s\S]*?</nav>',nav,s,count=1)
              if n!=1: raise SystemExit(f'Nav not found: {name}')
              if '.canonical-nav{' not in s:s=s.replace('</style>',css+'</style>',1)
              if 'const exhibitionParent=' not in s:s=s.replace('</script></body></html>',js+'</script></body></html>',1)
              p.write_text(s)

          # Partnership exact behavior.
          p=Path('partnership.html');s=p.read_text()
          css2='''/* Final Partnership package treatment */.dv-card>div:nth-child(3){background:var(--l)!important;color:var(--j)!important;border-color:var(--j)!important}.dv-card>div:nth-child(3)>.wf-h,.dv-card>div:nth-child(3)>div>.wf-h{color:var(--j)!important}.wf-tier-card,.wf-opp-card{background:var(--l)!important;border:1px solid var(--j)!important;outline:none!important;box-shadow:none!important;padding:14px!important}.wf-tier-card[open],.wf-opp-card[open]{outline:2px solid var(--g)!important;outline-offset:3px!important}.wf-tier-card:not([open]),.wf-opp-card:not([open]){outline:none!important}.wf-tier-toggle,.wf-opp-toggle{background:var(--j)!important;color:var(--l)!important;border:0!important;min-height:44px!important;display:grid!important;place-items:center!important;margin-top:auto!important}.wf-tier-card summary,.wf-opp-card summary{min-height:150px!important}.wf-tier-card[open] .wf-acc-body,.wf-opp-card[open] .wf-acc-body{border-top:1px solid var(--ll)!important}.wf-tier-card summary:focus-visible,.wf-opp-card summary:focus-visible{outline:3px solid var(--g)!important;outline-offset:2px!important}'''
          if '/* Final Partnership package treatment */' not in s:s=s.replace('</style></head>',css2+'</style></head>',1)
          p.write_text(s)

          # Exhibition: consistent Part 1 label and no horizontal profile selector.
          p=Path('exhibition.html');s=p.read_text()
          css3='''.includes .head .eye{color:var(--g)!important}.profile-tabs{display:none!important}'''
          if '.profile-tabs{display:none!important}' not in s:s=s.replace('</style></head>',css3+'</style></head>',1)
          # Make exact Part 1 eyebrow treatment match Part 2/3 if inline overrides exist.
          s=s.replace('Part 1 · Why Exhibit','Part 1 · Why Exhibit')
          p.write_text(s)

          # Context.
          p=Path('context.md');s=p.read_text()
          s=s.replace('- Plan Visit: expandable four-item submenu linking into `plan-visit.html`','- Plan Visit: one direct link to `plan-visit.html`; no dropdown')
          rule='Canonical menu rule: every page uses the same top-level order and styling. Only Exhibition has a dropdown. About, Conference, Experience, Partnership, and Plan Visit are direct links.'
          if rule not in s:s=s.replace('## 7. Design decisions that must persist',rule+'\n\n## 7. Design decisions that must persist')
          old='Partnership styling: Sponsorship Packages and Special Opportunities both use the cream section background and black one-pixel card frames; the first highlighted card in each group uses a gold outer outline. Do not make the Sponsorship Packages section black.'
          new='Partnership styling: Sponsorship Packages and Special Opportunities both use the cream section background and black one-pixel card frames. No card is highlighted by default; the gold outer outline appears only while that card is opened to view benefits. Do not make the Sponsorship Packages section black.'
          s=s.replace(old,new)
          note='Exhibition profile rule: do not show the separate horizontal Rice Millers / Exporters / Traders selector bar. Use the expandable profile list only. Part 1, Part 2, and Part 3 eyebrow labels use the same gold treatment.'
          if note not in s:s=s.replace('## 7. Design decisions that must persist',note+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit eight files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html conference.html exhibition.html experience.html partnership.html plan-visit.html context.md
          git commit -m 'Finalize canonical menu and section styling'
          git push
