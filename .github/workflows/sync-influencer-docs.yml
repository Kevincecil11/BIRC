name: Sync mobile influencer pages with supplied documents

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-influencer-docs.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing approved content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- Shared additions ----------
          shared_css='''.doc-note{margin-top:18px;color:var(--lm);font-size:12px}.faq-item{border-bottom:1px solid var(--ll)}.faq-q{width:100%;min-height:76px;padding:16px 0;border:0;background:none;color:var(--j);display:grid;grid-template-columns:1fr 24px;gap:16px;align-items:center;text-align:left;font:600 15px/1.35 Poppins,sans-serif}.faq-q i{font-style:normal;font-size:21px;transition:transform .3s var(--e)}.faq-item.open .faq-q i{transform:rotate(45deg)}.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--e)}.faq-a>div{overflow:hidden}.faq-a p{padding:0 0 22px;margin:0;color:var(--lm);font-size:14px}.faq-item.open .faq-a{grid-template-rows:1fr}.inline-fields{display:grid;grid-template-columns:100px 1fr;gap:8px}.content-list{margin-top:38px;border-top:1px solid var(--ll)}.content-row{padding:22px 0;border-bottom:1px solid var(--ll)}.content-row span{color:var(--g2);font:600 9px Poppins,sans-serif;letter-spacing:.12em}.content-row h3{margin:9px 0 7px;font:600 19px Poppins,sans-serif;letter-spacing:-.035em}.content-row p{margin:0;color:var(--lm);font-size:14px}.dark-list{border-color:var(--dl)}.dark-list .content-row{border-color:var(--dl)}.dark-list .content-row span{color:var(--g)}.dark-list .content-row p{color:var(--dm)}'''
          faq_js="""document.querySelectorAll('.faq-item').forEach(item=>{const q=item.querySelector('.faq-q');q.onclick=()=>{const open=item.classList.contains('open');item.classList.toggle('open',!open);q.setAttribute('aria-expanded',String(!open))}});"""

          # ---------- Creator Access ----------
          p=Path('creators.html'); h=p.read_text()
          h=h.replace('</style>',shared_css+'</style>',1)
          h=h.replace('Standout profiles receive a VIP pass for all three days; approved creators receive Day 3 access.','Standout profiles receive a VIP pass for all three days; other approved creators receive Day 3 access.')
          old_form='''<div class="field"><label for="creator-platform">Instagram, YouTube or Creator Profile *</label><select id="creator-platform" name="platform" required><option value="">Choose platform</option><option>Instagram</option><option>YouTube</option><option>Other creator profile</option></select><input name="profile" required placeholder="Paste link or @handle"></div><button class="submit" type="submit">Submit Creator Profile →</button>'''
          new_form='''<div class="field"><label for="creator-profile">Instagram, YouTube or Creator Profile *</label><input id="creator-profile" name="profile" required type="url" placeholder="Paste your public profile link"></div><div class="field"><label for="creator-city">City / Country *</label><input id="creator-city" name="city" required placeholder="Ahmedabad, India"></div><div class="field"><label for="creator-category">Content Category *</label><select id="creator-category" name="category" required><option value="">Select category</option><option>Food / Culinary</option><option>Travel / Culture</option><option>Lifestyle / Hospitality</option><option>Agriculture / Business</option><option>Regional-language</option><option>Photographer / Videographer</option></select></div><button class="submit" type="submit">Request Creator Access →</button><p class="doc-note">No login. No OTP. Your profile link is used to verify content quality, relevance and engagement. By applying, you agree to be contacted by the BIRC team regarding this program.</p>'''
          if old_form not in h: raise SystemExit('creator form marker missing')
          h=h.replace(old_form,new_form)
          start=h.index('<section class="faq-section pad">')
          end=h.index('</section>',start)+10
          creator_faq='''<section class="faq-section pad"><header class="head"><span class="eye">Before you apply</span><h2 class="section-title">Quick Answers.</h2></header><div class="faq-items"><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">How is the VIP Creator Pass decided?<i>+</i></button><div class="faq-a"><div><p>Profiles are scored on content quality and originality, audience relevance, follower strength, engagement and average views, consistency and professionalism.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">What if I do not qualify for VIP?<i>+</i></button><div class="faq-a"><div><p>Approved creators who do not meet the VIP score receive a Day 3 Creator Pass for 25 October 2026.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">Does follower count alone decide the pass?<i>+</i></button><div class="faq-a"><div><p>No. Follower count is one parameter; authentic engagement, content quality, relevance and consistency are considered together.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">Does applying guarantee creator access?<i>+</i></button><div class="faq-a"><div><p>No. All applications are reviewed. Approved profiles receive either VIP all-three-day access or Day 3 access.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">What content will I need to create?<i>+</i></button><div class="faq-a"><div><p>Selected creators will receive a clear content brief and access details before the event.</p></div></div></article></div></section>'''
          h=h[:start]+creator_faq+h[end:]
          h=h.replace("Platform: ${d.get('platform')}\nProfile: ${d.get('profile')}","Profile: ${d.get('profile')}\nCity / Country: ${d.get('city')}\nContent category: ${d.get('category')}")
          h=h.replace('</script>',faq_js+'</script>',1)
          p.write_text(h)

          # ---------- Rice Masterchef ----------
          p=Path('rice-masterchef.html'); h=p.read_text()
          h=h.replace('</style>',shared_css+'''.eligibility{padding:96px var(--p);background:var(--j2)}.eligibility .eye{color:var(--g)}.eligibility p{color:var(--dm)}.chef-process{padding:96px var(--p);background:var(--l);color:var(--j)}'''+'</style>',1)
          insert_before='<section class="master-apply" id="masterchef-apply">'
          missing_master='''<section class="eligibility"><span class="eye">Built for the right creators</span><h2 class="section-title" style="margin-top:22px">If Rice Is Your Canvas, This Stage Is for You.</h2><p style="margin-top:20px">Follower count is considered, but relevance, originality, engagement quality and consistency determine the complete creator score.</p><div class="content-list dark-list"><article class="content-row"><span>01</span><h3>Cooking Creators</h3><p>Cooking influencers, home chefs and culinary creators.</p></article><article class="content-row"><span>02</span><h3>Original Rice Dish</h3><p>Creators with an original signature rice dish.</p></article><article class="content-row"><span>03</span><h3>Live Presentation</h3><p>Confident cooks comfortable presenting their process live.</p></article><article class="content-row"><span>04</span><h3>Food Storytelling</h3><p>Food storytellers ready to create competition-led content.</p></article></div></section><section class="chef-process"><span class="eye" style="color:var(--g2)">Simple by design</span><h2 class="section-title" style="margin-top:22px">From Application to Access.</h2><div class="content-list"><article class="content-row"><span>01</span><h3>Enter Your Dish</h3><p>Share your profile and the name of your signature rice dish.</p></article><article class="content-row"><span>02</span><h3>Entry and Profile Review</h3><p>The team reviews cooking skill, originality and your complete creator score.</p></article><article class="content-row"><span>03</span><h3>Receive Your Result</h3><p>Shortlisted entrants receive the competition brief and confirmed access tier on WhatsApp.</p></article></div></section>'''
          if insert_before not in h: raise SystemExit('master insert marker missing')
          h=h.replace(insert_before,missing_master+insert_before)
          old_master_form='''<div class="field"><label for="chef-email">Email</label><input id="chef-email" name="email" type="email" placeholder="you@example.com"></div><div class="field"><label for="dish-name">Signature Rice Dish *</label><input id="dish-name" name="dish" required placeholder="Dish name"></div><button class="submit" type="submit">Enter the Competition →</button>'''
          new_master_form='''<div class="field"><label for="chef-email">Email *</label><input id="chef-email" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="chef-profile">Cooking Profile or Best Cooking Video *</label><input id="chef-profile" name="profile" type="url" required placeholder="Instagram, YouTube, Drive or website link"></div><div class="field"><label for="chef-city">City / Country *</label><input id="chef-city" name="city" required placeholder="Ahmedabad, India"></div><div class="field"><label for="dish-name">Your Signature Rice Dish *</label><input id="dish-name" name="dish" required placeholder="Dish name"></div><button class="submit" type="submit">Submit My Entry →</button><p class="doc-note">No login. No OTP. Your profile link is used to verify content quality, relevance and engagement. By applying, you agree to be contacted by the BIRC team regarding this program.</p>'''
          if old_master_form not in h: raise SystemExit('master form marker missing')
          h=h.replace(old_master_form,new_master_form)
          faq='''<section class="faq-section pad"><header class="head"><span class="eye">Before you apply</span><h2 class="section-title">Quick Answers.</h2></header><div class="faq-items"><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">Who can apply?<i>+</i></button><div class="faq-a"><div><p>Cooking influencers, home chefs and culinary creators with an original rice dish can apply.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">How do I receive VIP access?<i>+</i></button><div class="faq-a"><div><p>The highest-scoring creator profiles receive a VIP pass for all three days. The score considers content quality, audience relevance, followers, engagement, average views and consistency.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">What if I am not selected for VIP?<i>+</i></button><div class="faq-a"><div><p>Approved competition creators who do not meet the VIP score receive access for Day 3.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">Does applying confirm my competition place?<i>+</i></button><div class="faq-a"><div><p>No. The BIRC team will shortlist entries and contact selected participants directly.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">When will I receive the competition rules?<i>+</i></button><div class="faq-a"><div><p>Shortlisted creators will receive the detailed format, schedule and participation requirements on WhatsApp.</p></div></div></article></div></section>'''
          h=h.replace('</section></main>',faq+'</section></main>',1)
          h=h.replace('Signature dish: ${d.get(\'dish\')}','Profile / video: ${d.get(\'profile\')}\nCity / Country: ${d.get(\'city\')}\nSignature dish: ${d.get(\'dish\')}')
          h=h.replace('</script>',faq_js+'</script>',1)
          p.write_text(h)

          # ---------- Rice Art Showcase ----------
          p=Path('artists.html'); h=p.read_text()
          artist_css='''.source-visual{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--j2);margin-top:34px}.why-art{background:var(--j2)}.why-art .eye{color:var(--g)}.why-art p{color:var(--dm)}.momentum{background:var(--l);color:var(--j)}.journey{background:var(--j2)}.journey .eye{color:var(--g)}.journey p{color:var(--dm)}.artist-faq{background:var(--l);color:var(--j)}'''
          h=h.replace('</style>',shared_css+artist_css+'</style>',1)
          marker='<section class="apply pad" id="apply">'
          missing_art='''<section class="why-art pad"><span class="eye">Why BIRC 2026?</span><h2 class="section-title" style="margin-top:22px">Put Your Work in a Room That Reaches the World.</h2><p style="margin-top:22px">BIRC brings the international rice ecosystem to New Delhi. Your work enters a rare meeting point between art, culture, commerce, material innovation, media and global industry.</p><img class="source-visual" src="https://birc.in/images/rice-art/global-pavilion.webp" alt="Rice Art Showcase exhibition room"><div class="content-list dark-list"><article class="content-row"><span>01</span><h3>Be Discovered Internationally</h3><p>Put your work before an audience connected to 120+ countries on a platform built around the global rice ecosystem.</p></article><article class="content-row"><span>02</span><h3>Meet People Beyond Galleries</h3><p>Start conversations with businesses, buyers, brands, industry leaders, media, creators and material innovators.</p></article><article class="content-row"><span>03</span><h3>Turn Materials Into Opportunity</h3><p>Show how rice-based art and design can become commissions, collections, products, interiors, collaborations or public installations.</p></article><article class="content-row"><span>04</span><h3>Build Visible Proof</h3><p>Create a credible international showcase moment for your portfolio, proposals, press, social storytelling and future exhibitions.</p></article></div></section><section class="momentum pad"><span class="eye" style="color:var(--g2)">How to take advantage</span><h2 class="section-title" style="margin-top:22px">Arrive With Art. Leave With Momentum.</h2><p style="color:var(--lm);margin-top:22px">The strongest showcase is not only a display. It is a story, a conversation starter and a bridge to whatever you want to create next.</p><div class="content-list"><article class="content-row"><span>01 · Before BIRC</span><h3>Build the Story</h3><p>Define the rice connection, show the transformation through process material, and prepare the next step you want from the showcase.</p></article><article class="content-row"><span>02 · At BIRC</span><h3>Make the Work Easy to Understand</h3><p>Bring process photos, samples or a short making film so audiences can see how rice becomes the final piece.</p></article><article class="content-row"><span>03 · After BIRC</span><h3>Carry the Momentum Forward</h3><p>Use the international showcase moment for commissions, orders, collaborations, media coverage and future exhibitions.</p></article></div></section><section class="journey pad"><span class="eye">From idea to exhibition</span><h2 class="section-title" style="margin-top:22px">Your Path to the Showcase.</h2><p style="margin-top:22px">A considered curatorial journey designed to help the strongest ideas arrive at BIRC ready to be experienced.</p><div class="content-list dark-list"><article class="content-row"><span>01</span><h3>Share Your Work</h3><p>Submit your portfolio, concept and the clearest preview available.</p></article><article class="content-row"><span>02</span><h3>Curatorial Review</h3><p>The BIRC team reviews originality, craftsmanship, relevance and presentation.</p></article><article class="content-row"><span>03</span><h3>Shape the Showcase</h3><p>Selected artists coordinate scale, display needs and final presentation.</p></article><article class="content-row"><span>04</span><h3>Meet the World</h3><p>Your work enters a global rice platform at Bharat Mandapam, New Delhi.</p></article></div><p class="doc-note" style="color:var(--dm)">Selection considers originality, relationship to rice, craftsmanship, storytelling, safety and feasibility within the exhibition space.</p></section>'''
          if marker not in h: raise SystemExit('artist insert marker missing')
          h=h.replace(marker,missing_art+marker)
          form_start=h.index('<form class="form" id="artistForm">')
          form_end=h.index('</form>',form_start)+7
          full_form='''<form class="form" id="artistForm"><div class="field"><label for="artist-name">Full Name *</label><input id="artist-name" name="name" required></div><div class="field"><label for="artist-email">Email Address *</label><input id="artist-email" name="email" type="email" required></div><div class="field"><label for="artist-phone">WhatsApp / Phone *</label><input id="artist-phone" name="phone" type="tel" required placeholder="+91"></div><div class="field"><label for="artist-city">City &amp; Country *</label><input id="artist-city" name="city" required></div><div class="field"><label for="artist-path">Art Format *</label><select id="artist-path" name="path" required><option value="">Select a format</option><option>Fine art / grain mosaic / painting</option><option>Sculpture / dimensional art</option><option>Furniture / lighting / functional object</option><option>Craft / jewellery / artisan work</option><option>Fashion / textile / wearable art</option><option>Architecture / interior / material design</option><option>Installation / spatial experience</option><option>Culinary / edible / sensory art</option><option>Photography / film / digital / performance</option><option>Experimental / another form</option></select></div><div class="field"><label for="artist-title">Artwork Title *</label><input id="artist-title" name="title" required></div><div class="field"><label for="artist-preview">Artwork Preview Link *</label><input id="artist-preview" name="preview" type="url" required placeholder="Drive, website or public social link"></div><div class="field"><label for="artist-work">Tell Us About the Work *</label><textarea id="artist-work" name="work" required placeholder="The idea, rice material used, how it is made, and what it should make people feel."></textarea></div><div class="field"><label for="artist-size">Approximate Dimensions</label><input id="artist-size" name="size" placeholder="Optional"></div><div class="field"><label for="artist-portfolio">Portfolio or Social Profile</label><input id="artist-portfolio" name="portfolio" type="url"></div><label style="display:flex;gap:10px;font-size:13px"><input type="checkbox" name="confirm" required style="width:18px;height:18px">I confirm this is my work or concept, and agree to be contacted about the BIRC Rice Art Showcase.</label><button class="submit" type="submit">Continue — Verify on WhatsApp →</button><p class="doc-note">Free to apply. Shortlisted artists are contacted with display and participation details.</p><div id="artistStatus" role="status"></div></form>'''
          h=h[:form_start]+full_form+h[form_end:]
          faq='''<section class="artist-faq pad"><span class="eye" style="color:var(--g2)">Still wondering if you qualify?</span><h2 class="section-title" style="margin-top:22px">Do Not Rule Yourself Out.</h2><div class="faq-items" style="margin-top:38px"><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">My work is a product or furniture piece. Can I apply?<i>+</i></button><div class="faq-a"><div><p>Yes. Functional objects, furniture, décor, lighting, surfaces and product design are welcome when rice or a rice-derived component is essential to the material, process or story.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">I use husk, straw, bran or starch. Does it count?<i>+</i></button><div class="faq-a"><div><p>Absolutely. The showcase includes rice grain, paddy, husk, bran, straw, flour, starch, paper, fibre, broken rice, bio-composites and other rice-linked materials or by-products.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">Can a business, studio, collective or institute apply?<i>+</i></button><div class="faq-a"><div><p>Yes. Applications are open to individual artists as well as studios, craft businesses, furniture and product brands, collectives, students, institutes, designers and experimental makers.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">What if the artwork is still only a concept?<i>+</i></button><div class="faq-a"><div><p>You may submit a strong concept with a clear sketch, render, prototype or reference. Explain how rice is used, the proposed scale and what the audience will experience.</p></div></div></article><article class="faq-item"><button class="faq-q" type="button" aria-expanded="false">I do not fit any listed category. Should I still apply?<i>+</i></button><div class="faq-a"><div><p>Yes. The categories are examples, not restrictions. If rice or its ecosystem is central to the work, use Experimental / another form and show us what we missed.</p></div></div></article></div></section>'''
          h=h.replace('</section></main>',faq+'</section></main>',1)
          h=h.replace("Email: ${d.get('email')}\nPathway: ${d.get('path')}\nWork: ${d.get('work')}","Email: ${d.get('email')}\nWhatsApp: ${d.get('phone')}\nCity / Country: ${d.get('city')}\nFormat: ${d.get('path')}\nArtwork title: ${d.get('title')}\nPreview: ${d.get('preview')}\nWork: ${d.get('work')}\nDimensions: ${d.get('size')}\nPortfolio: ${d.get('portfolio')}")
          h=h.replace('</script>',faq_js+'</script>',1)
          p.write_text(h)

          # ---------- Context ----------
          p=Path('context.md'); c=p.read_text()
          note='''\n## Supplied influencer source documents audit (2026-08-08)\n\nThe mobile Content Creators, Rice Masterchef, and Artists pages were checked against the three supplied BIRC source documents. Missing approved application fields, qualification details, process steps, access rules, FAQs, Rice Art opportunity sections, curatorial journey, and Why BIRC content were added. Desktop files were not changed.\n'''
          if '## Supplied influencer source documents audit (2026-08-08)' not in c:
              p.write_text(c.rstrip()+note)
          PY
      - name: Commit mobile source sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creators.html rice-masterchef.html artists.html context.md
          git commit -m "Add missing approved content to mobile influencer pages"
          git push
