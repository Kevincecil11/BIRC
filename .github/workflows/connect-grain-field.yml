name: Connect Grain Field
on:
  push:
    branches: [main]
    paths: [.github/workflows/connect-grain-field.yml]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect Grain Field assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-experience.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="assets/experience-grain-field.css">'
          js='<script src="assets/experience-grain-field.js"></script>'
          if css not in s: s=s.replace('</head>',css+'</head>')
          if js not in s: s=s.replace('</body>',js+'</body>')
          p.write_text(s)
          PY
          rm .github/workflows/connect-grain-field.yml
      - name: Commit connected page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-experience.html .github/workflows/connect-grain-field.yml
          git commit -m "Connect Grain Field Experience page"
          git push origin main
