name: Inline Partnership Final
on:
  push:
    paths:
      - '.github/workflows/inline-partnership-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline final CSS and JS into Partnership HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-partnership.html')
          s=p.read_text()
          css=Path('assets/partnership-inline-benefits-0009.css').read_text()
          js=Path('assets/partnership-inline-benefits-0009.js').read_text()
          s=s.replace('<link rel="stylesheet" href="assets/partnership-inline-benefits-0009.css">','')
          s=s.replace('<script src="assets/partnership-inline-benefits-0009.js"></script>','')
          marker='partnership-inline-final-0011'
          if marker not in s:
              s=s.replace('</head>',f'<style id="{marker}">{css}</style></head>',1)
              s=s.replace('</body>',f'<script id="{marker}-script">{js}</script></body>',1)
          p.write_text(s)
          Path('.github/workflows/inline-partnership-final.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-partnership.html .github/workflows/inline-partnership-final.yml
          git commit -m 'Inline final Partnership tier benefits'
          git push
