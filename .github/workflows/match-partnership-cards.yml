name: Match Partnership card styles

on:
  push:
    paths:
      - '.github/workflows/match-partnership-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify sponsorship card surfaces and borders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('partnership.html')
          s=p.read_text()
          css='''/* Unified package and opportunity cards */.wf-tier-card,.wf-opp-card{background:var(--l)!important;border:1px solid var(--j)!important;box-shadow:none!important;padding:14px!important;outline:none!important}.wf-tier-card summary,.wf-opp-card summary{min-height:150px!important}.wf-tier-card[open],.wf-opp-card[open]{background:var(--l)!important;border-color:var(--j)!important}.wf-tier-card:focus-within,.wf-opp-card:focus-within{outline:none!important}.wf-tier-card summary:focus-visible,.wf-opp-card summary:focus-visible{outline:3px solid var(--g);outline-offset:3px}.wf-tier-toggle,.wf-opp-toggle{margin-top:auto!important;border:0!important;background:var(--j)!important;color:var(--l)!important;min-height:44px!important;display:grid!important;place-items:center!important}.wf-tier-card[open] .wf-acc-body,.wf-opp-card[open] .wf-acc-body{border-top:1px solid var(--ll)!important}.wf-tier-card .wf-h,.wf-opp-card .wf-h{color:var(--j)}'''
          if '/* Unified package and opportunity cards */' not in s:
              s=s.replace('</style></head>',css+'</style></head>',1)
          p.write_text(s)
          PY
      - name: Update context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('context.md');s=p.read_text()
          note='Partnership card rule: Sponsorship Package cards and Special Opportunity cards must use the exact same linen background, one-pixel ink border, shadow-free surface, black action bar, expanded divider, and keyboard focus treatment.'
          if note not in s:s=s.replace('## 7. Design decisions that must persist',note+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partnership.html context.md
          git commit -m 'Match sponsorship cards to special opportunities'
          git push
