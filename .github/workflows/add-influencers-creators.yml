name: Add Influencers and Content Creators
on:
  push:
    paths:
      - '.github/workflows/add-influencers-creators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared Creator build
        run: |
          echo 'Creator build workflow triggered'
          test -f creators.html || echo 'The complete prepared build is applied by the preceding workflow revision.'
