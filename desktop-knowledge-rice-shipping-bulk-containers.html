<!doctype html><html><head><meta charset="utf-8"><script>if(!matchMedia('(min-width:900px)').matches)location.replace('conference.html')</script><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="assets/knowledge-sessions.css"></head><body><script>KS={num:'04',day:'Day 1',track:'Shipping, Bulk & Containers',title:'Bulk and Container Shipping: Protecting Margins, Cargo and Contracts',tag:'The margin can disappear between the contract and the port.',image:'https://birc.in/images/knowledge-sessions/s04-shipping.webp',intro:['Freight volatility, container shortages, vessel delays, congestion, cargo damage and unclear contractual responsibility can change the economics of a rice shipment after the sale appears complete.','This session will connect commercial planning with shipping execution, comparing bulk and container movement while examining the decisions that protect landed cost, cargo integrity and contractual position.'],why:'Shipping is not a back-office step. It affects price competitiveness, working capital, delivery performance and the buyer relationship. Teams that understand responsibilities, charges, documents and contingency options can identify exposure before it becomes demurrage, deterioration or a dispute.',scope:['Bulk versus container economics: Shipment size, frequency, handling, route availability, product protection and total landed cost.','Freight quotations: Base rate, surcharges, free time, detention, demurrage, port costs and the assumptions that should be confirmed in writing.','Incoterms and responsibility: Aligning price terms with control over freight, insurance, documents, risk transfer and destination handling.','Vessel and container planning: Equipment availability, booking windows, cut-off dates, rollovers, trans-shipment and schedule reliability.','Cargo protection: Moisture, infestation, contamination, fumigation, bag strength, container condition, ventilation and survey evidence.','Bulk-shipping documents and chartering concepts: Nomination, laytime, notice of readiness, bills of lading and common sources of disagreement.','Insurance and claims: Insured interests, survey reports, timely notice, mitigation duties and evidence needed after loss or damage.','Contingency planning: Alternate ports, routes, carriers, buffer time, communication protocols and escalation when disruption occurs.'],take:['A clearer basis for choosing bulk or container movement by transaction.','A freight-cost checklist that captures more than the headline rate.','Better alignment between Incoterms, contracts, insurance and operational control.','A cargo-readiness checklist for quality protection and claim evidence.','A disruption-response framework for delays, rolled bookings and port problems.'],attends:['Rice exporters, importers and international buyers','Logistics, export documentation and supply-chain teams','Freight forwarders, shipping lines and port-service providers','Marine insurers, surveyors and claims professionals','Commercial, finance and contract-management teams'],panel:['Bulk-shipping or chartering specialist','Container carrier or freight-forwarding leader','Marine surveyor or cargo insurer','Exporter or buyer responsible for high-volume shipments'],faq:[['Will the session say whether bulk or containers are always cheaper?','No. The better option depends on volume, route, frequency, port capability, handling requirements, risk and the complete landed-cost calculation.'],['Will Incoterms be explained?','The session should explain the commercial implications of commonly used terms, especially how responsibility, cost and risk are allocated. It is not a substitute for transaction-specific legal advice.'],['Will cargo-damage prevention be covered?','Yes. Packaging, container condition, moisture, fumigation, inspection and evidence preservation should form a practical part of the discussion.']],close:['Protect the margin from mill gate to destination.','Attend this BIRC 2026 Knowledge Session and make shipping decisions with clearer cost, risk and contractual control.']}</script><script src="assets/knowledge-render.js"></script></body></html>
