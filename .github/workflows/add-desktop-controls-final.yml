name: Remove shared desktop editor completely

on:
  push:
    paths:
      - '.github/workflows/add-desktop-controls-final.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove editor from every desktop page and repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          tags = [
              '<script src="assets/birc-layout-editor.js" defer></script>',
              '<script src="assets/birc-layout-editor-upgrade.js" defer></script>',
          ]
          pages = [p for p in Path('.').glob('desktop*.html') if p.is_file()]
          assert len(pages) == 13, f'Expected 13 desktop pages, found {len(pages)}'
          removed = 0
          for page in pages:
              html = page.read_text()
              before = html
              for tag in tags:
                  html = html.replace(tag, '')
              if html != before:
                  removed += 1
                  page.write_text(html)
          assert removed == 13, f'Expected editor tags on 13 pages, removed from {removed}'

          context = Path('context.md')
          text = context.read_text()
          text, count = re.subn(r'\n### Private desktop layout editor\n\n.*?(?=\n### Left alignment is a standing rule)', '', text, count=1, flags=re.S)
          assert count == 1, f'Expected one editor context section, found {count}'
          context.write_text(text)

          for filename in ('assets/birc-layout-editor.js','assets/birc-layout-editor-upgrade.js','tools/install_layout_editor.py'):
              f = Path(filename)
              assert f.exists(), f'Missing {filename}'
              f.unlink()
          PY
      - name: Commit complete removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A desktop*.html context.md assets/birc-layout-editor.js assets/birc-layout-editor-upgrade.js tools/install_layout_editor.py
          git commit -m "Remove shared desktop layout editor completely"
          git push
