name: Fix desktop controls and registration roles

on:
  push:
    paths:
      - 'assets/desktop-controls.css'
      - 'assets/desktop-controls.js'
      - '.github/workflows/fix-desktop-controls-and-registration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link resilient controls to every desktop page
        run: |
          python - <<'PY'
          from pathlib import Path
          css='<link rel="stylesheet" href="assets/desktop-controls.css">'
          js='<script src="assets/desktop-controls.js"></script>'
          changed=[]
          for path in sorted(Path('.').glob('desktop*.html')):
              text=path.read_text(encoding='utf-8')
              original=text
              if css not in text:
                  if '</head>' not in text: raise RuntimeError(f'Missing head in {path}')
                  text=text.replace('</head>',css+'</head>',1)
              if js not in text:
                  if '</body>' not in text: raise RuntimeError(f'Missing body in {path}')
                  text=text.replace('</body>',js+'</body>',1)
              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(path.name)
          print('Linked shared controls to',len(changed),'desktop pages')
          for name in changed: print(name)
          PY
      - name: Add the 01 02 03 horizontal role selector to registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('register.html')
          s=p.read_text(encoding='utf-8')
          marker='<div class="steps"><span class="dot active" id="d1">1</span><span class="line" id="ln"></span><span class="dot" id="d2">2</span></div>'
          roles='<nav class="role-row" aria-label="Registration type"><a data-role="visitor" href="register.html?type=visitor"><b>01</b><span>Visitor</span></a><a data-role="exhibitor" href="register.html?type=exhibitor"><b>02</b><span>Exhibitor</span></a><a data-role="buyer" href="register.html?type=buyer"><b>03</b><span>Buyer</span></a></nav>'
          if roles not in s:
              if marker not in s: raise RuntimeError('Registration step marker missing')
              s=s.replace(marker,marker+roles,1)
          style='''<style id="registration-role-row">\n.role-row{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:22px;background:var(--ll);border:1px solid var(--ll)}\n.role-row a{min-height:58px;padding:0 14px;display:flex;align-items:center;gap:12px;background:var(--l);color:var(--lm);text-decoration:none;font:600 12px Poppins,sans-serif}\n.role-row a b{width:28px;height:28px;display:grid;place-items:center;background:#e4dac9;color:var(--lm);font-size:9px}\n.role-row a.active{background:var(--j);color:var(--l)}\n.role-row a.active b{background:var(--g);color:var(--j)}\n@media(max-width:899px){.head{padding-bottom:22px}.role-row{margin-top:24px}.role-row a{min-height:54px;padding:0 8px;display:grid;place-items:center;gap:2px;text-align:center}.role-row a b{width:24px;height:24px}.role-row a span{font-size:10px}}\n</style>'''
          if 'id="registration-role-row"' not in s:
              s=s.replace('</head>',style+'</head>',1)
          activation="document.querySelectorAll('.role-row a').forEach(a=>a.classList.toggle('active',a.dataset.role===type));"
          anchor="title.textContent=labels[type]+' Registration';"
          if activation not in s:
              if anchor not in s: raise RuntimeError('Registration type initializer missing')
              s=s.replace(anchor,anchor+activation,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired controls
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop*.html register.html
          git commit -m 'Repair desktop countdown register chooser and role selector'
          git push origin main
