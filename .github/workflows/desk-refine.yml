name: Desktop refine pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/desk-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refine pass
        run: |
          python3 - <<'PY'
          import re, os, sys

          COMMON = '''
          main.page section,main.page section>header,main.page .head,main.page .eye,main.page h1,main.page h2,main.page h3,main.page h4,main.page p,main.page ul,main.page li,main.page address,main.page form,main.page form header{text-align:left!important}
          main.page .section-title,main.page h1.title,main.page h2.title{margin-left:0!important;margin-right:0!important;max-width:26ch}
          main.page p.lead{margin-left:0!important;margin-right:0!important;max-width:68ch}
          main.page .head{margin-left:0!important;margin-right:0!important}
          main.page .btn{margin-left:0!important}
          .form,.master-form,.faq-items,.faq,.stats,.master-stats{margin-left:0!important;margin-right:0!important}
          '''

          def gold_form(sel):
              return '''
          SEL{background:#ebb341!important;color:#0d0d0b!important}
          SEL .eye{color:#7a5405!important}
          SEL .section-title,SEL>h2,SEL>h3,SEL .form h3{color:#0d0d0b!important}
          SEL>p,SEL .lead{color:#2b2b27!important}
          SEL .form{background:#faf0e6!important;border:1px solid #d8cec3!important;padding:44px!important;margin-top:34px!important;max-width:940px!important;margin-left:0!important;margin-right:0!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:0 28px!important;align-items:start}
          SEL .form>header{grid-column:1/-1;margin-bottom:6px}
          SEL .form .field{margin-bottom:22px;display:block!important}
          SEL .form .field:has(textarea){grid-column:1/-1}
          SEL .form label{display:block;margin-bottom:9px;color:#4a453e!important;font:600 10px Poppins,sans-serif!important;letter-spacing:.14em;text-transform:uppercase}
          SEL .form input,SEL .form select,SEL .form textarea{width:100%;padding:14px 15px!important;background:#fffaf2!important;border:1px solid #d8cec3!important;border-radius:0;color:#0d0d0b!important;font:400 15px Inter,sans-serif!important}
          SEL .form option{color:#0d0d0b;background:#fffaf2}
          SEL .form textarea{min-height:150px;resize:vertical}
          SEL .form input:focus,SEL .form select:focus,SEL .form textarea:focus{outline:2px solid #c98e25;outline-offset:2px;border-color:#c98e25!important}
          SEL .form input::placeholder,SEL .form textarea::placeholder{color:#8a837a!important}
          SEL .form>label{grid-column:1/-1;display:flex!important;align-items:flex-start;gap:10px;margin-bottom:6px;text-transform:none!important;letter-spacing:0!important;font:400 13px/1.55 Inter,sans-serif!important;color:#2b2b27!important}
          SEL .form input[type=checkbox]{width:18px!important;height:18px!important;padding:0!important;accent-color:#c98e25;flex:none;margin-top:2px}
          SEL .submit{grid-column:1/-1;width:auto!important;justify-self:start;min-height:56px;padding:0 40px!important;background:#0d0d0b!important;color:#faf0e6!important;border:0!important;font:600 12px Poppins,sans-serif!important;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s cubic-bezier(.16,1,.3,1)}
          SEL .submit:hover{background:#191916!important}
          SEL .doc-note{grid-column:1/-1;margin-top:4px;color:#4a453e!important;font-size:12px}
          SEL .status{grid-column:1/-1;color:#2b2b27!important}
          '''.replace('SEL', sel)

          MASTER = '''
          .moment,.winner,.master-score,.eligibility,.chef-process,.master-apply,.faq-section{padding:130px var(--desk-side)!important}
          .eligibility{background:#191916!important;color:#faf0e6!important}
          .eligibility .eye{color:#ebb341!important}
          .chef-process{background:#faf0e6!important;color:#0d0d0b!important}
          .chef-process .eye{color:#c98e25!important}
          .master-hero{min-height:88vh!important;padding:172px var(--desk-side) 88px!important}
          .master-hero .title{font-size:clamp(58px,4.9vw,88px)!important;max-width:15ch}
          .master-hero .lead{font-size:19px!important;max-width:56ch}
          .master-stats{max-width:760px}
          .moment-list,.winner-list,.content-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 52px}
          .moment-row,.winner-row,.content-row{min-height:158px}
          .master-passes{display:grid!important;grid-template-columns:1fr 1fr!important;gap:18px;max-width:1040px}
          .master-pass{padding:34px!important}
          .prize{border-left:0!important;border:1px solid #ebb341!important;padding:34px 38px!important;max-width:540px;margin:46px 0!important}
          .faq-items{max-width:1040px}
          ''' + gold_form('.master-apply') + '''
          .master-apply .master-form{background:#faf0e6!important}
          '''

          PLAN = '''
          .hero{min-height:80vh!important;padding:172px var(--desk-side) 88px!important}
          .hero .title{font-size:clamp(50px,4.2vw,78px)!important;max-width:20ch}
          .venue,.hotels,.travel,.faq-section{padding:130px var(--desk-side)!important}
          .venue-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 52px}
          .venue-row{min-height:132px}
          .map{max-width:none!important;height:360px!important}
          .hotel-list{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
          .hotel{min-height:206px}
          .travel-tabs{display:flex!important;flex-wrap:wrap;gap:10px;max-width:none!important}
          .travel-tab{flex:none!important}
          .travel-panel.active{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 52px;align-items:start}
          .travel-panel .tip{grid-column:1/-1}
          .travel-address{max-width:62ch}
          .faq{max-width:1040px}
          '''

          CONTACT = '''
          .hero{padding:172px var(--desk-side) 88px!important}
          .hero .title{font-size:clamp(58px,4.9vw,88px)!important}
          .intro,.official-contact,.form-section{padding:130px var(--desk-side)!important}
          .routes{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
          .route{min-height:186px}
          .contact-stack{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 52px}
          .contact-row{min-height:148px}
          .follow-links{display:flex!important;flex-wrap:wrap;gap:14px}
          .hours{max-width:56ch}
          ''' + gold_form('section.form-section')

          ARTISTS = '''
          .hero{padding:172px var(--desk-side) 88px!important}
          .manifesto,.materials,.language,.audience,.prize,.recognition,.why-art,.momentum,.journey,.apply,.artist-faq{padding:130px var(--desk-side)!important}
          .material-list,.content-list,.recognition-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 52px}
          .material,.content-row,.recognition-row{min-height:150px}
          .pathways{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
          .pathway{min-height:220px;padding:32px!important}
          .art-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
          .art-tile{min-height:214px}
          .art-tile.wide{grid-column:span 2}
          .prize-box{max-width:640px;margin-left:0!important}
          .stats{max-width:760px}
          .artist-faq{background:#faf0e6!important;color:#0d0d0b!important}
          .artist-faq .eye{color:#c98e25!important}
          .artist-faq .section-title{color:#0d0d0b!important}
          .artist-faq .faq-item{border-color:#d8cec3!important}
          .artist-faq .faq-q{color:#0d0d0b!important}
          .artist-faq .faq-a p{color:#6d6862!important}
          .faq-items{max-width:1040px}
          ''' + gold_form('#apply.apply')

          CREATORS = '''
          .access,.score,.process,.criteria,.faq-section{padding:130px var(--desk-side)!important}
          .form{max-width:940px!important;margin-left:0!important;margin-right:0!important}
          .faq-items{max-width:1040px;margin-left:0!important}
          ''' + gold_form('.apply')

          PAGES = {
            'desktop-rice-masterchef.html': ('rice-masterchef.html', MASTER),
            'desktop-plan-visit.html': ('plan-visit.html', PLAN),
            'desktop-contact.html': ('contact.html', CONTACT),
            'desktop-artists.html': ('artists.html', ARTISTS),
            'desktop-creators.html': ('creators.html', CREATORS),
          }

          for path, (mobile, css) in PAGES.items():
              if not os.path.exists(path):
                  print('MISSING', path); continue
              raw = open(path, encoding='utf-8').read()
              # 1. drop brittle nth-child path patches and any earlier refine sheet
              blocks = list(re.finditer(r'<style[^>]*>.*?</style>', raw, re.S))
              drop = []
              for b in blocks:
                  t = b.group(0)
                  if 'body > main:nth-child' in t or 'id="desk-refine"' in t:
                      drop.append(b)
              for b in reversed(drop):
                  raw = raw[:b.start()] + raw[b.end():]
              print(path, 'dropped', len(drop), 'patch blocks')
              # 2. fix mobile view link
              raw = re.sub(r'(<a class="mobile-switch" href=")[^"]*(")', r'\g<1>' + mobile + r'\g<2>', raw)
              # 3. append clean refine sheet
              sheet = '<style id="desk-refine">@media (min-width:900px){' + re.sub(r'\n\s+', '\n', css).strip() + '}</style>'
              raw = raw.replace('</head>', sheet + '</head>', 1)
              open(path, 'w', encoding='utf-8').write(raw)
              print(path, 'written', len(raw))
          PY
      - name: Commit
        run: |
          git config user.name 'birc-bot'
          git config user.email 'birc-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Desktop refine: left align, masterchef creators pattern, clean gold forms' || echo 'no changes'
          git push
