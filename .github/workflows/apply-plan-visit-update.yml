name: Apply Plan Visit and partnership updates
on:
  push:
    paths: ['.github/workflows/apply-plan-visit-update.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Plan Visit page
        run: |
          cat > plan-visit.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Plan Your Visit | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>
          :root{--j:#0d0d0b;--j2:#191916;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--m:#2b2b27;--dm:#aba49c;--lm:#6d6862;--dl:#35332e;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}body{margin:0;background:#211f1d;color:var(--l);font:400 16px/1.62 Inter,sans-serif;-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input{font:inherit}.page{width:min(100%,520px);margin:auto;background:var(--j);overflow:hidden}.light{background:var(--l);color:var(--j)}.pad{padding:96px var(--p)}.eye{font:600 10px/1 Poppins;letter-spacing:.18em;text-transform:uppercase}.title{font:600 clamp(42px,13vw,68px)/.91 Poppins;letter-spacing:-.065em;margin:0;text-wrap:balance}.section-title{font:600 clamp(36px,10vw,52px)/.96 Poppins;letter-spacing:-.055em;margin:0}.lead{font-weight:300;color:var(--dm);margin:0}.head{display:grid;gap:16px;margin-bottom:42px}.bar{position:fixed;z-index:80;top:0;left:50%;width:min(100%,520px);height:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;padding:0 var(--p);background:var(--j);border-bottom:1px solid var(--dl)}.logo{width:122px;height:48px;object-fit:contain;object-position:left}.menu{width:44px;height:44px;border:0;background:none;color:var(--l);padding:11px}.menu i{display:block;height:1px;background:currentColor;margin:6px 0}.drawer{position:fixed;z-index:100;inset:0;margin:auto;width:min(100%,520px);background:var(--j);padding:22px;display:flex;flex-direction:column;overflow:auto;transform:translateY(-102%);transition:transform .45s var(--e)}.drawer.open{transform:none}.drawer-top{display:flex;justify-content:space-between}.drawer nav{margin:auto 0}.drawer nav>a,.menu-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins;letter-spacing:-.05em;text-align:left}.submenu{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.submenu>div{overflow:hidden}.submenu.open{grid-template-rows:1fr;opacity:1}.submenu a{display:flex;justify-content:space-between;padding:11px 0 11px 18px;border-bottom:1px solid var(--dl);color:var(--dm);font:500 13px Poppins}.submenu a span{order:2;color:var(--g);font:600 9px Poppins}.drawer p,.drawer-social{color:var(--dm);font-size:13px}.drawer-social{display:flex;gap:7px;padding-top:18px;border-top:1px dashed var(--dl)}.x{width:44px;height:44px;border:1px solid var(--dl);background:none;color:var(--l)}.hero{min-height:88svh;padding:124px var(--p) 64px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,#ebb3412b,transparent 28%),repeating-linear-gradient(116deg,transparent 0 31px,#faf0e609 31px 32px)}.hero>*{position:relative}.hero .eye{color:var(--g);margin-bottom:24px}.hero .lead{font-size:18px;max-width:32ch;margin-top:24px}.hero-foot{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--dl);color:var(--dm);font:600 9px Poppins;text-transform:uppercase}.venue{background:var(--l);color:var(--j)}.venue-grid{border-block:1px solid var(--ll)}.venue-row{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--ll)}.venue-row:last-child{border:0}.venue-row h3{font:600 18px Poppins;margin:0}.venue-row p{color:var(--lm);font-size:13px;margin:3px 0 0}.venue-row strong{font:600 25px Poppins;color:var(--g2)}.map{height:230px;margin-top:36px;background:var(--j);position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:30px;border:1px solid var(--dl);background:repeating-linear-gradient(30deg,transparent 0 35px,#35332e 35px 36px)}.map:after{content:"Bharat Mandapam · Pragati Maidan · New Delhi";position:absolute;left:18px;bottom:15px;color:var(--dm);font:600 8px Poppins;letter-spacing:.12em;text-transform:uppercase}.btn{min-height:54px;padding:0 20px;background:var(--g);color:var(--j);display:flex;align-items:center;justify-content:center;font:600 12px Poppins;margin-top:20px}.hotels{background:var(--j);color:var(--l)}.hotel-list{border-top:1px solid var(--dl)}.hotel{display:flex;justify-content:space-between;padding:23px 0;border-bottom:1px solid var(--dl)}.hotel strong{font:600 18px Poppins}.hotel span{color:var(--dm)}.travel{background:var(--j2);color:var(--l)}.travel-address{color:var(--dm);margin-bottom:30px}.travel-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:22px;scrollbar-width:none}.travel-tab{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--dl);background:none;color:var(--dm);font:600 9px Poppins;text-transform:uppercase}.travel-tab.active{background:var(--g);color:var(--j);border-color:var(--g)}.travel-panel{display:none}.travel-panel.active{display:block}.route{border-top:1px solid var(--dl);padding:21px 0}.route h3{font:600 17px Poppins;margin:0}.route small{display:block;color:var(--g);margin:4px 0}.route p{color:var(--dm);font-size:13px;margin:0}.group{color:var(--g);font:600 10px Poppins;text-transform:uppercase;margin:26px 0 9px}.tip{padding:12px 0;border-top:1px solid var(--dl);color:var(--dm);font-size:13px}.faq-section{background:var(--l);color:var(--j)}.faq{border-top:1px solid var(--ll)}.faq button{width:100%;min-height:76px;border:0;border-bottom:1px solid var(--ll);background:none;color:var(--j);display:flex;justify-content:space-between;align-items:center;text-align:left;font:600 16px Poppins}.faq button span{font-size:21px;transition:transform .3s var(--e)}.faq.open button span{transform:rotate(45deg)}.answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--e)}.answer>div{overflow:hidden}.answer p{color:var(--lm);font-size:14px;margin:0;padding:0 0 22px}.faq.open .answer{grid-template-rows:1fr}.footer{padding:70px var(--p) 100px;background:var(--j);border-top:1px solid var(--dl)}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}.end{margin-top:40px;color:var(--dm);font-size:12px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header class="bar"><a href="index.html"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/birc-mark-white-solid.png" alt="BIRC"></a><button class="menu" id="openMenu" aria-label="Open menu"><i></i><i></i></button></header><aside class="drawer" id="drawer"><div class="drawer-top"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/birc-mark-white-solid.png" alt="BIRC"><button class="x" id="closeMenu">×</button></div><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a><div><button class="menu-parent" aria-expanded="true">Plan Visit <small>⌄</small></button><div class="submenu open"><div><a href="#venue">Venue & Location <span>01</span></a><a href="#hotels">Hotels <span>02</span></a><a href="#travel">How to Reach <span>03</span></a><a href="#faqs">FAQs <span>04</span></a></div></div></div><a href="#contact">Contact</a></nav><div class="drawer-social"><a href="#">Instagram</a><span>·</span><a href="#">LinkedIn</a></div><p>Bharat Mandapam, Pragati Maidan<br>New Delhi · 23–25 October 2026</p></aside><main class="page"><section class="hero"><span class="eye">Plan Your Visit</span><h1 class="title">Bharat Mandapam, Pragati Maidan, New Delhi</h1><p class="lead">Oct 23–25, 2026</p><div class="hero-foot"><span>Premium venue</span><span>50,000+ sqm infrastructure</span></div></section><section class="venue pad" id="venue"><header class="head"><span class="eye">Venue & Location</span><h2 class="section-title">Bharat Mandapam</h2></header><div class="venue-grid"><div class="venue-row"><div><h3>Exhibition Halls</h3><p>5 halls, 50,000+ sqm</p></div><strong>940+</strong></div><div class="venue-row"><div><h3>Conference Rooms</h3><p>Fully-equipped spaces</p></div><strong>30+</strong></div><div class="venue-row"><div><h3>Parking Facility</h3><p>Multi-level basement</p></div><strong>900+</strong></div><div class="venue-row"><div><h3>Food Courts</h3><p>Dining & cafeterias</p></div><strong>15+</strong></div></div><div class="map"></div><a class="btn" href="https://maps.google.com/?q=Bharat+Mandapam+Pragati+Maidan+New+Delhi">Open in Google Maps →</a></section><section class="hotels pad" id="hotels"><header class="head"><span class="eye">Stay nearby</span><h2 class="section-title">Hotels</h2></header><div class="hotel-list"><div class="hotel"><strong>Hotel A</strong><span>$$–$$$</span></div><div class="hotel"><strong>Hotel B</strong><span>$$</span></div></div><a class="btn" href="#">View All Hotels</a></section><section class="travel pad" id="travel"><header class="head"><span class="eye">Travel</span><h2 class="section-title">How to Reach Bharat Mandapam</h2></header><p class="travel-address">Pragati Maidan, Mathura Road, New Delhi – 110001</p><div class="travel-tabs"><button class="travel-tab active" data-mode="metro">Metro Rail</button><button class="travel-tab" data-mode="air">From Airport</button><button class="travel-tab" data-mode="rail">Railway Stations</button><button class="travel-tab" data-mode="bus">Bus Services</button><button class="travel-tab" data-mode="car">By Car / Taxi</button></div><div class="travel-panel active" data-panel="metro"><h3>Fastest & Most Convenient</h3><div class="group">Key Stations / Points</div><div class="route"><h3>Supreme Court Station (Blue Line)</h3><small>1.2 km · 5–7 min walk</small><p>Exit Gate 1 → Walk via Mathura Road → Enter Gate 10</p></div><div class="route"><h3>Indraprastha Station (Blue Line)</h3><small>1.1 km · 6–8 min walk</small><p>Exit Gate 1 → E-rickshaw or walk to main gate</p></div><div class="route"><h3>Mandi House (Blue + Violet)</h3><small>1.7 km · 10–12 min by auto</small><p>Interchange station for multiple lines</p></div><div class="route"><h3>ITO Station (Violet Line)</h3><small>1.6 km · 8–10 min by auto</small><p>Connect from Kashmere Gate or Central Secretariat</p></div><div class="group">Metro Routes from Key Locations</div><div class="route"><h3>IGI Airport</h3><small>~60 min · ₹60–80</small><p>Airport Express → New Delhi → Yellow Line → Blue Line</p></div><div class="route"><h3>New Delhi Rly Stn</h3><small>~15 min · ₹30–40</small><p>Yellow Line to Rajiv Chowk → Blue Line to Supreme Court</p></div><div class="group">Pro Tips</div><div class="tip">✦ Use smart card for faster entry</div><div class="tip">✦ Avoid peak hours (8–10 AM, 5–8 PM)</div><div class="tip">✦ Metro connects to Gate 10 directly</div></div><div class="travel-panel" data-panel="air"><h3>Indira Gandhi International (DEL)</h3><div class="group">Options from IGI</div><div class="route"><h3>Airport Express Metro</h3><small>~60 min · ₹60–80</small><p>Terminal 3 → New Delhi → Yellow Line → Blue Line to Supreme Court</p></div><div class="route"><h3>Taxi / Cab</h3><small>45–70 min · ₹600–900</small><p>Prepaid counters at all terminals. Drop at Gate 10, Mathura Road.</p></div><div class="route"><h3>Event Shuttle</h3><small>Scheduled service</small><p>150+ Innova cabs run for delegates during summit days.</p></div><div class="group">Pro Tips</div><div class="tip">✦ Distance from IGI is approximately 17 km</div><div class="tip">✦ Allow extra time during morning peak traffic</div></div><div class="travel-panel" data-panel="rail"><h3>Nearest major terminals</h3><div class="route"><h3>New Delhi Railway Station</h3><small>~5 km · 15 min by metro</small><p>Yellow Line to Rajiv Chowk → Blue Line to Supreme Court</p></div><div class="route"><h3>Hazrat Nizamuddin</h3><small>~5 km · 20 min by taxi</small><p>Direct road route via Mathura Road</p></div><div class="route"><h3>Old Delhi Railway Station</h3><small>~7 km · 25 min by metro</small><p>Yellow Line → Blue Line interchange at Rajiv Chowk</p></div><div class="group">Pro Tips</div><div class="tip">✦ Metro is faster than road during peak hours</div><div class="tip">✦ Prepaid autos available at all station exits</div></div><div class="travel-panel" data-panel="bus"><h3>DTC & cluster routes</h3><div class="route"><h3>Pragati Maidan Bus Stop</h3><small>Adjacent to Gate 10</small><p>Multiple DTC routes along Mathura Road</p></div><div class="route"><h3>Bhairon Marg Stop</h3><small>~800 m · 8 min walk</small><p>Connects to Ring Road services</p></div><div class="group">Pro Tips</div><div class="tip">✦ Use the DTC app for live route timings</div><div class="tip">✦ AC cluster buses run frequently on Mathura Road</div></div><div class="travel-panel" data-panel="car"><h3>Driving & parking</h3><div class="route"><h3>Entry via Gate 10, Mathura Road</h3><small>Main delegate entrance</small><p>Signage directs to visitor drop-off point</p></div><div class="route"><h3>Multi-level Basement Parking</h3><small>900+ capacity</small><p>Paid parking, entry from Bhairon Marg side</p></div><div class="route"><h3>App Cabs (Uber / Ola)</h3><small>Designated pickup zone</small><p>Follow signage to the cab bay near Gate 10</p></div><div class="group">Pro Tips</div><div class="tip">✦ Arrive early, parking fills by mid-morning</div><div class="tip">✦ Mathura Road is congested 5–8 PM</div></div></section><section class="faq-section pad" id="faqs"><header class="head"><span class="eye">Delegate help</span><h2 class="section-title">FAQs</h2></header><article class="faq"><button>Do I need a visa to attend? <span>+</span></button><div class="answer"><div><p>International delegates need a valid Indian business visa. BIRC issues invitation letters on request after registration is confirmed.</p></div></div></article><article class="faq"><button>Is accommodation included? <span>+</span></button><div class="answer"><div><p>Accommodation is not included with standard passes. Partner hotels offer discounted delegate rates, and select sponsorship tiers include hotel stays.</p></div></div></article><article class="faq"><button>What's the dress code? <span>+</span></button><div class="answer"><div><p>Business formal for conference sessions and ceremonies. Business casual is acceptable on the exhibition floor.</p></div></div></article></section></main><footer class="page footer" id="contact"><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a></div><div class="end">© 2026 Bharat International Rice Conference<br>Privacy · Terms · Code of Conduct</div></footer><script>const drawer=document.getElementById('drawer');function menu(open){drawer.classList.toggle('open',open);document.body.classList.toggle('lock',open)}openMenu.onclick=()=>menu(true);closeMenu.onclick=()=>menu(false);drawer.querySelectorAll('a').forEach(a=>a.onclick=()=>menu(false));document.querySelector('.menu-parent').onclick=e=>{const b=e.currentTarget,sub=document.querySelector('.submenu'),open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));sub.classList.toggle('open',!open)};document.querySelectorAll('.travel-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.travel-tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.travel-panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.mode))});document.querySelectorAll('.faq').forEach(f=>f.querySelector('button').onclick=()=>{const was=f.classList.contains('open');document.querySelectorAll('.faq').forEach(x=>x.classList.remove('open'));if(!was)f.classList.add('open')});addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});</script></body></html>
          HTML
      - name: Update Partnership cards, Exhibition labels, menus, and context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          # Partnership: restore cream section and gold outer frame like Special Opportunities reference.
          p=Path('partnership.html');s=p.read_text()
          css='''.dv-card>div:nth-child(3){background:var(--l)!important;border-color:var(--j)!important}.wf-tier-card,.wf-opp-card{background:var(--l)!important;border:1px solid var(--j)!important;box-shadow:none!important;padding:14px!important}.wf-tier-card:first-of-type,.wf-opp-card:first-of-type{outline:2px solid var(--g)!important;outline-offset:3px!important}.wf-tier-card summary,.wf-opp-card summary{min-height:150px!important}.wf-tier-toggle,.wf-opp-toggle{margin-top:auto!important;background:var(--j)!important;color:var(--l)!important;border:0!important;min-height:44px!important;display:grid!important;place-items:center!important}.wf-tier-card[open] .wf-acc-body,.wf-opp-card[open] .wf-acc-body{border-top:1px solid var(--ll)!important}.wf-tier-card:focus-within,.wf-opp-card:focus-within{outline-color:var(--g)!important}'''
          s=s.replace('</style></head>',css+'</style></head>',1);p.write_text(s)
          # Exhibition: remove all visual reference-caption labels below profiles.
          p=Path('exhibition.html');s=p.read_text();s=s.replace('<small>${p[0]} exhibitor at work</small>','');p.write_text(s)
          # Plan Visit submenu on every current page.
          group='''<div class="plan-menu-group"><button class="plan-menu-parent" type="button" aria-expanded="false">Plan Visit <small>⌄</small></button><div class="plan-submenu"><div><a href="plan-visit.html#venue">Venue & Location <span>01</span></a><a href="plan-visit.html#hotels">Hotels <span>02</span></a><a href="plan-visit.html#travel">How to Reach <span>03</span></a><a href="plan-visit.html#faqs">FAQs <span>04</span></a></div></div></div>'''
          css2='''.plan-menu-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins,sans-serif;letter-spacing:-.05em;text-align:left}.plan-submenu{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.plan-submenu>div{overflow:hidden}.plan-submenu.open{grid-template-rows:1fr;opacity:1}.plan-submenu a{display:flex!important;justify-content:space-between;padding:10px 0 10px 18px!important;border-bottom:1px solid var(--dl);color:var(--dm)!important;font:500 12px Poppins,sans-serif!important}.plan-submenu a span{order:2;color:var(--g);font:600 9px Poppins,sans-serif}.plan-menu-parent small{transition:transform .3s var(--e)}.plan-menu-parent[aria-expanded=true] small{transform:rotate(180deg)}'''
          js="""const planParent=document.querySelector('.plan-menu-parent'),planSub=document.querySelector('.plan-submenu');if(planParent&&planSub)planParent.addEventListener('click',()=>{const open=planParent.getAttribute('aria-expanded')==='true';planParent.setAttribute('aria-expanded',String(!open));planSub.classList.toggle('open',!open)});"""
          for name in ['index.html','about.html','conference.html','exhibition.html','experience.html','partnership.html']:
              p=Path(name);s=p.read_text()
              pats=[r'<a href="index\.html#visit">Plan Visit(?: <small>⌄</small>)?</a>',r'<a href="#visit">Plan Visit(?: <small>⌄</small>)?</a>',r'<a href="plan-visit\.html">Plan Visit</a>']
              done=False
              for pat in pats:
                  s,n=re.subn(pat,group,s,count=1)
                  if n:done=True;break
              if not done: raise SystemExit(f'Plan Visit link missing in {name}')
              if '.plan-menu-parent{' not in s:s=s.replace('</style>',css2+'</style>',1)
              if 'const planParent=' not in s:s=s.replace('</script></body></html>',js+'</script></body></html>',1)
              p.write_text(s)
          # Context
          p=Path('context.md');s=p.read_text()
          block='''\n### `plan-visit.html`\n\nDedicated Plan Visit page built from supplied content and `design.md`. Sections and submenu anchors: Venue & Location (`#venue`), Hotels (`#hotels`), How to Reach (`#travel`), and FAQs (`#faqs`). Travel includes Metro, Airport, Railway, Bus, and Car/Taxi tabs. All current site menus expose this four-item Plan Visit submenu.\n'''
          if '### `plan-visit.html`' not in s:s=s.replace('### `experience.html`',block+'\n### `experience.html`')
          s=s.replace('- Plan Visit: `index.html#visit`','- Plan Visit: expandable four-item submenu linking into `plan-visit.html`')
          rule='Partnership styling: Sponsorship Packages and Special Opportunities both use the cream section background and black one-pixel card frames; the first highlighted card in each group uses a gold outer outline. Do not make the Sponsorship Packages section black.'
          if rule not in s:s=s.replace('## 7. Design decisions that must persist',rule+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit all eight files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about.html conference.html exhibition.html experience.html partnership.html plan-visit.html context.md
          git commit -m 'Add Plan Visit page and finalize Partnership styling'
          git push
