name: Connect canonical zone order
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/connect-canonical-zone-order.yml'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect and cache-bust canonical zone assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ['index.html','desktop.html','experience.html']:
              p=Path(name);s=p.read_text()
              if 'experience-order.js' in s:
                  s=re.sub(r'assets/experience-order\.js(?:\?v=[^"\']+)?','assets/experience-order.js?v=20260817c',s)
              else:
                  s=s.replace('</body>','<script src="assets/experience-order.js?v=20260817c"></script></body>')
              p.write_text(s)
          p=Path('desktop-experience.html');s=p.read_text()
          s=re.sub(r'assets/experience-grain-field\.js(?:\?v=[^"\']+)?','assets/experience-grain-field.js?v=20260817c',s)
          if 'experience-grain-field.js' not in s:
              s=s.replace('</body>','<script src="assets/experience-grain-field.js?v=20260817c"></script></body>')
          p.write_text(s)
          Path('publish-refresh.html').write_text('<!doctype html><meta charset="utf-8"><title>BIRC publish marker</title><!-- canonical Experience Zone order and image mapping, 2026-08-17 13:42 IST -->')
          PY
          rm .github/workflows/connect-canonical-zone-order.yml
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html desktop.html experience.html desktop-experience.html publish-refresh.html .github/workflows/connect-canonical-zone-order.yml
          git commit -m "Apply canonical Experience Zone order and images everywhere"
          git push origin main
