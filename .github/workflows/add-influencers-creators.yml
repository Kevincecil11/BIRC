name: Add Influencers and Content Creators
on:
  push:
    paths: ['.github/workflows/add-influencers-creators.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Content Creators page
        run: |
          cat > creators.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0d0b"><title>Content Creators | BIRC 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><style>
          :root{--j:#0d0d0b;--j2:#191916;--l:#faf0e6;--g:#ebb341;--g2:#c98e25;--m:#2b2b27;--dm:#aba49c;--lm:#6d6862;--dl:#35332e;--ll:#d8cec3;--e:cubic-bezier(.16,1,.3,1);--p:22px}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}body{margin:0;background:#211f1d;color:var(--l);font:400 16px/1.62 Inter,sans-serif;-webkit-font-smoothing:antialiased}body.lock{overflow:hidden}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.page{width:min(100%,520px);margin:auto;background:var(--j);overflow:hidden}.light{background:var(--l);color:var(--j)}.pad{padding:96px var(--p)}.eye{font:600 10px/1 Poppins;letter-spacing:.18em;text-transform:uppercase}.title{font:600 clamp(43px,13.5vw,68px)/.91 Poppins;letter-spacing:-.067em;margin:0;text-wrap:balance}.section-title{font:600 clamp(35px,10vw,52px)/.96 Poppins;letter-spacing:-.055em;margin:0;text-wrap:balance}.lead{font-weight:300;color:var(--dm);margin:0}.head{display:grid;gap:16px;margin-bottom:42px}.bar{position:fixed;z-index:80;top:0;left:50%;width:min(100%,520px);height:72px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;padding:0 var(--p);background:var(--j);border-bottom:1px solid var(--dl)}.logo{width:158px;height:48px;object-fit:contain;object-position:left}.menu{width:44px;height:44px;border:0;background:none;color:var(--l);padding:11px}.menu i{display:block;height:1px;background:currentColor;margin:6px 0}.drawer{position:fixed;z-index:100;inset:0;margin:auto;width:min(100%,520px);background:var(--j);padding:22px;display:flex;flex-direction:column;overflow:auto;transform:translateY(-102%);transition:transform .45s var(--e)}.drawer.open{transform:none}.drawer-top{display:flex;justify-content:space-between}.drawer nav{margin:auto 0}.drawer nav>a,.nav-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins;letter-spacing:-.05em;text-align:left}.nav-sub{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.nav-sub>div{overflow:hidden}.nav-sub.open{grid-template-rows:1fr;opacity:1}.nav-sub a{display:flex;justify-content:space-between;padding:10px 0 10px 18px;border-bottom:1px solid var(--dl);color:var(--dm);font:500 12px Poppins}.nav-sub a span{order:2;color:var(--g);font:600 9px Poppins}.drawer p,.drawer-social{color:var(--dm);font-size:13px}.drawer-social{display:flex;gap:7px;padding-top:18px;border-top:1px dashed var(--dl)}.x{width:44px;height:44px;border:1px solid var(--dl);background:none;color:var(--l)}.hero{min-height:94svh;padding:124px var(--p) 64px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 83% 18%,#ebb34132,transparent 28%),repeating-linear-gradient(116deg,transparent 0 31px,#faf0e609 31px 32px)}.hero>*{position:relative}.hero .eye{color:var(--g);margin-bottom:24px}.hero .lead{font-size:18px;max-width:32ch;margin-top:26px}.hero .btn{margin-top:32px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:48px}.stat{padding:16px 10px;background:var(--j2);border:1px solid var(--dl)}.stat strong{display:block;color:var(--g);font:600 24px Poppins}.stat small{color:var(--dm);font:600 8px Poppins;text-transform:uppercase}.btn{min-height:56px;padding:0 20px;border:0;background:var(--g);color:var(--j);display:flex;align-items:center;justify-content:center;font:600 13px Poppins}.access{background:var(--l);color:var(--j)}.access-list{border-top:1px solid var(--ll)}.access-row{padding:27px 0;border-bottom:1px solid var(--ll)}.access-row span{color:var(--g2);font:600 9px Poppins}.access-row h3{font:600 21px Poppins;letter-spacing:-.04em;margin:8px 0}.access-row p{color:var(--lm);font-size:14px;margin:0}.score{background:var(--l);color:var(--j)}.score-grid{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--ll)}.score-item{min-height:126px;padding:18px;display:grid;place-items:center;text-align:center;border-right:1px solid var(--ll);border-bottom:1px solid var(--ll);font:600 11px Poppins;text-transform:uppercase}.score-item:nth-child(even){border-right:0}.score-item:last-child{grid-column:1/-1;border-bottom:0;background:#e7dec9}.passes{display:grid;gap:14px}.pass{padding:26px;border:1px solid var(--dl)}.pass.vip{background:#17354c;border-color:#17354c}.pass small{color:var(--g);font:600 9px Poppins;text-transform:uppercase}.pass h3{font:600 25px Poppins;margin:18px 0 6px}.pass strong{color:var(--g);font:600 11px Poppins;text-transform:uppercase}.pass p{color:var(--dm);font-size:14px}.pass.day{background:var(--l);color:var(--j)}.pass.day p{color:var(--lm)}.criteria{background:#17354c}.criteria .eye{color:var(--g)}.criteria-list{margin-top:42px;border-top:1px solid #ffffff24}.criterion{padding:20px 0;border-bottom:1px solid #ffffff24;display:grid;grid-template-columns:20px 1fr;gap:10px}.criterion span{color:var(--g)}.criterion p{margin:0;color:var(--l);font-size:14px}.process{background:var(--l);color:var(--j)}.steps{display:grid;gap:14px}.step{padding:24px;border:1px solid var(--ll)}.step span{color:var(--g2);font:600 9px Poppins}.step h3{font:600 19px Poppins;margin:14px 0 8px}.step p{color:var(--lm);font-size:14px;margin:0}.apply{background:var(--g);color:var(--j)}.apply .eye{color:var(--j)}.form{margin-top:38px;padding:24px;background:var(--l);display:grid;gap:20px}.field{display:grid;gap:7px}.field label{font:600 9px Poppins;text-transform:uppercase}.field input,.field select{width:100%;padding:13px;border:1px solid var(--ll);background:transparent;border-radius:0}.submit{min-height:54px;border:0;background:var(--j);color:var(--l);font:600 12px Poppins}.status{min-height:20px;font-size:13px}.faq-section{background:var(--l);color:var(--j)}.faq{border-top:1px solid var(--ll)}.faq button{width:100%;min-height:74px;border:0;border-bottom:1px solid var(--ll);background:none;color:var(--j);display:flex;justify-content:space-between;text-align:left;align-items:center;font:600 15px Poppins}.faq button span{font-size:20px}.coming{padding:104px var(--p);background:var(--j2)}.coming+.coming{border-top:1px solid var(--dl)}.coming .eye{color:var(--g)}.coming p{color:var(--dm);margin-top:20px}.footer{padding:70px var(--p) 100px;background:var(--j);border-top:1px solid var(--dl)}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}.end{margin-top:40px;color:var(--dm);font-size:12px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header class="bar"><a href="index.html"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"></a><button class="menu" id="openMenu" aria-label="Open menu"><i></i><i></i></button></header><aside class="drawer" id="drawer"><div class="drawer-top"><img class="logo" src="https://ik.imagekit.io/18ab23oqaj/BIRC%20Ivory%20logo%20dates.png" alt="BIRC"><button class="x" id="closeMenu">×</button></div><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><div><button class="nav-parent" type="button" aria-expanded="true">Influencers <small>⌄</small></button><div class="nav-sub open"><div><a href="#content-creators">Content Creators <span>01</span></a><a href="#rice-masterchef">Rice Masterchef <span>02</span></a><a href="#artists">Artists <span>03</span></a></div></div></div><a href="partnership.html">Partnership</a><a href="plan-visit.html">Plan Visit</a><a href="contact.html">Contact</a></nav><div class="drawer-social"><a href="#">Instagram</a><span>·</span><a href="#">LinkedIn</a></div><p>Bharat Mandapam, Pragati Maidan<br>New Delhi · 23-24-25 October 2026</p></aside><main class="page"><section class="hero" id="content-creators"><span class="eye">Creator Access · BIRC 2026</span><h1 class="title">Your Content. The World's Largest Rice Stage.</h1><p class="lead">Apply for Creator Access. Standout profiles receive a VIP pass for all three days; approved creators receive Day 3 access.</p><a class="btn" href="#apply">Apply as a Creator →</a><div class="stats"><div class="stat"><strong>30,000+</strong><small>Participants</small></div><div class="stat"><strong>120+</strong><small>Countries</small></div><div class="stat"><strong>3,000+</strong><small>Buyers</small></div></div></section><section class="access pad"><header class="head"><span class="eye">More than an event pass</span><h2 class="section-title">Access Matched to Your Creator Profile.</h2></header><div class="access-list"><article class="access-row"><span>01</span><h3>Experience the Scale</h3><p>Capture a global conference, exhibition, networking rooms and the energy of the rice festival.</p></article><article class="access-row"><span>02</span><h3>Meet Real Stories</h3><p>Connect with exporters, buyers, chefs, innovators and leaders from across the rice ecosystem.</p></article><article class="access-row"><span>03</span><h3>Earn VIP Access</h3><p>The strongest profiles receive all-three-day VIP access; other approved creators join the Day 3 experience.</p></article></div></section><section class="score pad"><header class="head"><span class="eye">One application · two access outcomes</span><h2 class="section-title">Your Creator Score Determines Your Pass.</h2><p>Every approved profile is reviewed on the same five parameters. No single metric decides the result.</p></header><div class="score-grid"><div class="score-item">Content Quality & Originality</div><div class="score-item">Audience Relevance</div><div class="score-item">Follower Strength</div><div class="score-item">Engagement & Average Views</div><div class="score-item">Consistency & Professionalism</div></div><div class="passes" style="margin-top:42px"><article class="pass vip"><small>Highest-scoring profiles · VIP</small><h3>VIP Creator Pass</h3><strong>All 3 days · 23-24-25 October</strong><p>Full three-day access to the BIRC conference, exhibition and Rice Festival experience.</p></article><article class="pass day"><small>Other approved creators</small><h3>Day 3 Creator Pass</h3><strong>Day 3 only · 25 October</strong><p>Access to the Day 3 Rice Festival and assigned creator experiences.</p></article></div></section><section class="criteria pad"><span class="eye">Built for the right creators</span><h2 class="section-title">You Create. We Give You a Story Worth Covering.</h2><p class="lead" style="margin-top:20px">Follower count is considered, but relevance, originality, engagement quality and consistency determine the complete creator score.</p><div class="criteria-list"><div class="criterion"><span>✓</span><p>Food, business, agriculture, travel or lifestyle creators</p></div><div class="criterion"><span>✓</span><p>Video-first storytellers on Instagram, YouTube or short-form platforms</p></div><div class="criterion"><span>✓</span><p>Creators who can publish original, high-quality event content</p></div><div class="criterion"><span>✓</span><p>Micro and established creators with a relevant, engaged audience</p></div></div></section><section class="process pad"><header class="head"><span class="eye">Simple by design</span><h2 class="section-title">From Application to Access.</h2></header><div class="steps"><article class="step"><span>01</span><h3>Share Your Profile</h3><p>Submit one short form, no login, account or OTP required.</p></article><article class="step"><span>02</span><h3>Creator Score</h3><p>The BIRC team reviews quality, relevance, followers, engagement and consistency.</p></article><article class="step"><span>03</span><h3>Get Your Access Tier</h3><p>Receive either VIP all-three-day or Day 3 Creator access on WhatsApp.</p></article></div></section><section class="apply pad" id="apply"><span class="eye">Limited creator opportunities</span><h2 class="section-title" style="margin-top:20px">The Stories Will Be Created With or Without You.</h2><p style="margin:22px 0 0">Apply now to be considered for BIRC 2026 Creator Access.</p><form class="form" id="creatorForm"><header><span class="eye" style="color:var(--g2)">Creator Access Application</span><h3 style="font:600 24px Poppins;margin:12px 0 0">Apply in Under 60 Seconds.</h3></header><div class="field"><label for="creator-name">Your Name *</label><input id="creator-name" name="name" required placeholder="Full name"></div><div class="field"><label for="creator-phone">WhatsApp Number *</label><input id="creator-phone" name="phone" required type="tel" placeholder="+91"></div><div class="field"><label for="creator-email">Email</label><input id="creator-email" name="email" type="email" placeholder="you@example.com"></div><div class="field"><label for="creator-platform">Instagram, YouTube or Creator Profile *</label><select id="creator-platform" name="platform" required><option value="">Choose platform</option><option>Instagram</option><option>YouTube</option><option>Other creator profile</option></select><input name="profile" required placeholder="Paste link or @handle"></div><button class="submit" type="submit">Submit Creator Profile →</button><div class="status" id="creatorStatus" role="status"></div></form></section><section class="faq-section pad"><header class="head"><span class="eye">Before you apply</span><h2 class="section-title">Quick Answers.</h2></header><div class="faq"><button>How is the VIP Creator Pass decided? <span>+</span></button></div><div class="faq"><button>What if I do not qualify for VIP? <span>+</span></button></div><div class="faq"><button>Does follower count alone decide the pass? <span>+</span></button></div><div class="faq"><button>Does applying guarantee creator access? <span>+</span></button></div><div class="faq"><button>What content will I need to create? <span>+</span></button></div></section><section class="coming" id="rice-masterchef"><span class="eye">Coming next</span><h2 class="section-title">Rice Masterchef</h2><p>This section will be built after the approved screenshots and content are supplied.</p></section><section class="coming" id="artists"><span class="eye">Content pending</span><h2 class="section-title">Artists</h2><p>This section is reserved for the approved Rice Art Showcase content.</p></section></main><footer class="page footer"><div class="links"><a href="index.html">Home</a><a href="conference.html">Conference</a><a href="exhibition.html">Exhibition</a><a href="experience.html">Experience</a><a href="partnership.html">Partnership</a><a href="contact.html">Contact</a></div><div class="end">© 2026 Bharat International Rice Conference<br>Privacy · Terms · Code of Conduct</div></footer><script>const drawer=document.getElementById('drawer');function menu(open){drawer.classList.toggle('open',open);document.body.classList.toggle('lock',open)}openMenu.onclick=()=>menu(true);closeMenu.onclick=()=>menu(false);drawer.querySelectorAll('a').forEach(a=>a.onclick=()=>menu(false));const parent=document.querySelector('.nav-parent'),sub=document.querySelector('.nav-sub');parent.onclick=()=>{const open=parent.getAttribute('aria-expanded')==='true';parent.setAttribute('aria-expanded',String(!open));sub.classList.toggle('open',!open)};creatorForm.onsubmit=e=>{e.preventDefault();const d=new FormData(creatorForm),subject=encodeURIComponent('BIRC 2026 Creator Access Application'),body=encodeURIComponent(`Name: ${d.get('name')}\nWhatsApp: ${d.get('phone')}\nEmail: ${d.get('email')}\nPlatform: ${d.get('platform')}\nProfile: ${d.get('profile')}`);creatorStatus.textContent='Opening your email app…';location.href=`mailto:booking@birc.in?subject=${subject}&body=${body}`};</script></body></html>
          HTML
      - name: Add Influencers menu and normalize date copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','about.html','conference.html','exhibition.html','experience.html','partnership.html','plan-visit.html','contact.html']
          group='''<div class="influencer-group"><button class="influencer-parent" type="button" aria-expanded="false">Influencers <small>⌄</small></button><div class="influencer-sub"><div><a href="creators.html#content-creators">Content Creators <span>01</span></a><a href="creators.html#rice-masterchef">Rice Masterchef <span>02</span></a><a href="creators.html#artists">Artists <span>03</span></a></div></div></div>'''
          css='''.influencer-parent{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;border-bottom:1px solid var(--dl);background:none;color:var(--l);font:600 27px/1.2 Poppins,sans-serif;letter-spacing:-.05em;text-align:left}.influencer-sub{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .42s var(--e),opacity .25s}.influencer-sub>div{overflow:hidden}.influencer-sub.open{grid-template-rows:1fr;opacity:1}.influencer-sub a{display:flex!important;justify-content:space-between;padding:10px 0 10px 18px!important;border-bottom:1px solid var(--dl);color:var(--dm)!important;font:500 12px Poppins,sans-serif!important}.influencer-sub a span{order:2;color:var(--g);font:600 9px Poppins}.influencer-parent small{transition:transform .3s var(--e)}.influencer-parent[aria-expanded=true] small{transform:rotate(180deg)}'''
          js="""const influencerParent=document.querySelector('.influencer-parent'),influencerSub=document.querySelector('.influencer-sub');if(influencerParent&&influencerSub)influencerParent.addEventListener('click',()=>{const open=influencerParent.getAttribute('aria-expanded')==='true';influencerParent.setAttribute('aria-expanded',String(!open));influencerSub.classList.toggle('open',!open)});"""
          for name in pages:
              p=Path(name);s=p.read_text()
              # Insert above first Partnership navigation link.
              if 'class="influencer-group"' not in s:
                  s,n=re.subn(r'(<a href="partnership\.html">Partnership</a>)',group+r'\1',s,count=1)
                  if n!=1:raise SystemExit(f'Partnership nav link missing in {name}')
              if '.influencer-parent{' not in s:s=s.replace('</style>',css+'</style>',1)
              if 'const influencerParent=' not in s:s=s.replace('</script></body></html>',js+'</script></body></html>',1)
              # User-approved visible date format.
              s=s.replace('23–25','23-24-25').replace('23-25','23-24-25')
              p.write_text(s)
          # Context docs.
          p=Path('context.md');s=p.read_text()
          block='''\n### `creators.html`\n\nInfluencers landing page with three anchored sections: Content Creators (`#content-creators`), Rice Masterchef (`#rice-masterchef`), and Artists (`#artists`). Content Creators is implemented from approved mobile screenshots, including access outcomes, scoring factors, eligibility, application flow, form fields, and FAQ questions. Rice Masterchef must be built only after screenshots are supplied. Artists remains reserved for approved Rice Art Showcase content. Influencers appears immediately above Partnership as a three-item hamburger submenu across all current pages.\n'''
          if '### `creators.html`' not in s:s=s.replace('### `partnership.html`',block+'\n### `partnership.html`')
          s=s.replace('5. Partnership\n6. Plan Visit\n7. Contact','5. Experience\n6. Influencers\n7. Partnership\n8. Plan Visit\n9. Contact') if '5. Partnership' in s else s
          s=s.replace('Event dates: 23–25 October 2026','Event dates: 23-24-25 October 2026')
          rule='Visible event date ranges use `23-24-25`, never `23–25` or `23-25`. Influencers sits directly above Partnership and contains exactly Content Creators, Rice Masterchef, and Artists.'
          if rule not in s:s=s.replace('## 7. Design decisions that must persist',rule+'\n\n## 7. Design decisions that must persist')
          p.write_text(s)
          PY
      - name: Commit site updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creators.html index.html about.html conference.html exhibition.html experience.html partnership.html plan-visit.html contact.html context.md
          git commit -m 'Add Content Creators page and Influencers navigation'
          git push
